name: SPIRALIX Syadrix Validate
on:
  push:
    paths: ['config/spiralix-syadrix.json','tools/spiralix_syadrix.py','.github/workflows/spiralix-syadrix.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/spiralix_syadrix.py
