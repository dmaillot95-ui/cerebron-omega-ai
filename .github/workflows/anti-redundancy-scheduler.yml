name: CEREBRON Anti Redundancy Scheduler Validate
on:
  push:
    paths: ['config/anti-redundancy-scheduler.json','tools/anti_redundancy_scheduler.py','.github/workflows/anti-redundancy-scheduler.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/anti_redundancy_scheduler.py
