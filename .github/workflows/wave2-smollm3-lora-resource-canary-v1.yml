name: CEREBRON Wave2 SmolLM3 LoRA Resource Canary
on:
  push:
    branches: ['feat/wave2-parallel-ai-baselines-v1']
    paths:
      - 'config/wave2-smollm3-lora-resource-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache SmolLM3
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-smollm3-3b-a07cc9a04f16550a088caea529712d1d335b0ac1
      - name: Install CPU LoRA stack
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check --no-cache-dir "transformers>=4.53,<5" peft accelerate safetensors sentencepiece
      - name: Compile
        run: python -m py_compile tools/wave2_smollm3_lora_resource_canary_v1.py
      - name: Execute one real LoRA backward step
        run: python tools/wave2_smollm3_lora_resource_canary_v1.py
      - name: Verify canary receipt
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path("receipts/wave2/smollm3-3b-lora-resource-canary.json").read_text())
          assert d["real_training_step"] is True
          assert d["weights_changed"] is True
          assert d["decision"]=="RESOURCE_CANARY_PASS"
          print("SMOLLM3_LORA_RESOURCE_CANARY=PASS",d["max_rss_kb"],d["elapsed_s"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave2-smollm3-lora-resource-canary-${{ github.run_id }}
          path: receipts/wave2/smollm3-3b-lora-resource-canary.json
          if-no-files-found: warn
      - name: Persist canary receipt
        if: success()
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/wave2/smollm3-3b-lora-resource-canary.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: SmolLM3 3B LoRA resource canary ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin feat/wave2-parallel-ai-baselines-v1 && git push && exit 0
            sleep 5
          done
          exit 1
