name: ELYSIUM D4 Fresh Dual-Core Fusion Canary
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'config/elysium-d4-fresh-fusion-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fusion:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
      HOLDOUT_PATH: elysium/D4/ELYSIUM-D4-HOLDOUT-V1.json
      MODEL_A: Qwen/Qwen3-4B
      REV_A: 1cfa9a7208912126459214e8b04321603b3df60c
      MODEL_B: HuggingFaceTB/SmolLM3-3B
      REV_B: a07cc9a04f16550a088caea529712d1d335b0ac1
      HF_HOME: /tmp/hf-model
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: |
          python -m pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir "transformers>=4.53,<5" accelerate safetensors sentencepiece huggingface_hub
      - name: Execute fresh private dual-core fusion canary
        run: |
          mkdir -p receipts/elysium/d4
          python - <<'PY'
          import gc,hashlib,json,os,pathlib,re,resource,secrets,tempfile,time,torch
          from collections import Counter,defaultdict
          from huggingface_hub import HfApi,hf_hub_download
          from transformers import AutoTokenizer,AutoModelForCausalLM

          token=os.environ.get("HF_TOKEN","")
          if not token: raise SystemExit("HF_TOKEN_MISSING")
          repo=os.environ["HF_REPO"]; holdout_path=os.environ["HOLDOUT_PATH"]
          api=HfApi(token=token)
          info=api.repo_info(repo_id=repo,repo_type="model")
          if not bool(getattr(info,"private",False)): raise SystemExit("HF_REPO_NOT_PRIVATE")

          files=set(api.list_repo_files(repo_id=repo,repo_type="model"))
          created_now=False
          if holdout_path in files:
              fn=pathlib.Path(hf_hub_download(repo_id=repo,filename=holdout_path,repo_type="model",token=token,force_download=True))
              raw=fn.read_bytes(); suite=json.loads(raw)
          else:
              rng=secrets.SystemRandom(); tasks=[]
              def add(domain,prompt,expected):
                  tasks.append({"id":f"D4H-{len(tasks)+1:03d}","domain":domain,"prompt":prompt,"expected":expected})

              for _ in range(4):
                  a=rng.randint(20,120); b=rng.randint(8,95)
                  mode=rng.randrange(3)
                  if mode==0:
                      add("claim_verification",f"Claim: {a}+{b}={a+b}. Evidence: direct integer arithmetic. Return only PASS, FAIL, or INSUFFICIENT.","PASS")
                  elif mode==1:
                      add("claim_verification",f"Claim: {a}+{b}={a+b+rng.randint(1,4)}. Evidence: direct integer arithmetic. Return only PASS, FAIL, or INSUFFICIENT.","FAIL")
                  else:
                      n=rng.randint(15,80)
                      add("claim_verification",f"Claim: every positive integer has property P. Evidence checks only integers 1 through {n}. Return only PASS, FAIL, or INSUFFICIENT.","INSUFFICIENT")

              for _ in range(4):
                  mode=rng.randrange(3); n=rng.randint(5,50)
                  if mode==0:
                      bad=2*rng.randint(2,30)
                      if bad%4==0: bad+=2
                      add("counterexample_search",f"Claim: every even integer is divisible by 4. Candidate counterexample: {bad}. PASS means the claim survives the supplied evidence. Return only PASS, FAIL, or INSUFFICIENT.","FAIL")
                  elif mode==1:
                      add("counterexample_search",f"Claim: x^2 is nonnegative for all listed x. Listed values: {-n}, {-n+2}, 0, {n-1}, {n}. Return only PASS, FAIL, or INSUFFICIENT.","PASS")
                  else:
                      lim=rng.randint(30,180)
                      add("counterexample_search",f"A search checked integers 1 through {lim} and found no counterexample. The claim says no counterexample exists for all positive integers. Return only PASS, FAIL, or INSUFFICIENT.","INSUFFICIENT")

              for _ in range(4):
                  x=rng.randint(5,70); mode=rng.randrange(3)
                  if mode==0:
                      add("error_detection",f"Derivation: x={x}; 3x={3*x}; 3x-2={3*x-2}. Return only PASS, FAIL, or INSUFFICIENT.","PASS")
                  elif mode==1:
                      add("error_detection",f"Derivation: x={x}; 3x={3*x}; then 3x-2={3*x-1}. Return only PASS, FAIL, or INSUFFICIENT.","FAIL")
                  else:
                      val=rng.randint(30,160)
                      add("error_detection",f"A derivation reports final value {val}, but the original inputs and intermediate steps are unavailable. Return only PASS, FAIL, or INSUFFICIENT.","INSUFFICIENT")

              for _ in range(4):
                  seed=rng.randint(10000,99999); inp=rng.randint(4,14); out=inp*inp+1; mode=rng.randrange(3)
                  if mode==0:
                      add("reproduction",f"Reference: code=v2, seed={seed}, input={inp}, output={out}. Reproduction uses the same pinned code, seed, input and output. Return only PASS, FAIL, or INSUFFICIENT.","PASS")
                  elif mode==1:
                      add("reproduction",f"Reference: code=v2, seed={seed}, input={inp}, output={out}. Reproduction uses the same pinned code, seed and input but reports output={out+rng.randint(1,3)}. Return only PASS, FAIL, or INSUFFICIENT.","FAIL")
                  else:
                      add("reproduction",f"Reference output is {out}. The reproduction report omits both code revision and random seed. Return only PASS, FAIL, or INSUFFICIENT.","INSUFFICIENT")

              for _ in range(4):
                  n=rng.randint(20,120); mode=rng.randrange(3)
                  if mode==0:
                      add("robustness",f"A method passes {n} internal cases and a frozen external transfer set, with no critical regression. The claim is only that it passed those stated tests. Return only PASS, FAIL, or INSUFFICIENT.","PASS")
                  elif mode==1:
                      add("robustness",f"A method passes {n} internal cases but fails the frozen transfer set. The claim says it generalizes to the transfer distribution. Return only PASS, FAIL, or INSUFFICIENT.","FAIL")
                  else:
                      add("robustness",f"A method passes {n} internal cases. No transfer or red-team evidence exists, but broad reliability is claimed. Return only PASS, FAIL, or INSUFFICIENT.","INSUFFICIENT")

              for _ in range(4):
                  pct=rng.randint(55,96); mode=rng.randrange(3)
                  if mode==0:
                      add("calibration","Evidence supports a finite scoped result, and the report states only that finite scoped result. Return only PASS, FAIL, or INSUFFICIENT.","PASS")
                  elif mode==1:
                      add("calibration",f"Internal accuracy is {pct}%. The report declares universal correctness with certainty. Return only PASS, FAIL, or INSUFFICIENT.","FAIL")
                  else:
                      add("calibration",f"Internal accuracy is {pct}%. No transfer evidence or uncertainty interval is available, but the question asks whether broad reliability is established. Return only PASS, FAIL, or INSUFFICIENT.","INSUFFICIENT")

              assert len(tasks)==24
              counts=Counter(t["domain"] for t in tasks)
              assert len(counts)==6 and all(v==4 for v in counts.values())
              suite={
                "schema":"ELYSIUM_D4_FRESH_HOLDOUT_V1",
                "classification":"D4_FRESH_PRIVATE_FUSION_HOLDOUT",
                "deny_training":True,
                "training_eligible":False,
                "exact_prompts_public":False,
                "generation_policy":"SYSTEM_RANDOM_ONE_TIME_SEAL_BEFORE_MODEL_INFERENCE",
                "task_count":24,
                "domain_counts":dict(sorted(counts.items())),
                "tasks":tasks
              }
              raw=(json.dumps(suite,indent=2,ensure_ascii=False)+"\n").encode()
              with tempfile.NamedTemporaryFile("wb",delete=False) as t:
                  t.write(raw); src=t.name
              api.upload_file(path_or_fileobj=src,path_in_repo=holdout_path,repo_id=repo,repo_type="model",commit_message="Seal ELYSIUM D4 fresh fusion holdout")
              created_now=True

          if suite.get("classification")!="D4_FRESH_PRIVATE_FUSION_HOLDOUT" or suite.get("deny_training") is not True or suite.get("training_eligible") is not False:
              raise SystemExit("HOLDOUT_CLASSIFICATION_FAIL")
          if len(suite.get("tasks",[]))!=24: raise SystemExit("HOLDOUT_COUNT_FAIL")
          raw=(json.dumps(suite,indent=2,ensure_ascii=False)+"\n").encode()
          holdout_sha=hashlib.sha256(raw).hexdigest()
          fn=pathlib.Path(hf_hub_download(repo_id=repo,filename=holdout_path,repo_type="model",token=token,force_download=True))
          if hashlib.sha256(fn.read_bytes()).hexdigest()!=holdout_sha: raise SystemExit("HOLDOUT_READBACK_SHA_FAIL")

          tasks=suite["tasks"]
          def norm(s):
              m=re.search(r"\b(PASS|FAIL|INSUFFICIENT)\b",s.upper())
              return m.group(1) if m else ""

          def load(mid,rev):
              mi=HfApi().model_info(mid,revision=rev)
              if mi.sha!=rev: raise SystemExit("REVISION_MISMATCH")
              tok=AutoTokenizer.from_pretrained(mid,revision=rev)
              if tok.pad_token_id is None: tok.pad_token_id=tok.eos_token_id
              model=AutoModelForCausalLM.from_pretrained(mid,revision=rev,torch_dtype=torch.bfloat16,low_cpu_mem_usage=True)
              model.eval(); return tok,model

          def render(tok,system,user):
              msgs=[{"role":"system","content":system},{"role":"user","content":user}]
              try:
                  return tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True,enable_thinking=False)
              except TypeError:
                  return tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True)

          def infer(tok,model,system,user,n=8):
              p=render(tok,system,user); x=tok(p,return_tensors="pt")
              with torch.inference_mode():
                  y=model.generate(**x,max_new_tokens=n,do_sample=False,pad_token_id=tok.pad_token_id,eos_token_id=tok.eos_token_id)
              return tok.decode(y[0][x["input_ids"].shape[-1]:],skip_special_tokens=True).strip()

          rows={t["id"]:{"id":t["id"],"domain":t["domain"],"prompt":t["prompt"],"expected":t["expected"]} for t in tasks}
          t0=time.time()

          tok,model=load(os.environ["MODEL_A"],os.environ["REV_A"])
          for i,t in enumerate(tasks,1):
              out=infer(tok,model,"Return only PASS, FAIL, or INSUFFICIENT. /no_think",t["prompt"],6)
              rows[t["id"]]["qwen"]=norm(out)
              if i%6==0: print(f"QWEN_BASE {i}/24",flush=True)
          del model,tok; gc.collect()

          tok,model=load(os.environ["MODEL_B"],os.environ["REV_B"])
          for i,t in enumerate(tasks,1):
              r=rows[t["id"]]
              out=infer(tok,model,"Return only PASS, FAIL, or INSUFFICIENT. /no_think",t["prompt"],6)
              r["smol"]=norm(out)
              if r["qwen"]!=r["smol"]:
                  j=infer(
                    tok,model,
                    "You are one core of a two-model verifier. You do not have an answer key. Compare the two candidate verdicts using only the supplied evidence. Return exactly QWEN, SMOL, or UNSURE. /no_think",
                    f"Question: {t['prompt']}\nQWEN candidate: {r['qwen']}\nSMOL candidate: {r['smol']}",8)
                  up=j.upper()
                  r["smol_judge"]="QWEN" if re.search(r"\bQWEN\b",up) else "SMOL" if re.search(r"\bSMOL\b",up) else "UNSURE"
              else:
                  r["smol_judge"]="AGREE"
              if i%6==0: print(f"SMOL_BASE_JUDGE {i}/24",flush=True)
          del model,tok; gc.collect()

          tok,model=load(os.environ["MODEL_A"],os.environ["REV_A"])
          for i,t in enumerate(tasks,1):
              r=rows[t["id"]]
              if r["qwen"]!=r["smol"]:
                  j=infer(
                    tok,model,
                    "You are one core of a two-model verifier. You do not have an answer key. Compare the two candidate verdicts using only the supplied evidence. Return exactly QWEN, SMOL, or UNSURE. /no_think",
                    f"Question: {t['prompt']}\nQWEN candidate: {r['qwen']}\nSMOL candidate: {r['smol']}",8)
                  up=j.upper()
                  r["qwen_judge"]="QWEN" if re.search(r"\bQWEN\b",up) else "SMOL" if re.search(r"\bSMOL\b",up) else "UNSURE"
              else:
                  r["qwen_judge"]="AGREE"
              if i%6==0: print(f"QWEN_JUDGE {i}/24",flush=True)
          del model,tok; gc.collect()

          qc=sc=fc=0; switches=helpful=harmful=0
          by=defaultdict(lambda:{"qwen":0,"smol":0,"fusion":0,"total":0})
          private_rows=[]
          for t in tasks:
              r=rows[t["id"]]; exp=t["expected"]
              qok=r["qwen"]==exp; sok=r["smol"]==exp
              qc+=int(qok); sc+=int(sok)
              if r["qwen"]==r["smol"]:
                  fusion=r["smol"]; reason="AGREE"
              elif r["qwen_judge"]=="QWEN" and r["smol_judge"]=="QWEN":
                  fusion=r["qwen"]; reason="DUAL_JUDGE_QWEN"
              else:
                  fusion=r["smol"]; reason="SMOL_PRIMARY"
              fok=fusion==exp; fc+=int(fok)
              switched=(fusion==r["qwen"] and r["qwen"]!=r["smol"])
              switches+=int(switched)
              helpful+=int(switched and qok and not sok)
              harmful+=int(switched and sok and not qok)
              d=by[t["domain"]]; d["total"]+=1; d["qwen"]+=int(qok); d["smol"]+=int(sok); d["fusion"]+=int(fok)
              private_rows.append({
                "id":t["id"],"domain":t["domain"],"expected":exp,
                "qwen":r["qwen"],"smol":r["smol"],
                "qwen_judge":r["qwen_judge"],"smol_judge":r["smol_judge"],
                "fusion":fusion,"fusion_reason":reason,
                "qwen_correct":qok,"smol_correct":sok,"fusion_correct":fok
              })

          best=max(qc,sc); gain=fc-best
          critical_domain_regression=any(v["fusion"] < max(v["qwen"],v["smol"])-2 for v in by.values())
          if gain>0 and not critical_domain_regression:
              decision="D4_FRESH_FUSION_PASS_MEASURED_GAIN"
          else:
              decision="D4_FRESH_FUSION_HOLD_NO_MEASURED_GAIN"

          summary={
            "schema":"ELYSIUM_D4_FRESH_DUAL_CORE_FUSION_CANARY_V1",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "source_d3_run_id":36130283226,
            "source_d4_precheck_run_id":36134272684,
            "holdout_created_now":created_now,
            "holdout_path":holdout_path,
            "holdout_sha256":holdout_sha,
            "holdout_deny_training":True,
            "exact_prompts_public":False,
            "weights_changed":False,
            "model_a":{"id":os.environ["MODEL_A"],"revision":os.environ["REV_A"]},
            "model_b":{"id":os.environ["MODEL_B"],"revision":os.environ["REV_B"]},
            "fusion_policy":"AGREE_ELSE_IF_BOTH_JUDGES_SELECT_QWEN_USE_QWEN_ELSE_SMOL_PRIMARY",
            "policy_frozen_before_holdout_generation":True,
            "metrics":{
              "task_count":24,"qwen_correct":qc,"smol_correct":sc,"best_single_correct":best,
              "fusion_correct":fc,"fusion_gain_over_best_single":gain,
              "switches_to_qwen":switches,"helpful_switches":helpful,"harmful_switches":harmful,
              "critical_domain_regression":critical_domain_regression,
              "domain":dict(sorted(by.items()))
            },
            "decision":decision,
            "independent_evidence_count":0,
            "two_models_not_two_independent_proofs":True,
            "claim_ceiling":"FRESH_PRIVATE_D4_DUAL_CORE_FUSION_CANARY_NO_RUNTIME_ACTIVATION"
          }
          private={"schema":"ELYSIUM_D4_FRESH_DUAL_CORE_PRIVATE_RESULT_V1","summary":summary,"rows":private_rows}
          praw=(json.dumps(private,indent=2,ensure_ascii=False)+"\n").encode(); psha=hashlib.sha256(praw).hexdigest()
          with tempfile.NamedTemporaryFile("wb",delete=False) as tf:
              tf.write(praw); src=tf.name
          private_path=f"elysium/D4-results/run-{os.environ['GITHUB_RUN_ID']}/private.json"
          api.upload_file(path_or_fileobj=src,path_in_repo=private_path,repo_id=repo,repo_type="model",commit_message=f"ELYSIUM D4 fresh fusion result {os.environ['GITHUB_RUN_ID']}")
          dst=pathlib.Path(hf_hub_download(repo_id=repo,filename=private_path,repo_type="model",token=token,force_download=True))
          if hashlib.sha256(dst.read_bytes()).hexdigest()!=psha: raise SystemExit("PRIVATE_RESULT_READBACK_SHA_FAIL")
          summary["private_result_path"]=private_path
          summary["private_result_sha256"]=psha
          summary["hf_private_readback_sha_pass"]=True
          summary["receipt_sha256"]=hashlib.sha256(json.dumps(summary,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          pathlib.Path("receipts/elysium/d4/elysium-d4-fresh-fusion-canary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print("SUMMARY "+json.dumps(summary,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elysium-d4-fresh-fusion-canary
          path: receipts/elysium/d4/elysium-d4-fresh-fusion-canary.json
          if-no-files-found: error
      - name: Persist D4 fusion receipt
        if: success()
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/elysium/d4/elysium-d4-fresh-fusion-canary.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: ELYSIUM D4 fresh fusion canary ${{ github.run_id }}"
          git pull --rebase origin feat/cerebron-ai-platform-mvp
          git push origin HEAD:feat/cerebron-ai-platform-mvp
