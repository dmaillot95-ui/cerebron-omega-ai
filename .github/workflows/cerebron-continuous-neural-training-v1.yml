name: CEREBRON Continuous Neural Training Controller

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
      - feat/continuous-neural-training-v1
    paths:
      - 'config/continuous-neural-training-v1.json'
      - 'config/all-ai-neural-training-coverage-v1.json'
      - 'training/EIGHT_AI_CONTINUOUS_BATCH_POLICY.json'
      - 'training/continuous-releases/**'
      - 'training/wave3a-backend/**'
      - 'evolution/continuous_neural_training_controller_v1.py'
      - '.github/workflows/cerebron-continuous-neural-training-v1.yml'

permissions:
  contents: read
  actions: write

jobs:
  plan-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build fail-closed plan
        run: |
          python -m py_compile evolution/continuous_neural_training_controller_v1.py
          python evolution/continuous_neural_training_controller_v1.py
      - name: Enforce controller invariants
        run: |
          python - <<'PY'
          import json
          c=json.load(open("config/continuous-neural-training-v1.json"))
          p=json.load(open("artifacts/continuous-neural-training-plan-v1.json"))
          assert c["max_parallel_real_trainings"]==4
          assert p["max_parallel"]==4
          assert p["selected_count"]<=4
          assert p["training_executed"] is False
          assert p["weights_changed"] is False
          closed=set(c["closed_roles"])
          for x in p["selected"]:
              if x["role"] in closed:
                  rel=next(r for r in p["releases"] if r.get("release_id")==x["release_id"])
                  assert "CLOSED_ROLE_REUSE_DENY" not in rel.get("reasons",[])
          print("CONTINUOUS_TRAINING_CONTROLLER_GUARD=PASS",p["status"],p["selected_count"])
          PY
      - name: Enforce WAVE3A compute backend gate
        run: |
          python - <<'PY'
          import json,pathlib
          p=json.load(open("artifacts/continuous-neural-training-plan-v1.json"))
          selected=[x for x in p.get("selected",[]) if x.get("wave")=="WAVE3A"]
          if not selected:
              print("WAVE3A_COMPUTE_BACKEND_GATE=NOT_SELECTED")
              raise SystemExit(0)
          path=pathlib.Path("training/wave3a-backend/WAVE3A_COMPUTE_BACKEND_EVIDENCE_V1.json")
          if not path.is_file():
              raise SystemExit("WAVE3A_COMPUTE_BACKEND_EVIDENCE_MISSING")
          e=json.loads(path.read_text())
          assert e.get("schema")=="CEREBRON_WAVE3A_COMPUTE_BACKEND_EVIDENCE_V1"
          assert e.get("wave")=="WAVE3A"
          assert e.get("status")=="VERIFIED_EXECUTABLE_BACKEND"
          assert e.get("target_model_canary_pass") is True
          assert e.get("real_training_backend") is True
          assert e.get("backend_can_change_weights") is True
          print("WAVE3A_COMPUTE_BACKEND_GATE=PASS",len(selected))
          PY
      - name: Dispatch explicitly released training workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          d=json.load(open("artifacts/continuous-neural-training-dispatch-v1.json"))
          reqs=d.get("requests",[])
          if not reqs:
              print("NO_DISPATCH_REQUESTS")
              raise SystemExit(0)
          repo=os.environ["GH_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          for r in reqs:
              body=json.dumps({"ref":r["ref"],"inputs":r.get("inputs",{})})
              url=f"https://api.github.com/repos/{repo}/actions/workflows/{r['workflow']}/dispatches"
              cmd=["curl","--fail-with-body","-sS","-X","POST",
                   "-H","Accept: application/vnd.github+json",
                   "-H",f"Authorization: Bearer {token}",
                   "-H","X-GitHub-Api-Version: 2022-11-28",
                   url,"-d",body]
              subprocess.run(cmd,check=True)
              print("DISPATCHED",r["role"],r["workflow"],r["ref"],r["release_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuous-neural-training-controller
          path: |
            artifacts/continuous-neural-training-plan-v1.json
            artifacts/continuous-neural-training-dispatch-v1.json
          if-no-files-found: error
          retention-days: 30
