name: RDX Semantic Multilingual Ablation DEV V4
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'config/rdx-semantic-multilingual-ablation-dev-v4-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install retriever runtime
        run: |
          python -m pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir sentence-transformers numpy huggingface_hub
      - name: Run bilingual retriever ablation
        run: python runtime/rdx_semantic_multilingual_ablation_dev_v4.py
      - uses: actions/upload-artifact@v4
        with:
          name: rdx-semantic-multilingual-ablation-dev-v4
          path: receipts/rdx/rdx-semantic-multilingual-ablation-dev-v4.json
          if-no-files-found: error
      - name: Persist public DEV receipt
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/rdx/rdx-semantic-multilingual-ablation-dev-v4.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: RDX semantic multilingual DEV V4 ${{ github.run_id }}"
          git pull --rebase origin feat/cerebron-ai-platform-mvp
          git push origin HEAD:feat/cerebron-ai-platform-mvp
