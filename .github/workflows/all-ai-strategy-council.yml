name: CEREBRON All-AI Strategy Council
on:
  push:
    branches: [main]
    paths:
      - config/all-ai-strategy-council-trigger.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  council:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - shard: S1
            ais: CEREBRON,SAPHEA,SPIRALION,ETHERION,HYPERION,ASTRION,METRION,AFAH
          - shard: S2
            ais: AELYS,ELYRA,SAPHEA_MICRO,ELYSION,ELYSIUM,SAELION,NEXUS,F148-ALPHA
          - shard: S3
            ais: F152-BETA,F153-GAMMA,F150-DELTA,F154-EPSILON,F155-ZETA,F156-ETA,F157-THETA,F158-IOTA
          - shard: S4
            ais: F159-KAPPA,F160-LAMBDA,F161-MU,F163-XI,F164-OMICRON,F165-PI,F166-RHO
          - shard: S5
            ais: F167-SIGMA,F168-TAU,F169-UPSILON,F170-PHI,F171-CHI,F172-PSI,F149-OMEGA
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight Python syntax
        run: |
          python -m py_compile tools/all_ai_strategy_council_worker.py
          python -m py_compile tools/all_ai_strategy_council_batch.py
          python -m py_compile tools/all_ai_strategy_council_score.py
      - name: Cache Qwen3-4B council model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-4b-1cfa9a7208912126459214e8b04321603b3df60c
      - run: pip install --quiet "transformers>=4.53,<5" accelerate safetensors sentencepiece
      - name: Execute council shard
        run: |
          python tools/all_ai_strategy_council_batch.py             --ais "${{ matrix.ais }}"             --run-id "${{ github.run_id }}"             --output-root "artifacts/council/${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: council-shard-${{ matrix.shard }}
          path: artifacts/council/${{ matrix.shard }}

  audit:
    needs: council
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: council-shard-*
          path: downloaded/council
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit contribution quality and redundancy
        run: |
          python tools/all_ai_strategy_council_score.py             --glob "downloaded/council/**/receipt.json"             --run-id "${{ github.run_id }}"             --output "receipts/council/all-ai-strategy-council-${{ github.run_id }}.json"
      - name: Verify complete 38-AI gate
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(f"receipts/council/all-ai-strategy-council-{os.environ['GITHUB_RUN_ID']}.json")
          d=json.loads(p.read_text())
          assert d["receipt_count"] == 38, d["receipt_count"]
          assert d["executed_count"] == 38, d["executed_count"]
          assert d["parse_pass_count"] == 38, d["parse_pass_count"]
          assert d["scorable_count"] == 38, d["scorable_count"]
          assert d["unique_lineage_fingerprints"] == 1, d["unique_lineage_fingerprints"]
          assert d["independent_evidence_count"] == 0, d["independent_evidence_count"]
          print("COUNCIL_38_GATE_PASS", d["receipt_count"], d["parse_pass_count"], d["scorable_count"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-ai-strategy-council-audit-${{ github.run_id }}
          path: receipts/council/all-ai-strategy-council-${{ github.run_id }}.json
      - name: Persist council audit
        if: success()
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/council/
          git diff --cached --quiet && exit 0
          git commit -m "receipt: all-AI strategy council audit V2"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
