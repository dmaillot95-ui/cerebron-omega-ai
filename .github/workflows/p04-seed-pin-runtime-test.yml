name: P04 Seed Pin Runtime Test
on:
  push:
    paths:
      - '.github/workflows/p04-seed-pin-runtime-test.yml'
      - 'config/p04-seed-pin-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pin-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: Qwen/Qwen3-4B
            revision: 1cfa9a7
          - model: Qwen/Qwen3-4B-Base
            revision: 906bfd4
          - model: HuggingFaceTB/SmolLM3-3B
            revision: a07cc9a
          - model: HuggingFaceTB/SmolLM3-3B-Base
            revision: d78a42f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet --upgrade huggingface_hub
      - name: Resolve pinned revision without downloading weights
        env:
          MODEL_ID: ${{ matrix.model }}
          REVISION: ${{ matrix.revision }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi, hf_hub_download
          m=os.environ["MODEL_ID"]; r=os.environ["REVISION"]
          info=HfApi().model_info(m, revision=r)
          assert info.sha and info.sha.startswith(r)
          f=hf_hub_download(repo_id=m,filename="config.json",revision=r)
          assert os.path.getsize(f)>0
          print("MODEL="+m)
          print("RESOLVED_SHA="+info.sha)
          print("PIN_RESOLVE=PASS")
          print("CONFIG_LOAD=PASS")
          import json
          os.makedirs("receipts/p04",exist_ok=True)
          key=m.replace("/","__")
          receipt={"schema":"p04-pin-receipt-v1","model":m,"requested_revision":r,"resolved_sha":info.sha,"pin_resolve":"PASS","config_load":"PASS"}
          open(f"receipts/p04/{key}.json","w").write(json.dumps(receipt,indent=2)+"\\n")
          PY
      - name: Commit non-sensitive receipt
        env:
          MODEL_ID: ${{ matrix.model }}
        run: |
          git config user.name "cerebron-actions"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/p04/
          git diff --cached --quiet && exit 0
          git commit -m "P04 receipt: ${MODEL_ID}"
          for n in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((n*2))
          done
          exit 1
