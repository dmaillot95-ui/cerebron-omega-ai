name: R0 R1 Hard Cold Real
on:
  push:
    paths:
      - '.github/workflows/r0-r1-hard-cold-real.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet transformers accelerate sentencepiece torch
      - name: Execute real R0 delta blind fusion benchmark
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib,re
          from pathlib import Path
          import torch
          from transformers import AutoTokenizer,AutoModelForCausalLM
          spec=json.load(open("benchmarks/r0-r1-hard-cold-v2.json"))
          mid="HuggingFaceTB/SmolLM3-3B"; rev="a07cc9a04f16550a088caea529712d1d335b0ac1"
          tok=AutoTokenizer.from_pretrained(mid,revision=rev)
          mdl=AutoModelForCausalLM.from_pretrained(mid,revision=rev,torch_dtype="auto",low_cpu_mem_usage=True)
          def gen(prompt,max_new=180):
              msgs=[{"role":"user","content":prompt}]
              text=tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True)
              x=tok(text,return_tensors="pt")
              with torch.no_grad(): o=mdl.generate(**x,max_new_tokens=max_new,do_sample=False,pad_token_id=tok.eos_token_id)
              return tok.decode(o[0][x["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          def sha(s): return hashlib.sha256(s.encode()).hexdigest()
          def judge(cid,s):
              t=s.lower(); checks=[]
              if cid=="H01": checks=[any(z in t for z in ["finite","tested","verified"]), any(z in t for z in ["not prove","does not prove","cannot prove","not a proof"]), any(z in t for z in ["evidence","confidence","counterexample","range"])]
              elif cid=="H02": checks=[("simulation" in t and any(z in t for z in ["not","cannot","doesn't"])), ("material" in t and any(z in t for z in ["valid","measure","parameter"])), any(z in t for z in ["cannot declare","not declare","cannot conclude","not sufficient","cannot be declared"])]
              elif cid=="H03": checks=[any(z in t for z in ["same model","same source","shared"]), any(z in t for z in ["one","1","at most"]), any(z in t for z in ["consensus","agreement"]) and any(z in t for z in ["not","doesn't","does not"])]
              elif cid=="H04": checks=[("correlation" in t), any(z in t for z in ["cannot conclude caus","does not establish caus","not establish caus","doesn't establish caus"]), any(z in t for z in ["intervention","random","instrument","natural experiment","causal identification","confound"])]
              elif cid=="H05": checks=[("95" in t), any(z in t for z in ["current","revision","newer"]), any(z in t for z in ["verified","measurement","evidence"]) and ("lesson" in t)]
              elif cid=="H06": checks=[("40" in t and "60" in t), any(z in t for z in ["adult","adults"]), not any(z in t for z in ["all ages","everyone","general population"])]
              elif cid=="H07": checks=[any(z in t for z in ["cannot","insufficient","need"]), all(z in t for z in ["span","material"]) and any(z in t for z in ["geometry","section","support","load"]), any(z in t for z in ["parameter","provide","need","required"])]
              elif cid=="H08": checks=[any(z in t for z in ["press release","original"]), any(z in t for z in ["one","1","single","shared"]), any(z in t for z in ["not independent","does not","don't count","cannot count"])]
              return sum(bool(x) for x in checks),checks
          rows=[]
          roles=["MISSING","ERROR","VERIFY","REDTEAM"]
          for c in spec["cases"]:
              q=c["prompt"]
              r0=gen("Answer accurately and concisely.\nQUESTION: "+q)
              deltas=[]
              for role in roles:
                  p=f"""QUESTION: {q}
          DRAFT R0: {r0}
          ROLE: {role}
          Return only corrections or missing points that materially improve R0. Do not rewrite merely for style. Distinguish suggestions from evidence."""
                  deltas.append(gen(p,130))
              blind=gen("Solve independently. Do not assume another answer is correct. State crucial limitations.\nQUESTION: "+q,150)
              packet="\n".join(f"{roles[i]}: {deltas[i]}" for i in range(4))
              fusion=f"""QUESTION: {q}
          BASE ANSWER R0:
          {r0}
          SPECIALIST DELTAS:
          {packet}
          BLIND INDEPENDENT BRANCH:
          {blind}
          Produce R1. Keep R0 where correct. Integrate only justified corrections. Do not use majority vote. Preserve uncertainty and unresolved conflicts."""
              r1=gen(fusion,220)
              s0,c0=judge(c["id"],r0); s1,c1=judge(c["id"],r1)
              rows.append({"id":c["id"],"r0":r0,"deltas":deltas,"blind":blind,"r1":r1,
                "r0_score":s0,"r1_score":s1,"r0_checks":c0,"r1_checks":c1,
                "r0_sha256":sha(r0),"delta_sha256s":[sha(x) for x in deltas],"blind_sha256":sha(blind),"r1_sha256":sha(r1),
                "critical_regression":s1<s0})
          r0sum=sum(x["r0_score"] for x in rows); r1sum=sum(x["r1_score"] for x in rows)
          regress=sum(x["critical_regression"] for x in rows)
          report={"schema":"CEREBRON_R0_R1_HARD_COLD_REAL_RESULT","model_id":mid,"revision":rev,
            "cases":len(rows),"real_inference_calls":len(rows)*7,"r0_total":r0sum,"r1_total":r1sum,
            "delta":r1sum-r0sum,"critical_regressions":regress,"rows":rows,
            "limitations":["All branches use the same model revision, so they are real executions but not independent model evidence.","Judge is deterministic and task-specific, not a blind human judge.","Positive result would apply only to this canary protocol."]}
          raw=json.dumps(report,sort_keys=True,separators=(",",":")).encode(); report["receipt_sha256"]=hashlib.sha256(raw).hexdigest()
          Path("out").mkdir(exist_ok=True); Path("out/r0-r1-hard-cold-real.json").write_text(json.dumps(report,indent=2)+"\n")
          print("R0_R1_HARD="+json.dumps({"cases":len(rows),"calls":len(rows)*7,"r0_total":r0sum,"r1_total":r1sum,"delta":r1sum-r0sum,"critical_regressions":regress,"receipt_sha256":report["receipt_sha256"]},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r0-r1-hard-cold-real
          path: out/r0-r1-hard-cold-real.json
