name: CEREBRON Farm Qualification Validate
on:
  push:
    paths: ['config/farm-qualification.json','tools/farm_qualification.py','.github/workflows/farm-qualification.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/farm_qualification.py
