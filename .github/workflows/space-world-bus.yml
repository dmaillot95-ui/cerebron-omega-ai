name: CEREBRON Space World bus protocol canary
on:
  push:
    paths: ["runtime/space_world_bus.py", ".github/workflows/space-world-bus.yml"]
  workflow_dispatch:
jobs:
  bus-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python runtime/space_world_bus.py
      - uses: actions/upload-artifact@v4
        with: {name: space-world-bus-ledger, path: artifacts/space-bus/ledger.json}
