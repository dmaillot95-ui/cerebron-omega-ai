name: CEREBRON Collatz Farms Central 5min Hub

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collatz-farms-central-5min.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: cerebron-collatz-central-5min
  cancel-in-progress: true

jobs:
  centralize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect latest farm executions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, datetime
          from pathlib import Path

          farms = [
            {'id':1,'name':'theory','repo':'dmaillot95-ui/cerebron-collatz-theory-farm','workflow':'theory-farm.yml'},
            {'id':2,'name':'dynamics','repo':'dmaillot95-ui/cerebron-collatz-dynamics-farm','workflow':'dynamics-farm.yml'},
            {'id':3,'name':'adic','repo':'dmaillot95-ui/cerebron-collatz-farm-03-adic','workflow':'adic-farm.yml'},
            {'id':4,'name':'counterexample','repo':'dmaillot95-ui/cerebron-collatz-farm-04-counterexample','workflow':'counterexample-farm.yml'},
            {'id':6,'name':'formal-audit','repo':'dmaillot95-ui/cerebron-collatz-farm-06-formal-audit','workflow':'formal-audit-farm.yml'},
          ]
          token=os.environ.get('GH_TOKEN','')
          headers={'Accept':'application/vnd.github+json','User-Agent':'CEREBRON-Omega-Hub'}
          if token:
            headers['Authorization']='Bearer '+token
            headers['X-GitHub-Api-Version']='2022-11-28'

          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req,timeout=30) as r:
              return json.loads(r.read().decode())

          rows=[]
          for f in farms:
            base='https://api.github.com/repos/'+f['repo']
            try:
              data=get(base+'/actions/workflows/'+f['workflow']+'/runs?per_page=1')
              runs=data.get('workflow_runs',[])
              run=runs[0] if runs else None
              row={'farm_id':f['id'],'farm':f['name'],'repo':f['repo'],'workflow':f['workflow'],'latest_run':None,'artifacts':[],'error':None}
              if run:
                row['latest_run']={k:run.get(k) for k in ['id','run_number','event','status','conclusion','created_at','updated_at','head_sha','html_url']}
                try:
                  arts=get(base+'/actions/runs/'+str(run['id'])+'/artifacts?per_page=100').get('artifacts',[])
                  row['artifacts']=[{'id':a.get('id'),'name':a.get('name'),'size_in_bytes':a.get('size_in_bytes'),'expired':a.get('expired'),'created_at':a.get('created_at')} for a in arts]
                except Exception as e:
                  row['artifact_error']=repr(e)
              rows.append(row)
            except Exception as e:
              rows.append({'farm_id':f['id'],'farm':f['name'],'repo':f['repo'],'workflow':f['workflow'],'latest_run':None,'artifacts':[],'error':repr(e)})

          routing={
            'A_H_COUPLING':['theory','dynamics','adic'],
            'B_SMALL_H_BUDGET':['adic','counterexample','formal-audit'],
            'C_LOWER_GAP':['theory','adic','formal-audit'],
            'D_RED_TEAM':['counterexample','formal-audit','dynamics'],
            'E_FUSION':['theory','dynamics','adic','counterexample','formal-audit']
          }
          state={
            'schema':'cerebron-collatz-central-5min-v1',
            'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'cadence_minutes':5,
            'rules':['REALITY>COHERENCE','CLAIM<=EVIDENCE','WORKFLOW_SUCCESS!=MODEL_SUCCESS','CONSENSUS!=TRUTH','COMPUTATION!=PROOF'],
            'task_routing':routing,
            'farms':rows
          }
          Path('central').mkdir(exist_ok=True)
          Path('central/collatz-farm-state.json').write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n')
          Path('central/task-routing.json').write_text(json.dumps(routing,ensure_ascii=False,indent=2)+'\n')

          md=['# CEREBRON Collatz Central 5min','']
          for r in rows:
            x=r.get('latest_run') or {}
            md.append(f"- Farm {r['farm_id']:02d} {r['farm']}: run={x.get('id')} status={x.get('status')} conclusion={x.get('conclusion')} artifacts={len(r.get('artifacts',[]))}")
          Path('central/STATUS.md').write_text('\n'.join(md)+'\n')
          print(json.dumps(state,ensure_ascii=False,indent=2))
          PY

      - name: Upload centralized farm state
        uses: actions/upload-artifact@v4
        with:
          name: collatz-farms-central-state
          path: central/
          retention-days: 14
