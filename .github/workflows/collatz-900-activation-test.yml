name: CEREBRON Collatz 900 Role Activation Test

on:
  push:
    paths:
      - '.github/workflows/collatz-900-activation-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('config/farms.json'))
          inc=[{'id':f['id'],'repo':f['repo'],'domain':f['domain']} for f in d['farms']]
          assert len(inc)==45
          print('matrix='+json.dumps({'include':inc},separators=(',',':')))
          PY

  collatz-20-roles:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install --quiet hf-gradio
      - name: Execute 20 Collatz reasoning roles
        env:
          FARM_ID: ${{ matrix.id }}
          FARM_REPO: ${{ matrix.repo }}
          FARM_DOMAIN: ${{ matrix.domain }}
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import os,json,subprocess,pathlib,importlib.util,time,hashlib
          from concurrent.futures import ThreadPoolExecutor, as_completed

          fid=int(os.environ['FARM_ID']); repo=os.environ['FARM_REPO']; domain=os.environ['FARM_DOMAIN']
          roles=[
            'PROOF_STRATEGIST','NUMBER_THEORIST','DYNAMICAL_SYSTEMS_ANALYST','DIOPHANTINE_ANALYST','P_ADIC_ANALYST',
            'PARITY_VECTOR_ANALYST','CYCLE_OBSTRUCTION_ANALYST','DIVERGENCE_ANALYST','COUNTEREXAMPLE_HUNTER','FALSIFIER',
            'FORMAL_AUDITOR','ARITHMETIC_VERIFIER','REPLICATOR','RED_TEAM','LITERATURE_SYNTHESIZER',
            'INVARIANT_HUNTER','LEMMA_INVENTOR','GAP_ANALYST','PROOF_SYNTHESIZER','OMEGA_JUDGE'
          ]
          spaces=[
            'huggingface-projects/llama-3.2-3B-Instruct',
            'huggingface-projects/gemma-2-9b-it',
            'huggingface-projects/llama-2-7b-chat',
            'huggingface-projects/llama-2-13b-chat'
          ]
          result={'schema':'cerebron-collatz-900-activation-v1','farm_id':fid,'repo':repo,'domain':domain,'planned_roles':20,'triggered_roles':0,'successful_roles':0,'failed_roles':0,'provider_attempts':0,'outputs':[],'clone_success':False,'worker_present':False,'evidence_state':'UNKNOWN'}
          t0=time.time()
          cp=subprocess.run(['git','clone','--depth','1',f'https://github.com/dmaillot95-ui/{repo}.git','farm'],capture_output=True,text=True,timeout=120)
          result['clone_success']=cp.returncode==0
          if cp.returncode==0:
            wp=pathlib.Path('farm/worker/farm_worker.py'); result['worker_present']=wp.exists()
            if wp.exists():
              try:
                spec=importlib.util.spec_from_file_location(f'farm_worker_{fid}',wp)
                fw=importlib.util.module_from_spec(spec); spec.loader.exec_module(fw)
                def one(i):
                  role=roles[i]
                  prompt=(
                    f'CEREBRON OMEGA — COLLATZ RESOLUTION CAMPAIGN\nFARM {fid}: {repo}\nDOMAIN: {domain}\nROLE: {role}\n'
                    'Study the Collatz conjecture for the odd-only map T(x)=(3x+1)/2^v2(3x+1). '
                    'Goal: contribute one rigorous advance toward excluding nontrivial cycles or divergence for arbitrary odd period N. '
                    'Use the known exact cycle identity, parity/valuation words, minimum-element arguments, modular/Diophantine constraints, and explicit falsification. '
                    'Return exactly: (1) ESTABLISHED FACTS, (2) NEW DERIVATION, (3) GAP/UNPROVED STEP, (4) FALSIFICATION TEST, (5) NEXT LEMMA. '
                    'Do not claim the Collatz conjecture is solved unless every step is proved.'
                  )
                  attempts=[]
                  for space in spaces:
                    try:
                      ok,text,meta=fw.invoke(space,prompt)
                      attempts.append({'space':space,'ok':bool(ok),'meta':meta})
                      if ok and str(text).strip():
                        return {'index':i+1,'role':role,'success':True,'space':space,'sha256':hashlib.sha256(str(text).encode()).hexdigest(),'provider_attempts':len(attempts),'attempts':attempts}
                    except Exception as e:
                      attempts.append({'space':space,'ok':False,'error':repr(e)})
                  return {'index':i+1,'role':role,'success':False,'provider_attempts':len(attempts),'attempts':attempts}
                with ThreadPoolExecutor(max_workers=2) as ex:
                  futs=[ex.submit(one,i) for i in range(20)]
                  for fut in as_completed(futs):
                    row=fut.result(); result['triggered_roles']+=1; result['provider_attempts']+=row.get('provider_attempts',0)
                    if row['success']: result['successful_roles']+=1
                    else: result['failed_roles']+=1
                    result['outputs'].append(row)
                result['outputs'].sort(key=lambda x:x['index'])
              except Exception as e:
                result['error']='worker_import:'+repr(e)
          else:
            result['error']=(cp.stderr or cp.stdout)[-1500:]
          result['evidence_state']='UNREVIEWED_EXTERNAL_AGENT_OUTPUT' if result['successful_roles'] else ('EXTERNAL_INFERENCE_FAILED' if result['triggered_roles'] else 'UNKNOWN')
          result['elapsed_seconds']=round(time.time()-t0,3)
          pathlib.Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:result[k] for k in ['farm_id','planned_roles','triggered_roles','successful_roles','failed_roles','provider_attempts','evidence_state']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collatz900-farm-${{ matrix.id }}
          path: out/result.json
          retention-days: 14

  omega-accounting:
    needs: collatz-20-roles
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: collatz900-farm-*
          path: results
          merge-multiple: false
      - name: Aggregate Collatz activation benchmark
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('results').rglob('result.json'):
            try: rows.append(json.loads(p.read_text(encoding='utf-8')))
            except Exception: pass
          rows.sort(key=lambda r:r.get('farm_id',999))
          summary={
            'schema':'cerebron-collatz-900-activation-accounting-v1',
            'expected_farms':45,
            'roles_per_farm':20,
            'expected_roles':900,
            'farm_rows':len(rows),
            'total_triggered_roles':sum(r.get('triggered_roles',0) for r in rows),
            'total_successful_roles':sum(r.get('successful_roles',0) for r in rows),
            'total_failed_roles':sum(r.get('failed_roles',0) for r in rows),
            'total_provider_attempts':sum(r.get('provider_attempts',0) for r in rows),
            'farms_with_20_triggered':sum(r.get('triggered_roles',0)==20 for r in rows),
            'farms_with_at_least_one_success':sum(r.get('successful_roles',0)>0 for r in rows),
            'per_farm':[{'farm_id':r.get('farm_id'),'repo':r.get('repo'),'triggered':r.get('triggered_roles',0),'successful':r.get('successful_roles',0),'failed':r.get('failed_roles',0),'provider_attempts':r.get('provider_attempts',0)} for r in rows],
            'claim_note':'Triggered means a real role execution entered the worker loop. Successful means at least one external model returned nonempty output. Outputs are unaudited and do not constitute a proof of Collatz.'
          }
          Path('collatz-900-accounting.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: collatz-900-accounting
          path: collatz-900-accounting.json
          retention-days: 14
