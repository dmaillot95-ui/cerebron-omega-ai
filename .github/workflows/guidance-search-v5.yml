name: ASTRION Guidance Search V5
on:
  workflow_dispatch:
  push:
    paths:
      - "simulations/guidance_search_v5.py"
      - ".github/workflows/guidance-search-v5.yml"
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python simulations/guidance_search_v5.py
      - name: METRION search audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/guidance_search_v5.json"))
          assert d["evaluated"]==80
          assert len(d["top10"])==10
          assert d["best"]["score"]==min(x["score"] for x in d["top10"])
          assert "SEARCH_NOT_PROOF_OF_GLOBAL_OPTIMUM" in d["epistemic"]
          print("GUIDANCE_SEARCH_V5",d["best"],d["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astrion-guidance-search-v5
          path: artifacts/guidance_search_v5.json
          if-no-files-found: error
          retention-days: 7
