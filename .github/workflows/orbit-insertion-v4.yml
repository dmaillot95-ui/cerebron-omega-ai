name: ASTRION Orbit Insertion V4
on:
  workflow_dispatch:
  push:
    paths:
      - "simulations/orbit_insertion_v4.py"
      - ".github/workflows/orbit-insertion-v4.yml"
permissions:
  contents: read
jobs:
  insertion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python simulations/orbit_insertion_v4.py
      - name: METRION orbital-state gate
        run: |
          python - <<'PY'
          import json,math
          d=json.load(open("artifacts/orbit_insertion_v4.json"));t=d["terminal"]
          assert t["altitude_m"]>=0 and t["mass_kg"]>=d["config"]["mf"]
          assert abs(t["speed_m_s"]-math.hypot(t["vr_m_s"],t["vt_m_s"]))<1e-8
          assert isinstance(d["criteria"],dict) and len(d["criteria"])==5
          assert "NUMERICAL_CANARY_NOT_FLIGHT_CERTIFICATION" in d["epistemic"]
          print("ORBIT_INSERTION_V4",d["insertion_pass"],d["criteria"],d["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astrion-orbit-insertion-v4
          path: artifacts/orbit_insertion_v4.json
          if-no-files-found: error
          retention-days: 7
