name: ASTRION METRION ECI Dynamics V14
on:
  workflow_dispatch:
  push:
    paths:
      - "simulations/eci_dynamics_v14.py"
      - ".github/workflows/eci-dynamics-v14.yml"
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python simulations/eci_dynamics_v14.py
      - name: METRION invariant audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/eci_dynamics_v14.json"))
          assert d["pass"] is True
          assert all(d["criteria"].values())
          assert d["reality_gap"]=="G02_DYNAMICS_FIDELITY_PARTIAL"
          assert "G02_NOT_CLOSED" in d["epistemic"]
          print("ECI_V14",d["results"],d["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eci-dynamics-v14
          path: artifacts/eci_dynamics_v14.json
          if-no-files-found: error
          retention-days: 14
