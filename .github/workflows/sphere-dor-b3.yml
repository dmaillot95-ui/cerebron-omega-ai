name: CEREBRON Sphere dOr SO3 B3
on:
  push:
    paths: ['research/sphere_dor_b3_so3.py','.github/workflows/sphere-dor-b3.yml']
  workflow_dispatch:
jobs:
  so3-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/sphere_dor_b3_so3.py
      - uses: actions/upload-artifact@v4
        with: {name: sphere-dor-b3-so3, path: artifacts/sphere-dor-b3.json}
