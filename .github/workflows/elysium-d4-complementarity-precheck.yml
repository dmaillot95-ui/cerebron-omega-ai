name: ELYSIUM D4 Complementarity Precheck
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'config/elysium-d4-complementarity-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --upgrade huggingface_hub
      - name: Compare exact private D3 rows
        run: |
          mkdir -p receipts/elysium/d4
          python - <<'PY'
          import hashlib,json,os,pathlib
          from huggingface_hub import hf_hub_download

          base=pathlib.Path("receipts/elysium/d3")
          comp=base/"elysium-d3-baseline-comparison.json"
          if not comp.exists(): raise SystemExit("D3_COMPARISON_MISSING")
          d3=json.loads(comp.read_text())
          if d3.get("status")!="PASS": raise SystemExit("D3_NOT_PASS")
          rows=d3["models"]
          if len(rows)!=2: raise SystemExit("D3_EXPECTED_TWO_MODELS")
          data={}
          for r in rows:
              fn=pathlib.Path(hf_hub_download(
                  repo_id=os.environ["HF_REPO"],
                  filename=r["private_result_path"],
                  repo_type="model",
                  token=os.environ["HF_TOKEN"],
                  force_download=True
              ))
              raw=fn.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=r["private_result_sha256"]:
                  raise SystemExit("PRIVATE_RESULT_SHA_MISMATCH")
              data[r["model_id"]]=json.loads(raw)

          qa=data["Qwen/Qwen3-4B"]["rows"]
          sb=data["HuggingFaceTB/SmolLM3-3B"]["rows"]
          q={x["id"]:x for x in qa}; s={x["id"]:x for x in sb}
          if set(q)!=set(s) or len(q)!=72: raise SystemExit("TASK_SET_MISMATCH")
          both=qo=so=neither=disagree=0
          domain={}
          public=[]
          for i in sorted(q):
              a=q[i]; b=s[i]
              if a["domain"]!=b["domain"] or a["expected"]!=b["expected"]:
                  raise SystemExit("ROW_MISMATCH")
              qc=bool(a["correct"]); sc=bool(b["correct"])
              both+=int(qc and sc); qo+=int(qc and not sc); so+=int(sc and not qc); neither+=int(not qc and not sc)
              disagree+=int(a["prediction"]!=b["prediction"])
              d=domain.setdefault(a["domain"],{"qwen":0,"smol":0,"oracle":0,"total":0})
              d["total"]+=1; d["qwen"]+=int(qc); d["smol"]+=int(sc); d["oracle"]+=int(qc or sc)
              public.append({
                  "id_sha256":hashlib.sha256(i.encode()).hexdigest(),
                  "domain":a["domain"],
                  "qwen_correct":qc,"smol_correct":sc,
                  "predictions_disagree":a["prediction"]!=b["prediction"]
              })
          qn=both+qo; sn=both+so; oracle=both+qo+so; best=max(qn,sn)
          out={
              "schema":"ELYSIUM_D4_COMPLEMENTARITY_PRECHECK_V1",
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "source_d3_run_id":d3["run_id"],
              "m6_sha256":d3["m6_sha256"],
              "task_count":72,
              "qwen_correct":qn,"smol_correct":sn,
              "both_correct":both,"qwen_only_correct":qo,"smol_only_correct":so,"both_wrong":neither,
              "prediction_disagreement_count":disagree,
              "oracle_union_correct":oracle,
              "oracle_gain_over_best_single":oracle-best,
              "domain":domain,
              "decision":"CONTINUE_D4_FUSION_CANARY" if oracle>best else "STOP_DUAL_MODEL_NO_COMPLEMENTARITY",
              "independent_evidence_count":0,
              "two_models_not_two_independent_proofs":True,
              "public_rows_fingerprint_sha256":hashlib.sha256(json.dumps(public,sort_keys=True,separators=(",",":")).encode()).hexdigest(),
              "claim_ceiling":"D4_COMPLEMENTARITY_PRECHECK_ONLY_NO_RUNTIME_ACTIVATION"
          }
          out["receipt_sha256"]=hashlib.sha256(json.dumps(out,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          pathlib.Path("receipts/elysium/d4/elysium-d4-complementarity.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: elysium-d4-complementarity
          path: receipts/elysium/d4/elysium-d4-complementarity.json
          if-no-files-found: error
      - name: Persist D4 precheck receipt
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/elysium/d4/elysium-d4-complementarity.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: ELYSIUM D4 complementarity ${{ github.run_id }}"
          git pull --rebase origin feat/cerebron-ai-platform-mvp
          git push origin HEAD:feat/cerebron-ai-platform-mvp
