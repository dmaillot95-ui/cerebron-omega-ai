name: CEREBRON Omega 45 Farms Smoke Test

on:
  push:
    paths:
      - '.github/workflows/all-farms-smoke.yml'
      - 'mission/ALL-FARMS-SMOKE-2026-09-17.md'
      - 'config/farms.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open('config/farms.json'))
          inc=[{'id':f['id'],'repo':f['repo'],'domain':f['domain']} for f in d['farms']]
          print('matrix='+json.dumps({'include':inc},separators=(',',':')))
          PY

  farm-smoke-agent:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 45
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke-test dependency
        run: pip install --quiet hf-gradio
      - name: Execute one real external-model attempt for farm
        env:
          FARM_ID: ${{ matrix.id }}
          FARM_REPO: ${{ matrix.repo }}
          FARM_DOMAIN: ${{ matrix.domain }}
          MODEL_SPACE: huggingface-projects/llama-3.2-3B-Instruct
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import json, os, pathlib, subprocess, importlib.util, hashlib, time

          fid=int(os.environ['FARM_ID'])
          repo=os.environ['FARM_REPO']
          domain=os.environ['FARM_DOMAIN']
          space=os.environ['MODEL_SPACE']
          subject=pathlib.Path('mission/ALL-FARMS-SMOKE-2026-09-17.md').read_text(encoding='utf-8')
          started=time.time()
          result={
            'schema':'cerebron-45-farm-smoke-v1',
            'test_id':'ALL-FARMS-SMOKE-2026-09-17',
            'farm_id':fid,
            'repo':repo,
            'domain':domain,
            'model_space':space,
            'repo_clone_success':False,
            'worker_present':False,
            'model_call_attempted':False,
            'inference_success':False,
            'response':None,
            'meta':{},
            'evidence_state':'UNKNOWN'
          }
          try:
            cp=subprocess.run(['git','clone','--depth','1',f'https://github.com/dmaillot95-ui/{repo}.git','farm'],capture_output=True,text=True,timeout=120)
            result['repo_clone_success']=(cp.returncode==0)
            if cp.returncode!=0:
              result['meta']={'stage':'clone','error':(cp.stderr or cp.stdout)[-1500:]}
              result['evidence_state']='REJECTED'
            else:
              wp=pathlib.Path('farm/worker/farm_worker.py')
              result['worker_present']=wp.exists()
              if not wp.exists():
                result['meta']={'stage':'worker','error':'worker/farm_worker.py absent'}
                result['evidence_state']='UNKNOWN'
              else:
                spec=importlib.util.spec_from_file_location('farm_worker',wp)
                fw=importlib.util.module_from_spec(spec); spec.loader.exec_module(fw)
                prompt=(
                  f'CEREBRON OMEGA 45-FARM SMOKE TEST\n'
                  f'FARM_ID: {fid}\nFARM_REPO: {repo}\nDOMAIN: {domain}\n\n'
                  +subject+
                  '\nReturn a concise answer from this farm domain. This is an infrastructure smoke test, not scientific validation.'
                )
                result['model_call_attempted']=True
                ok,text,meta=fw.invoke(space,prompt)
                result['inference_success']=bool(ok and str(text).strip())
                result['response']=str(text) if result['inference_success'] else None
                result['meta']=meta
                result['response_sha256']=hashlib.sha256(str(text).encode()).hexdigest() if result['inference_success'] else None
                result['evidence_state']='UNREVIEWED_EXTERNAL_AGENT_OUTPUT' if result['inference_success'] else 'EXTERNAL_INFERENCE_FAILED'
          except Exception as e:
            result['meta']={'stage':'exception','error':repr(e)}
            result['evidence_state']='EXTERNAL_INFERENCE_FAILED' if result['model_call_attempted'] else 'UNKNOWN'
          result['elapsed_seconds']=round(time.time()-started,3)
          pathlib.Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:result.get(k) for k in ('farm_id','repo','repo_clone_success','worker_present','model_call_attempted','inference_success','evidence_state')},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-farm-${{ matrix.id }}
          path: out/result.json
          retention-days: 14

  omega-accounting:
    needs: farm-smoke-agent
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-farm-*
          path: results
          merge-multiple: false
      - name: Count real successful external agents
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('results').rglob('result.json'):
            try: rows.append(json.loads(p.read_text(encoding='utf-8')))
            except Exception: pass
          rows.sort(key=lambda r:r.get('farm_id',999))
          summary={
            'schema':'cerebron-45-farm-smoke-accounting-v1',
            'test_id':'ALL-FARMS-SMOKE-2026-09-17',
            'expected_farms':45,
            'artifact_rows':len(rows),
            'repo_clone_success':sum(bool(r.get('repo_clone_success')) for r in rows),
            'worker_present':sum(bool(r.get('worker_present')) for r in rows),
            'model_call_attempted':sum(bool(r.get('model_call_attempted')) for r in rows),
            'successful_external_ai_agents':sum(bool(r.get('inference_success')) for r in rows),
            'external_inference_failed':sum(r.get('evidence_state')=='EXTERNAL_INFERENCE_FAILED' for r in rows),
            'unreviewed_external_agent_outputs':sum(r.get('evidence_state')=='UNREVIEWED_EXTERNAL_AGENT_OUTPUT' for r in rows),
            'claim_note':'Agent counted only when a model call was attempted, non-empty output existed, and inference_success=true. Content remains unaudited.'
          }
          Path('all-farms-accounting.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('all-farms-results.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-farms-smoke-accounting
          path: |
            all-farms-accounting.json
            all-farms-results.json
          retention-days: 14
