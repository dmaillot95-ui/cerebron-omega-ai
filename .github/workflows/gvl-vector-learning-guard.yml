name: GVL Vector Learning Guard
on:
  push:
    branches:
      - main
    paths:
      - config/geometric-vector-learning-v1.json
      - memory/gvl-learning-history.json
      - tools/gvl_vector_engine.py
      - tools/validate_gvl.py
      - .github/workflows/gvl-vector-learning-guard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate GVL contracts
        run: python tools/validate_gvl.py
      - name: Generate read-only GVL canary
        run: python tools/gvl_vector_engine.py --canary --output artifacts/gvl-vector-canary.json
      - uses: actions/upload-artifact@v4
        with:
          name: gvl-vector-canary-${{ github.run_id }}
          path: artifacts/gvl-vector-canary.json
