name: CEREBRON Farm Readiness Validate
on:
  push:
    paths: ['config/farm-readiness.json','tools/farm_readiness.py','.github/workflows/farm-readiness.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/farm_readiness.py
