name: SIGMA Full Council 8 E2E
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'platform/sigma_full_council_e2e.py'
      - '.github/workflows/platform-sigma-full-council-e2e.yml'
      - 'platform/sigma_manager.py'
      - 'config/sigma-executive-council-v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  council:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CEREBRON_ENABLE_LOCAL_GENERATIVE: '1'
      PYTHONPATH: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU generative runtime
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==5.17.0
      - name: Execute all eight SIGMA delegates and fusion
        run: python platform/sigma_full_council_e2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: sigma-full-council-8-e2e
          path: platform/artifacts/sigma-full-council-e2e.json
