name: Cleanup mistaken F175 scaffold

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-f175-scaffold.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove mistaken master-repo F175 registration
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('config/farms.json')
          d=json.loads(p.read_text())
          d['farms']=[f for f in d.get('farms',[]) if int(f.get('id',-1)) != 175]
          d['version']='2.25'
          if d.get('max_farms') == 175:
              d['max_farms']=174
          pol=d.get('policy',{})
          if pol.get('farm_cap') == 175:
              pol['farm_cap']=174
          if 'no_farm_above_175' in pol:
              pol.pop('no_farm_above_175',None)
          if 'extension_farm_ids' in pol and 175 in pol['extension_farm_ids']:
              pol['extension_farm_ids']=[x for x in pol['extension_farm_ids'] if x != 175]
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          PY
          rm -rf scaffolds/f175-weight-simulation
          rm -f .github/workflows/register-f175-weight-simulation.yml
          rm -f .github/workflows/cleanup-f175-scaffold.yml
      - name: Commit cleanup only
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add -A config/farms.json scaffolds/f175-weight-simulation .github/workflows/register-f175-weight-simulation.yml .github/workflows/cleanup-f175-scaffold.yml
          git diff --cached --quiet && exit 0
          git commit -m "revert: remove mistaken F175 scaffold registration"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
