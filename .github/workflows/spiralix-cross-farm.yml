name: SPIRALIX Cross-Farm Semantics
on:
  push:
    paths:
      - 'tools/glyph_router.py'
      - 'tests/test_spiralix_cross_farm.py'
      - '.github/workflows/spiralix-cross-farm.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate cross-farm routing semantics
        run: python tests/test_spiralix_cross_farm.py
