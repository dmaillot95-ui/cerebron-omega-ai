name: CEREBRON Global AI Provider Probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/global_ai_router.py'
      - '.github/workflows/global-ai-provider-probe.yml'
      - 'config/provider-probe-trigger.txt'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests
      - name: Probe configured zero-cost providers
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python tools/global_ai_router.py
      - name: Expose provider reality summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          p='out/provider-reality-manifest.json'
          if not os.path.exists(p):
              print('PROVIDER_REALITY_SUMMARY=MANIFEST_MISSING')
          else:
              j=json.load(open(p,encoding='utf-8'))
              print('PROVIDER_REALITY_SUMMARY configured=%s executed=%s success=%s failure=%s quality=%s' % (
                  j.get('configured_count'),j.get('executed_count'),j.get('success_count'),j.get('failure_count'),j.get('quality_pass_count')))
              for r in j.get('providers',[]):
                  print('PROVIDER_STATE provider=%s configured=%s success=%s http=%s failure_class=%s model=%s' % (
                      r.get('provider'),r.get('configured'),r.get('success'),r.get('http_status'),r.get('failure_class'),r.get('model')))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-ai-provider-probe
          path: |
            out/global-ai-provider-probe.json
            out/provider-reality-manifest.json
          retention-days: 14
