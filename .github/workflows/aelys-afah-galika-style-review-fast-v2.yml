name: AELYS AFAH Galika Style Review Fast V2

on:
  push:
    branches:
      - main
    paths:
      - config/aelys-afah-galika-style-review-v2-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aelys:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "transformers>=4.53,<5" accelerate safetensors sentencepiece
      - name: Ask AELYS
        run: python tools/aelys_afah_galika_style_review_v2.py --identity AELYS --run-id "${{ github.run_id }}" --output artifacts/aelys-galika-style-v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galika-style-aelys-v2
          path: artifacts/aelys-galika-style-v2.json
          if-no-files-found: error
          retention-days: 30

  afah:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "transformers>=4.53,<5" accelerate safetensors sentencepiece
      - name: Ask AFAH
        run: python tools/aelys_afah_galika_style_review_v2.py --identity AFAH --run-id "${{ github.run_id }}" --output artifacts/afah-galika-style-v2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galika-style-afah-v2
          path: artifacts/afah-galika-style-v2.json
          if-no-files-found: error
          retention-days: 30
