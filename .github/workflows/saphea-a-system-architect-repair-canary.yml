name: SAPHEA-A System Architect Repair Canary
on:
  push:
    branches:
      - main
    paths:
      - config/saphea-a-system-architect-repair-trigger.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-smollm3-3b-a07cc9a04f16550a088caea529712d1d335b0ac1
      - run: pip install --quiet "transformers>=4.53,<5" accelerate safetensors sentencepiece
      - run: python tools/saphea_a_system_architect_repair_canary.py --run-id "${{ github.run_id }}" --output "receipts/workers/saphea-a-system-architect-repair-${{ github.run_id }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saphea-a-system-architect-repair-${{ github.run_id }}
          path: receipts/workers/saphea-a-system-architect-repair-${{ github.run_id }}.json
      - name: Persist repair receipt
        if: always()
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/workers/
          git diff --cached --quiet && exit 0
          git commit -m "receipt: SAPHEA-A system architect repair canary"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
