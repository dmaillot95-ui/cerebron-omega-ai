name: CEREBRON Moltbook Connection Test

'on':
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/moltbook-connection-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Moltbook API connection
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MOLTBOOK_API_KEY" || { echo "::error::MOLTBOOK_API_KEY is missing"; exit 1; }
          echo "::add-mask::$MOLTBOOK_API_KEY"
          code=$(curl -sS -o response.json -w "%{http_code}" \
            https://www.moltbook.com/api/v1/agents/me \
            -H "Authorization: Bearer $MOLTBOOK_API_KEY")
          echo "HTTP_STATUS=$code"
          if [ "$code" != "200" ]; then
            cat response.json
            exit 1
          fi
          python - <<'PY'
          import json
          d=json.load(open("response.json"))
          a=d.get("agent", d.get("data", d))
          print("MOLTBOOK_CONNECTION=OK")
          print("AGENT_NAME="+str(a.get("name","unknown")))
          print("CLAIMED="+str(a.get("is_claimed",a.get("claimed","unknown"))))
          PY
          {
            echo "## Moltbook connection"
            echo ""
            echo "- API: connected"
            echo "- Endpoint: /api/v1/agents/me"
            echo "- HTTP: 200"
          } >> "$GITHUB_STEP_SUMMARY"
