name: CEREBRON FARM-46 Global Video Research

on:
  workflow_dispatch:
    inputs:
      query:
        description: Video research query
        required: false
        default: "Collatz conjecture mathematics"
  push:
    paths:
      - '.github/workflows/farm-46-global-video-research.yml'
  schedule:
    - cron: '43 * * * *'

permissions:
  contents: read

jobs:
  research-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet ddgs yt-dlp
      - name: Search global video sources
        env:
          INPUT_QUERY: ${{ github.event.inputs.query }}
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import os,json,time,datetime,subprocess
          from ddgs import DDGS
          q=os.environ.get('INPUT_QUERY') or 'Collatz conjecture mathematics'
          site_queries=[q+' site:youtube.com/watch',q+' site:youtu.be',q+' site:vimeo.com',q+' site:dailymotion.com',q+' site:bilibili.com/video',q+' site:rutube.ru/video',q+' site:vkvideo.ru']
          rows=[]; seen=set()
          with DDGS() as d:
            for qq in site_queries:
              try:
                for r in d.text(qq,max_results=15):
                  u=r.get('href') or r.get('url')
                  if not u or u in seen: continue
                  seen.add(u)
                  rows.append({'query':qq,'title':r.get('title'),'url':u,'snippet':r.get('body'),'platform':'web-video-index'})
              except Exception as e:
                rows.append({'query':qq,'error':repr(e)})
              time.sleep(.35)
          checked=0
          for row in rows:
            u=row.get('url','')
            if checked>=8: break
            if 'youtube.com/watch' not in u and 'youtu.be/' not in u: continue
            checked+=1
            try:
              p=subprocess.run(['yt-dlp','--skip-download','--dump-single-json','--no-warnings',u],capture_output=True,text=True,timeout=45)
              if p.returncode==0 and p.stdout.strip():
                j=json.loads(p.stdout)
                row['metadata']={k:j.get(k) for k in ['id','title','channel','channel_id','upload_date','duration','view_count','webpage_url']}
                row['metadata_status']='OK'
              else: row['metadata_status']='FAILED'
            except Exception as e:
              row['metadata_status']='FAILED'; row['metadata_error']=repr(e)
          out={'schema':'cerebron-farm46-global-video-v1','farm_id':46,'domain':'global-video-research','generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'query':q,'result_count':sum(1 for x in rows if x.get('url')),'results':rows,'rules':['VIDEO != EVIDENCE','TRANSCRIPT != VERIFIED CLAIM','Cross-check claims against primary sources','Record platform/date/channel when available','No copyright rehosting; store metadata and citations only']}
          open('out/video-research.json','w').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'query':q,'results':out['result_count'],'youtube_metadata_checked':checked}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: farm-46-global-video-research
          path: out/video-research.json
          retention-days: 14
