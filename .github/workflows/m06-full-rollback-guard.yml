name: M06 Full Rollback Guard
on:
  push:
    branches: [main]
    paths:
      - 'receipts/p03/m06-hf-full-rollback/**'
      - 'receipts/p03/m06-hf-full-rollback-latest.json'
      - 'config/m06-full-rollback-guard-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/validate_m06_full_rollback.py
