name: CEREBRON Knowledge Banks Guard
on:
  push:
    branches: [main]
    paths:
      - config/cerebron-knowledge-banks-guard-trigger.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/cerebron_knowledge_banks_guard.py
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-banks-guard-${{ github.run_id }}
          path: receipts/guards/knowledge-banks-guard-v1.json
      - name: Persist guard receipt
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/guards/knowledge-banks-guard-v1.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: knowledge banks guard"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
