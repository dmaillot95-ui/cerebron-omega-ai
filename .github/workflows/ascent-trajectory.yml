name: ASTRION Ascent Trajectory Canary
on:
  workflow_dispatch:
  push:
    paths:
      - "simulations/ascent_trajectory_v1.py"
      - ".github/workflows/ascent-trajectory.yml"
permissions:
  contents: read
jobs:
  ascent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python simulations/ascent_trajectory_v1.py
      - name: METRION sanity gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/ascent_trajectory.json"));r=d["results"]
          assert r["altitude_m"]>0 and r["speed_m_s"]>0
          assert r["max_q"]["q_pa"]>0 and r["max_q"]["t_s"]>=0
          assert r["mass_kg"]>=d["config"]["dry_plus_payload_kg"]
          assert "NO_6DOF" in d["epistemic"] and "NO_HARDWARE_VALIDATION" in d["epistemic"]
          print("ASCENT_TRAJECTORY_CANARY",r["altitude_m"],r["speed_m_s"],r["max_q"]["q_pa"],d["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astrion-ascent-trajectory
          path: artifacts/ascent_trajectory.json
          if-no-files-found: error
          retention-days: 7
