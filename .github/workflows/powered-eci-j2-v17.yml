name: ASTRION METRION ECI J2 V17
on:
  workflow_dispatch:
  push:
    paths:
      - "simulations/powered_eci_j2_v17.py"
      - ".github/workflows/powered-eci-j2-v17.yml"
permissions:
  contents: read
jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python simulations/powered_eci_j2_v17.py
      - name: METRION J2 gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/powered_eci_j2_v17.json"));t=d["terminal"]
          assert t["altitude_m"]>=0 and t["speed_m_s"]>0
          assert 0<=t["inclination_deg"]<=180 and t["max_q_pa"]>=0
          assert "DYNAMIC_LOCAL_FRAME" in d["epistemic"] and "J2_GRAVITY" in d["epistemic"]
          assert d["reality_gap"]=="G02_DYNAMICS_FIDELITY_PARTIAL"
          print("ECI_J2_V17",t,d["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: powered-eci-j2-v17
          path: artifacts/powered_eci_j2_v17.json
          if-no-files-found: error
          retention-days: 14
