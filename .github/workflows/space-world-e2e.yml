name: CEREBRON Space World E2E chain smoke
on:
  push:
    paths: ["runtime/space_world_e2e.py", ".github/workflows/space-world-e2e.yml"]
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python runtime/space_world_e2e.py
      - uses: actions/upload-artifact@v4
        with:
          name: space-world-e2e-chain
          path: artifacts/space-e2e/
