name: CEREBRON Scaling Gate Validate
on:
  push:
    paths: ['config/scaling-gate.json','tools/scaling_gate.py','.github/workflows/scaling-gate.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/scaling_gate.py
