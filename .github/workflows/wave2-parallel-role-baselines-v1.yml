name: CEREBRON Wave2 Parallel Role Baselines
on:
  push:
    branches: ['feat/wave2-parallel-ai-baselines-v1']
    paths:
      - 'config/wave2-parallel-baseline-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  baseline:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        role: [SPIRALION, HYPERION, ASTRION, SAPHEA_MICRO]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tools/wave2_parallel_role_baseline.py
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: wave2-${{ matrix.role }}-models-v1
      - name: Install inference stack
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check --no-cache-dir "transformers>=4.53,<5" accelerate safetensors sentencepiece
      - name: Execute real cold baseline
        run: |
          python tools/wave2_parallel_role_baseline.py             --role "${{ matrix.role }}"             --run-id "${{ github.run_id }}"             --output "receipts/wave2/${{ matrix.role }}-baseline-${{ github.run_id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-${{ matrix.role }}-baseline
          path: receipts/wave2/${{ matrix.role }}-baseline-${{ github.run_id }}.json
          if-no-files-found: error

  audit:
    needs: baseline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wave2-*-baseline
          path: downloaded/wave2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Wave2 baseline receipts
        run: |
          mkdir -p receipts/wave2
          python - <<'PY'
          import glob,hashlib,json,os,pathlib
          files=sorted(set(glob.glob("downloaded/wave2/**/*.json",recursive=True)))
          rows=[]
          for p in files:
              d=json.loads(pathlib.Path(p).read_text())
              if d.get("schema")=="CEREBRON_WAVE2_ROLE_BASELINE_RECEIPT_V1":
                  rows.append(d)
          expected=["SPIRALION","HYPERION","ASTRION","SAPHEA_MICRO"]
          by={r["role"]:r for r in rows}
          assert sorted(by)==sorted(expected),(sorted(by),files)
          assert len(rows)==4
          assert all(r["real_inference"] is True for r in rows)
          assert all(r["training_executed"] is False for r in rows)
          assert all(r["benchmark_deny_training"] is True for r in rows)
          lineages={r["lineage_fingerprint"] for r in rows}
          out={
            "schema":"CEREBRON_WAVE2_PARALLEL_BASELINE_AUDIT_V1",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "roles":expected,
            "receipt_count":4,
            "real_inference_count":4,
            "training_executed_count":0,
            "unique_lineage_fingerprints":len(lineages),
            "independent_evidence_count":0,
            "scores":{r["role"]:{
              "score":r["score"],"max":r["task_count"],"accuracy":r["accuracy"],
              "model_id":r["model_id"],"revision":r["revision"],
              "training_readiness":r["training_readiness"],
              "benchmark_sha256":r["benchmark_sha256"]
            } for r in rows},
            "next_gate":"ROLE_SPECIFIC_QUARANTINE_DATA_BUILD_AND_AUDIT",
            "claim_ceiling":"FOUR_REAL_PARALLEL_BASELINES_TWO_SHARED_MODEL_LINEAGES_NO_TRAINING_CLAIM"
          }
          raw=json.dumps(out,sort_keys=True,separators=(",",":")).encode()
          out["audit_sha256"]=hashlib.sha256(raw).hexdigest()
          p=pathlib.Path("receipts/wave2")/f"wave2-parallel-baseline-audit-{os.environ['GITHUB_RUN_ID']}.json"
          p.write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-parallel-baseline-audit-${{ github.run_id }}
          path: receipts/wave2/wave2-parallel-baseline-audit-${{ github.run_id }}.json
      - name: Persist Wave2 audit receipt
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/wave2/
          git diff --cached --quiet && exit 0
          git commit -m "receipt: Wave2 parallel role baselines ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin feat/wave2-parallel-ai-baselines-v1 && git push && exit 0
            sleep 5
          done
          exit 1
