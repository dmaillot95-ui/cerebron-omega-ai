name: CEREBRON Sphere dOr Composition Graph B8
on:
  push:
    paths: ['research/sphere_dor_b8_graph.py','.github/workflows/sphere-dor-b8.yml']
  workflow_dispatch:
jobs:
  composition-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/sphere_dor_b8_graph.py
      - uses: actions/upload-artifact@v4
        with: {name: sphere-dor-b8-graph, path: artifacts/sphere-dor-b8.json}
