name: RDX Semantic Policy Fusion DEV V5
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'config/rdx-semantic-policy-fusion-dev-v5-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install retrieval runtime
        run: |
          python -m pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir sentence-transformers numpy
      - name: Run bilingual fusion policy ablation
        run: python runtime/rdx_semantic_policy_fusion_dev_v5.py
      - uses: actions/upload-artifact@v4
        with:
          name: rdx-semantic-policy-fusion-dev-v5
          path: receipts/rdx/rdx-semantic-policy-fusion-dev-v5.json
          if-no-files-found: error
      - name: Persist DEV receipt
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/rdx/rdx-semantic-policy-fusion-dev-v5.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: RDX semantic fusion DEV V5 ${{ github.run_id }}"
          git pull --rebase origin feat/cerebron-ai-platform-mvp
          git push origin HEAD:feat/cerebron-ai-platform-mvp
