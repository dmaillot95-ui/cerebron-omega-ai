name: RDX Semantic Retrieval Repair DEV V2
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'config/rdx-semantic-retrieval-repair-dev-v2-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dev:
    runs-on: ubuntu-latest
    env:
      HF_REPO: cerebron-omega/cerebron-private-memory
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install retrieval DEV runtime
        run: |
          python -m pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir sentence-transformers numpy
      - name: Evaluate hybrid retrieval policies on DEV V1 only
        run: python runtime/rdx_semantic_retrieval_repair_dev_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: rdx-semantic-retrieval-repair-dev-v2
          path: receipts/rdx/rdx-semantic-retrieval-repair-dev-v2.json
          if-no-files-found: error
      - name: Persist DEV receipt
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/rdx/rdx-semantic-retrieval-repair-dev-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: RDX semantic retrieval repair DEV V2 ${{ github.run_id }}"
          git pull --rebase origin feat/cerebron-ai-platform-mvp
          git push origin HEAD:feat/cerebron-ai-platform-mvp
