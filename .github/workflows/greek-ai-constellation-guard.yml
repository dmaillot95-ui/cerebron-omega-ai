name: Greek AI Constellation Guard
on:
  push:
    branches: [main]
    paths:
      - 'config/greek-ai-constellation-v1.json'
      - 'config/farms.json'
      - 'tools/validate_greek_constellation.py'
      - 'docs/GREEK_HYPERFUNNEL_CAMPAIGN_V1.md'
      - '.github/workflows/greek-ai-constellation-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_greek_constellation.py
