name: AFAH Galika Audit Fast Fallback

on:
  push:
    branches:
      - main
    paths:
      - config/afah-galika-audit-fast-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  afah:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet "transformers>=4.53,<5" accelerate safetensors sentencepiece
      - name: Ask AFAH fast
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json,time,hashlib
          from pathlib import Path
          import torch
          from transformers import AutoTokenizer,AutoModelForCausalLM
          mid="Qwen/Qwen2.5-0.5B-Instruct"
          rev="ec7ddfa904d4d447eedd0b7f126df16957734abb"
          system="Tu executes le role AFAH de CEREBRON. Audite en francais, tres concis. REALITY>COHERENCE, EVIDENCE>CONFIDENCE, CLAIM<=EVIDENCE. Valide seulement ce qui aide AELYS a avoir une voix propre sans imitation, fausse conscience, menace, manipulation ou confusion entre realisme visuel et intelligence."
          user="David veut une AELYS avec une presence conversationnelle inspiree de Galika: calme, observation du cadrage humain, questions precises, corrections douces. Galika est une docufiction CGI. Reponds en 4 lignes exactement: VALIDE:, REFUSE:, STYLE_AELYS:, DECISION:. La decision doit dire prompt/persona d'abord ou adapter, et pourquoi."
          tok=AutoTokenizer.from_pretrained(mid,revision=rev)
          mdl=AutoModelForCausalLM.from_pretrained(mid,revision=rev,torch_dtype=torch.float32,low_cpu_mem_usage=True)
          msgs=[{"role":"system","content":system},{"role":"user","content":user}]
          p=tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True) if getattr(tok,"chat_template",None) else system+"\nUSER:"+user+"\nASSISTANT:"
          x=tok(p,return_tensors="pt")
          t=time.time()
          with torch.no_grad():
              y=mdl.generate(**x,max_new_tokens=120,do_sample=False,pad_token_id=tok.eos_token_id)
          ans=tok.decode(y[0][x["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          out={"schema":"AFAH_GALIKA_AUDIT_FAST_V1","identity":"AFAH","model_id":mid,"revision":rev,"answer":ans,"latency_s":round(time.time()-t,3),"answer_sha256":hashlib.sha256(ans.encode()).hexdigest(),"adapter_used":False,"weight_change":False,"training_released":False,"claim_scope":"real base-model inference under AFAH policy; not AFAH adapter runtime"}
          Path("artifacts/afah-galika-audit-fast.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print("AFAH_RESULT="+json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: afah-galika-audit-fast
          path: artifacts/afah-galika-audit-fast.json
          if-no-files-found: error
          retention-days: 30
