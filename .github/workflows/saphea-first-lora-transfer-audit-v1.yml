name: SAPHEA First LoRA Transfer Audit V1
on:
  push:
    branches: ['feat/saphea-first-lora-v1']
    paths:
      - 'config/saphea-first-lora-transfer-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
      ADAPTER_PREFIX: colony/C03-SIGMA/agents/SAPHEA/adapters/G1-EPISTEMIC-V1/run-36100266729
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned CPU audit stack
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==5.17.0 peft==0.21.0 accelerate safetensors sentencepiece huggingface_hub

      - name: Compile isolated transfer audit
        run: python -m py_compile platform/saphea_lora_transfer_audit_v1.py

      - name: Download exact private adapter and verify SHA
        run: |
          python - <<'PY'
          import hashlib,os,pathlib,shutil
          from huggingface_hub import HfApi,hf_hub_download

          token=os.environ.get("HF_TOKEN","")
          if not token:
              raise SystemExit("HF_TOKEN_MISSING")
          repo=os.environ["HF_REPO"]
          prefix=os.environ["ADAPTER_PREFIX"]
          api=HfApi(token=token)
          info=api.repo_info(repo_id=repo,repo_type="model")
          if not bool(getattr(info,"private",False)):
              raise SystemExit("HF_REPO_NOT_PRIVATE")

          out=pathlib.Path("platform/artifacts/saphea-g1-private-adapter")
          out.mkdir(parents=True,exist_ok=True)
          expected={
              "adapter_model.safetensors":"0187a8e3b1ef1edcfd966b463137c36721fe9bcf5019233b52e4ec1354b01080",
              "adapter_config.json":"3adc5c7d19aa85d403bdc9515772b16d50d029628f5e9d41e84db43ca6548b0b",
          }
          for name,digest in expected.items():
              src=pathlib.Path(hf_hub_download(
                  repo_id=repo,
                  filename=prefix+"/"+name,
                  repo_type="model",
                  token=token,
                  force_download=True,
              ))
              dst=out/name
              shutil.copy2(src,dst)
              got=hashlib.sha256(dst.read_bytes()).hexdigest()
              if got!=digest:
                  raise SystemExit(f"{name}_SHA_MISMATCH")
          print("SAPHEA_PRIVATE_ADAPTER_READBACK_SHA=PASS")
          PY

      - name: Run frozen transfer ablation and red team
        run: |
          python platform/saphea_lora_transfer_audit_v1.py             --adapter-dir platform/artifacts/saphea-g1-private-adapter

      - name: Verify audit receipt and write public pointer
        run: |
          mkdir -p receipts/training
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path("platform/artifacts")
          bench=json.loads((root/"saphea-epistemic-transfer-v1.json").read_text())
          report=json.loads((root/"saphea-first-lora-transfer-audit-v1.json").read_text())
          assert bench["deny_training"] is True
          assert report["benchmark_deny_training"] is True
          assert report["adapter_sha256"]=="0187a8e3b1ef1edcfd966b463137c36721fe9bcf5019233b52e4ec1354b01080"
          assert report["independent_codepath_from_training"] is True
          assert report["independent_evidence_claim"] is False
          assert report["promotion"]=="NOT_PROMOTED"
          assert report["normal_count"]==60
          assert report["red_team_count"]==24

          receipt={
              "schema":"SAPHEA_FIRST_LORA_TRANSFER_PUBLIC_POINTER_V1",
              "run_id":int(os.environ["GITHUB_RUN_ID"]),
              "code_commit":os.environ["GITHUB_SHA"],
              "source_adapter_run_id":36100266729,
              "base_model_id":report["base_model_id"],
              "base_revision":report["base_revision"],
              "adapter_sha256":report["adapter_sha256"],
              "benchmark_sha256":report["benchmark_sha256"],
              "benchmark_memory_class":report["benchmark_memory_class"],
              "benchmark_deny_training":True,
              "scope":report["scope"],
              "normal_count":report["normal_count"],
              "red_team_count":report["red_team_count"],
              "base_transfer_score":report["base_transfer_score"],
              "base_transfer_max":report["base_transfer_max"],
              "adapter_transfer_score":report["adapter_transfer_score"],
              "adapter_transfer_max":report["adapter_transfer_max"],
              "transfer_gain":report["transfer_gain"],
              "base_redteam_score":report["base_redteam_score"],
              "base_redteam_max":report["base_redteam_max"],
              "adapter_redteam_score":report["adapter_redteam_score"],
              "adapter_redteam_max":report["adapter_redteam_max"],
              "redteam_gain":report["redteam_gain"],
              "critical_regression":report["critical_regression"],
              "ablation_supports_value":report["ablation_supports_value"],
              "transfer_pass":report["transfer_pass"],
              "decision":report["decision"],
              "promotion":"NOT_PROMOTED",
              "open_gates":report["open_gates"],
              "claim_ceiling":report["claim_ceiling"],
              "independent_evidence_claim":False,
          }
          p=pathlib.Path("receipts/training")/f"saphea-first-lora-transfer-{os.environ['GITHUB_RUN_ID']}.json"
          p.write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Remove private adapter from workspace
        run: rm -rf platform/artifacts/saphea-g1-private-adapter

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saphea-first-lora-transfer-${{ github.run_id }}
          path: |
            platform/artifacts/saphea-epistemic-transfer-v1.json
            platform/artifacts/saphea-first-lora-transfer-audit-v1.json
            receipts/training/saphea-first-lora-transfer-${{ github.run_id }}.json
          if-no-files-found: warn

      - name: Persist public transfer metadata only
        if: success()
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/training/saphea-first-lora-transfer-${{ github.run_id }}.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: SAPHEA LoRA transfer audit ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin feat/saphea-first-lora-v1 && git push && exit 0
            sleep 5
          done
          exit 1
