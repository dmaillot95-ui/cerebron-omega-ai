name: CEREBRON Collapse Gate Validate
on:
  push:
    paths: ['config/collapse-gate.json','tools/collapse_gate.py','.github/workflows/collapse-gate.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/collapse_gate.py
