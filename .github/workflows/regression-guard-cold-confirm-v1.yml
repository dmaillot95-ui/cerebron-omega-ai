name: Regression Guard Cold Confirm V1
on:
  push:
    paths:
      - ".github/workflows/regression-guard-cold-confirm-v1.yml"
  workflow_dispatch:
jobs:
  cold:
    strategy:
      fail-fast: false
      matrix:
        case_id: [C01,C02,C03,C04,C05,C06,C07,C08,C09,C10,C11,C12]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install local inference stack
        run: pip -q install "transformers>=4.56" torch accelerate sentencepiece
      - name: Run R0, specialist deltas, unguarded R1 and guarded R1
        env:
          CASE_ID: ${{ matrix.case_id }}
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          cat > /tmp/run.py <<'PY'
          import json,os,re,pathlib,torch
          from transformers import AutoTokenizer,AutoModelForCausalLM
          bid="benchmarks/regression-guard-cold-confirm-v1.json"
          b=json.load(open(bid))
          c=next(x for x in b["cases"] if x["id"]==os.environ["CASE_ID"])
          # Criteria deliberately not used below.
          model_id="HuggingFaceTB/SmolLM3-3B"
          tok=AutoTokenizer.from_pretrained(model_id)
          mdl=AutoModelForCausalLM.from_pretrained(model_id,torch_dtype=torch.float32)
          def ask(system,user,max_new=420):
            msgs=[{"role":"system","content":system},{"role":"user","content":user}]
            try:
              ids=tok.apply_chat_template(msgs,tokenize=True,add_generation_prompt=True,enable_thinking=False,return_tensors="pt")
            except TypeError:
              ids=tok.apply_chat_template(msgs,tokenize=True,add_generation_prompt=True,return_tensors="pt")
            with torch.no_grad():
              out=mdl.generate(ids,max_new_tokens=max_new,do_sample=False,pad_token_id=tok.eos_token_id)
            s=tok.decode(out[0][ids.shape[-1]:],skip_special_tokens=True)
            s=re.sub(r"(?s)^.*?</think>\s*","",s).strip()
            return s
          base_sys="Answer the task accurately and concisely. Separate what is established from what remains uncertain. Do not invent missing evidence."
          r0=ask(base_sys,c["prompt"])
          roles=[
            ("ERROR","Find factual, logical, causal, scope, bound, or certainty errors in R0. Return only useful corrections."),
            ("EVIDENCE","Find missing evidence, provenance, dependency, validation, or uncertainty issues in R0. Return only useful corrections."),
            ("REDTEAM","Attack R0: seek counterexamples, hidden assumptions, common dependencies, scope transfer, and failure modes. Return only useful corrections."),
            ("ALTERNATIVE","Solve independently enough to identify a materially better reasoning path or missing conclusion. Return only useful corrections.")
          ]
          deltas=[]
          for role,mission in roles:
            deltas.append({"role":role,"text":ask("You are a specialist reviewer. "+mission,"TASK:\n"+c["prompt"]+"\n\nR0:\n"+r0,300)})
          blind=ask("Solve independently. You have not seen another answer. Focus on traps, dependencies, scope, evidence and uncertainty.",c["prompt"],360)
          packet="\n\n".join("["+d["role"]+"] "+d["text"] for d in deltas)+"\n\n[BLIND] "+blind
          r1u=ask("Improve R0 using the specialist packet. Preserve useful content but integrate corrections. Do not mention the review process.",
                  "TASK:\n"+c["prompt"]+"\n\nR0:\n"+r0+"\n\nSPECIALISTS:\n"+packet,480)
          guard_prompt="""You are CEREBRON REGRESSION GUARD. Compare R0 and candidate R1 using only general invariants, not hidden benchmark criteria.
Detect: polarity reversal, causal-direction reversal, bound-direction reversal, unsupported scope/revision/population transfer, certainty escalation, erased dependency/common cause, unsupported new claim, or lost constraint/uncertainty.
Preserve supported R0 claims unless stronger evidence in the task or specialist packet justifies replacement. Consensus is not evidence. Ambiguous critical changes fail closed.
Return a corrected final answer only. If candidate R1 is unsafe and cannot be repaired, fall back to R0."""
          r1g=ask(guard_prompt,"TASK:\n"+c["prompt"]+"\n\nR0:\n"+r0+"\n\nCANDIDATE R1:\n"+r1u+"\n\nSPECIALIST PACKET:\n"+packet,520)
          taint=lambda x:"<think>" in x.lower() or "</think>" in x.lower()
          out={"case":c["id"],"model":model_id,"r0":r0,"deltas":deltas,"blind":blind,"r1_unguarded":r1u,"r1_guarded":r1g,
               "tainted":{"r0":taint(r0),"r1_unguarded":taint(r1u),"r1_guarded":taint(r1g)},
               "criteria_exposed_to_generation":False,"real_inference_calls":8}
          pathlib.Path("out").mkdir()
          open("out/result.json","w").write(json.dumps(out,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps({"case":c["id"],"calls":8,"tainted":out["tainted"]}))
          PY
          python /tmp/run.py
      - uses: actions/upload-artifact@v4
        with:
          name: regression-guard-cold-${{ matrix.case_id }}
          path: out/result.json
          if-no-files-found: error
