name: Regression Guard Cold Confirm V1
"on":
  push:
    paths:
      - ".github/workflows/regression-guard-cold-confirm-v1.yml"
  workflow_dispatch: {}
jobs:
  cold:
    strategy:
      fail-fast: false
      matrix:
        case_id:
          - C01
          - C02
          - C03
          - C04
          - C05
          - C06
          - C07
          - C08
          - C09
          - C10
          - C11
          - C12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen case exists
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          python - <<'PY'
          import json, os
          b=json.load(open("benchmarks/regression-guard-cold-confirm-v1.json"))
          ids={x["id"] for x in b["cases"]}
          cid=os.environ["CASE_ID"]
          assert cid in ids, cid
          print("PRECHECK_PASS",cid)
          PY
