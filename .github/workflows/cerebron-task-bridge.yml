name: CEREBRON Task Bridge

on:
  push:
    branches: [main]
    paths:
      - 'tasks/dispatch/**.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cerebron-task-bridge
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Memory-safe mission gate
        shell: bash
        run: |
          set -euo pipefail
          FILE=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^tasks/dispatch/.*\.json$' | head -n 1 || true)
          test -n "$FILE"
          python - "$FILE" <<'PY'
          import json,sys,os
          p=sys.argv[1]
          MAX_TASK_BYTES=65536
          MAX_INLINE_CHARS=24000
          size=os.path.getsize(p)
          if size>MAX_TASK_BYTES:
              raise SystemExit(f"FAIL_CLOSED task too large: {size}")
          d=json.load(open(p,encoding="utf-8"))
          raw=json.dumps(d,ensure_ascii=False)
          if len(raw)>MAX_INLINE_CHARS:
              raise SystemExit("FAIL_CLOSED inline mission exceeds memory budget")
          if d.get("status") not in ("QUEUED","QUEUED_NOT_EXECUTED"):
              raise SystemExit("FAIL_CLOSED invalid task status")
          print("MISSION_ACCEPTED",p,size)
          PY
      - name: Architecture notice
        run: |
          echo "This bridge validates and triggers queued missions."
          echo "Heavy outputs MUST be artifacts; hot memory receives only deduplicated summaries + SHA."
          echo "No external AI execution is claimed by this gate alone."
