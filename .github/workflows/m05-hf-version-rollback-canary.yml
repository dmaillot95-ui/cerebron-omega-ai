name: M05 HF Version Rollback Canary
on:
  push:
    branches: [main]
    paths:
      - 'config/m05-rollback-sample-v1.json'
      - '.github/workflows/m05-hf-version-rollback-canary.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
      M03_RUN: '35995124491'
      M05_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet --upgrade huggingface_hub
      - name: Write second versions and verify rollback targets
        run: |
          python - <<'PY'
          import os,json,hashlib,datetime
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download

          token=os.environ["HF_TOKEN"]; repo=os.environ["HF_REPO"]
          m03_run=os.environ["M03_RUN"]; m05_run=os.environ["M05_RUN"]
          cfg=json.loads(Path("config/m05-rollback-sample-v1.json").read_text())
          m03=json.loads(Path("receipts/p03/all-ai-hf-m03.json").read_text())
          old={x["ai_id"]:x for x in m03["results"] if x.get("status")=="PASS"}
          api=HfApi(token=token)
          info=api.repo_info(repo_id=repo,repo_type="model")
          if not getattr(info,"private",False): raise SystemExit("HF_PRIVATE_REPO=FAIL")
          out={"schema":"CEREBRON_M05_ROLLBACK_RECEIPT_V1","run_id":m05_run,"parent_run_id":m03_run,
               "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "results":[],"status":"PASS"}

          for item in cfg["sample"]:
              aid=item["ai_id"]; parent=old[aid]
              parent_path=parent["remote_object"]; parent_sha=parent["payload_sha256"]
              # prove old generation still exists and is unchanged before writing new generation
              old_file=hf_hub_download(repo_id=repo,filename=parent_path,repo_type="model",token=token,force_download=True)
              old_bytes=Path(old_file).read_bytes()
              old_sha=hashlib.sha256(old_bytes).hexdigest()
              if old_sha!=parent_sha: raise SystemExit("PARENT_SHA_PREWRITE_FAIL:"+aid)

              prefix=parent_path.split("/M7_EVIDENCE/")[0]
              new_path=f"{prefix}/M7_EVIDENCE/{m05_run}.json"
              payload={
                "schema":"CEREBRON_AI_MEMORY_VERSION_V2",
                "ai_id":aid,
                "identity":parent["identity"],
                "agent_slot":"A6_MEMORY_KEEPER",
                "memory_class":"M7_EVIDENCE",
                "generation":"M05",
                "parent_generation":"M03",
                "parent_run_id":m03_run,
                "parent_object_path":parent_path,
                "parent_payload_sha256":parent_sha,
                "rollback_object_path":parent_path,
                "rollback_payload_sha256":parent_sha,
                "run_id":m05_run,
                "private":True,
                "purpose":"M05_VERSION_AND_ROLLBACK_TEST_NOT_TRAINING"
              }
              raw=(json.dumps(payload,sort_keys=True,separators=(",",":"))+"\n").encode()
              new_sha=hashlib.sha256(raw).hexdigest()
              local="/tmp/"+aid.replace("/","-")+".json";Path(local).write_bytes(raw)
              api.upload_file(path_or_fileobj=local,path_in_repo=new_path,repo_id=repo,repo_type="model",
                              commit_message="M05 versioned rollback fixture "+aid)
              new_file=hf_hub_download(repo_id=repo,filename=new_path,repo_type="model",token=token,force_download=True)
              new_got=Path(new_file).read_bytes()
              if hashlib.sha256(new_got).hexdigest()!=new_sha: raise SystemExit("NEW_SHA_FAIL:"+aid)

              # rollback proof: re-read parent after second-version write and verify exact old SHA
              rb_file=hf_hub_download(repo_id=repo,filename=parent_path,repo_type="model",token=token,force_download=True)
              rb_bytes=Path(rb_file).read_bytes()
              rb_sha=hashlib.sha256(rb_bytes).hexdigest()
              ok=(rb_sha==parent_sha)
              out["results"].append({
                "ai_id":aid,"family":item["family"],"status":"PASS" if ok else "FAIL",
                "parent_object":parent_path,"parent_sha256":parent_sha,
                "new_object":new_path,"new_sha256":new_sha,
                "rollback_read":"PASS" if ok else "FAIL",
                "parent_unchanged_after_new_write":"PASS" if ok else "FAIL"
              })
              if not ok: out["status"]="FAIL"

          out["summary"]={"sample":len(out["results"]),"passed":sum(x["status"]=="PASS" for x in out["results"]),
                          "failed":sum(x["status"]=="FAIL" for x in out["results"])}
          Path("receipts/p03/m05-hf-rollback.json").write_text(json.dumps(out,indent=2)+"\n")
          if out["status"]!="PASS": raise SystemExit(2)
          PY
      - name: Persist receipt
        if: always()
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/p03/m05-hf-rollback.json
          git diff --cached --quiet && exit 0
          git commit -m "M05 receipt: HF version and rollback canary"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
