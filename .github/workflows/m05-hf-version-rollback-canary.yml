name: M05 HF Version Rollback Canary
on:
  push:
    branches: [main]
    paths:
      - 'config/m05-retry-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
      M03_RUN: '35996621664'
      M05_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --quiet --upgrade huggingface_hub
      - name: Batch-write second versions and verify rollback targets
        run: |
          python - <<'PY'
          import os,json,hashlib,datetime,time
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download,CommitOperationAdd

          token=os.environ["HF_TOKEN"]; repo=os.environ["HF_REPO"]
          m03_run=os.environ["M03_RUN"]; m05_run=os.environ["M05_RUN"]
          cfg=json.loads(Path("config/m05-rollback-sample-v1.json").read_text())
          m03=json.loads(Path(cfg["parent_receipt"]).read_text())
          if str(m03.get("run_id"))!=m03_run:
              raise SystemExit("PINNED_PARENT_RUN_MISMATCH")
          old={x["ai_id"]:x for x in m03["results"] if x.get("status")=="PASS"}
          api=HfApi(token=token)

          def retry_read(label,fn,attempts=6):
              last=None
              for n in range(attempts):
                  try: return fn()
                  except Exception as e:
                      last=e
                      msg=str(e)
                      if "429" not in msg and "Too Many Requests" not in msg: raise
                      delay=min(60,5*(2**n))
                      print(f"{label}=RATE_LIMIT_RETRY_{n+1} delay={delay}s")
                      time.sleep(delay)
              raise last

          info=retry_read("HF_REPO_INFO",lambda: api.repo_info(repo_id=repo,repo_type="model"))
          if not getattr(info,"private",False): raise SystemExit("HF_PRIVATE_REPO=FAIL")

          pending=[]
          prepared=[]
          for item in cfg["sample"]:
              aid=item["ai_id"]; parent=old[aid]
              parent_path=parent["remote_object"]; parent_sha=parent["payload_sha256"]
              old_file=retry_read("PARENT_READ_"+aid,lambda p=parent_path: hf_hub_download(repo_id=repo,filename=p,repo_type="model",token=token,force_download=True))
              old_bytes=Path(old_file).read_bytes()
              if hashlib.sha256(old_bytes).hexdigest()!=parent_sha:
                  raise SystemExit("PARENT_SHA_PREWRITE_FAIL:"+aid)

              prefix=parent_path.split("/M7_EVIDENCE/")[0]
              new_path=f"{prefix}/M7_EVIDENCE/{m05_run}.json"
              payload={
                "schema":"CEREBRON_AI_MEMORY_VERSION_V3",
                "ai_id":aid,
                "identity":parent["identity"],
                "agent_slot":"A6_MEMORY_KEEPER",
                "memory_class":"M7_EVIDENCE",
                "generation":"M05",
                "parent_generation":"M03",
                "parent_run_id":m03_run,
                "parent_object_path":parent_path,
                "parent_payload_sha256":parent_sha,
                "rollback_object_path":parent_path,
                "rollback_payload_sha256":parent_sha,
                "run_id":m05_run,
                "private":True,
                "purpose":"M05_BATCH_VERSION_AND_ROLLBACK_TEST_NOT_TRAINING"
              }
              raw=(json.dumps(payload,sort_keys=True,separators=(",",":"))+"\n").encode()
              local="/tmp/"+aid.replace("/","-")+".json"
              Path(local).write_bytes(raw)
              new_sha=hashlib.sha256(raw).hexdigest()
              pending.append(CommitOperationAdd(path_in_repo=new_path,path_or_fileobj=local))
              prepared.append((item,parent_path,parent_sha,new_path,new_sha))

          # One HF repository commit for all 7 objects.
          api.create_commit(
              repo_id=repo,repo_type="model",operations=pending,
              commit_message="M05 batch: 7 versioned rollback fixtures"
          )

          out={"schema":"CEREBRON_M05_ROLLBACK_RECEIPT_V2","run_id":m05_run,
               "parent_run_id":m03_run,
               "parent_receipt":cfg["parent_receipt"],
               "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
               "hf_commit_mode":"SINGLE_BATCH_COMMIT_7_OBJECTS",
               "results":[],"status":"PASS"}

          for item,parent_path,parent_sha,new_path,new_sha in prepared:
              aid=item["ai_id"]
              new_file=retry_read("NEW_READ_"+aid,lambda p=new_path: hf_hub_download(repo_id=repo,filename=p,repo_type="model",token=token,force_download=True))
              if hashlib.sha256(Path(new_file).read_bytes()).hexdigest()!=new_sha:
                  raise SystemExit("NEW_SHA_FAIL:"+aid)
              obj=json.loads(Path(new_file).read_text())
              if str(obj.get("parent_run_id"))!=m03_run:
                  raise SystemExit("NEW_PARENT_METADATA_FAIL:"+aid)
              rb_file=retry_read("ROLLBACK_READ_"+aid,lambda p=parent_path: hf_hub_download(repo_id=repo,filename=p,repo_type="model",token=token,force_download=True))
              rb_sha=hashlib.sha256(Path(rb_file).read_bytes()).hexdigest()
              ok=rb_sha==parent_sha
              out["results"].append({
                "ai_id":aid,"family":item["family"],"status":"PASS" if ok else "FAIL",
                "parent_run_id":m03_run,"parent_object":parent_path,"parent_sha256":parent_sha,
                "new_object":new_path,"new_sha256":new_sha,
                "new_parent_metadata":"PASS",
                "rollback_read":"PASS" if ok else "FAIL",
                "parent_unchanged_after_new_write":"PASS" if ok else "FAIL"
              })
              if not ok: out["status"]="FAIL"

          out["summary"]={"sample":len(out["results"]),"passed":sum(x["status"]=="PASS" for x in out["results"]),
                          "failed":sum(x["status"]=="FAIL" for x in out["results"])}
          Path("receipts/p03/m05-hf-rollback").mkdir(parents=True,exist_ok=True)
          versioned=Path("receipts/p03/m05-hf-rollback")/f"{m05_run}.json"
          versioned.write_text(json.dumps(out,indent=2)+"\n")
          Path("receipts/p03/m05-hf-rollback-latest.json").write_text(json.dumps({
              "schema":"CEREBRON_M05_ROLLBACK_LATEST_V1","run_id":m05_run,"receipt":str(versioned)
          },indent=2)+"\n")
          if out["status"]!="PASS": raise SystemExit(2)
          PY
      - name: Persist immutable non-sensitive receipt
        if: always()
        run: |
          test -d receipts/p03/m05-hf-rollback || exit 0
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/p03/m05-hf-rollback/ receipts/p03/m05-hf-rollback-latest.json
          git diff --cached --quiet && exit 0
          git commit -m "M05 receipt: batch HF version and rollback canary"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
