name: M10 Semantic Audit Decision Guard
on:
  push:
    branches: [main]
    paths:
      - 'receipts/agora/m10-semantic-audit-*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/validate_m10_semantic_audit.py
