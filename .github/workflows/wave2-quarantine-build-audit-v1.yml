name: CEREBRON Wave2 Quarantine Build Audit
on:
  push:
    branches: ['feat/wave2-parallel-ai-baselines-v1']
    paths:
      - 'config/wave2-quarantine-build-audit-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Wave2 data chain
        run: |
          python -m py_compile tools/wave2_quarantine_candidate_builder.py
          python -m py_compile tools/wave2_quarantine_semantic_audit.py
      - name: Build deterministic Wave2 quarantine
        run: |
          python tools/wave2_quarantine_candidate_builder.py             --output artifacts/wave2-quarantine-candidates-v1.json
      - name: Independent semantic and tamper audit
        run: |
          python tools/wave2_quarantine_semantic_audit.py             --input artifacts/wave2-quarantine-candidates-v1.json             --baseline-config config/wave2-parallel-role-baseline-v1.json             --output artifacts/wave2-quarantine-semantic-audit-v1.json
      - name: Build Wave2 public pointer
        run: |
          mkdir -p receipts/wave2
          python - <<'PY'
          import hashlib,json,os,pathlib
          c=json.loads(pathlib.Path("artifacts/wave2-quarantine-candidates-v1.json").read_text())
          a=json.loads(pathlib.Path("artifacts/wave2-quarantine-semantic-audit-v1.json").read_text())
          assert c["record_count"]==456
          assert c["roles"]=={"SPIRALION":96,"HYPERION":96,"ASTRION":96,"SAPHEA_MICRO":168}
          assert c["training_released"] is False
          assert a["source_manifest_sha256"]==c["manifest_sha256"]
          assert a["semantic_pass_count"]==456
          assert a["semantic_fail_count"]==0
          assert a["unresolved_count"]==0
          assert a["exact_baseline_prompt_overlap_count"]==0
          assert a["tamper_case_count"]==19
          assert a["tamper_detected_count"]==19
          assert a["decision"]=="AUDIT_COUNTER_AUDIT_PASS_F72_PENDING"
          receipt={
            "schema":"CEREBRON_WAVE2_QUARANTINE_BUILD_AUDIT_POINTER_V1",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "manifest_sha256":c["manifest_sha256"],
            "record_count":456,
            "role_counts":c["roles"],
            "semantic_pass_count":456,
            "semantic_fail_count":0,
            "unresolved_count":0,
            "exact_baseline_prompt_overlap_count":0,
            "tamper_case_count":19,
            "tamper_detected_count":19,
            "training_released":False,
            "state":"AUDIT_COUNTER_AUDIT_PASS_F72_PENDING",
            "report_sha256":a["report_sha256"],
            "claim_ceiling":"AUDITED_SYNTHETIC_CONTRACT_CANDIDATES_NOT_GOLD_NOT_TRAINING_RELEASED"
          }
          raw=json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()
          receipt["receipt_sha256"]=hashlib.sha256(raw).hexdigest()
          p=pathlib.Path("receipts/wave2")/f"wave2-quarantine-build-audit-{os.environ['GITHUB_RUN_ID']}.json"
          p.write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-quarantine-build-audit-${{ github.run_id }}
          path: |
            artifacts/wave2-quarantine-candidates-v1.json
            artifacts/wave2-quarantine-semantic-audit-v1.json
            receipts/wave2/wave2-quarantine-build-audit-${{ github.run_id }}.json
          if-no-files-found: error
      - name: Persist Wave2 quarantine pointer
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/wave2/wave2-quarantine-build-audit-${{ github.run_id }}.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: Wave2 quarantine build audit ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin feat/wave2-parallel-ai-baselines-v1 && git push && exit 0
            sleep 5
          done
          exit 1
