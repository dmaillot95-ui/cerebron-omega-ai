name: Wave3B ALPHA OMEGA DELTA M6 V2 Private Seal
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'config/wave3b-alpha-omega-delta-m6-v2-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  seal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ai: ALPHA
            slug: alpha
            private_path: alpha/M6/ALPHA-M6-V2.json
          - ai: OMEGA
            slug: omega
            private_path: omega/M6/OMEGA-M6-V2.json
          - ai: DELTA
            slug: delta
            private_path: delta/M6/DELTA-M6-V2.json
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet --upgrade huggingface_hub
      - name: Seal private M6
        env:
          AI: ${{ matrix.ai }}
          SLUG: ${{ matrix.slug }}
          PRIVATE_PATH: ${{ matrix.private_path }}
        run: |
          mkdir -p receipts/wave3b-m6-v2
          python - <<'PY'
          import hashlib,json,os,pathlib,secrets,tempfile
          from collections import Counter
          from huggingface_hub import HfApi,hf_hub_download

          ai=os.environ["AI"]; slug=os.environ["SLUG"]; private_path=os.environ["PRIVATE_PATH"]
          token=os.environ.get("HF_TOKEN","")
          if not token: raise SystemExit("HF_TOKEN_MISSING")
          repo=os.environ["HF_REPO"]
          api=HfApi(token=token)
          info=api.repo_info(repo_id=repo,repo_type="model")
          if not bool(getattr(info,"private",False)): raise SystemExit("HF_REPO_NOT_PRIVATE")
          files=set(api.list_repo_files(repo_id=repo,repo_type="model"))

          domain_map={
            "ALPHA":["diversity","novel_representation","coverage","useful_divergence","redundancy_control","transfer"],
            "OMEGA":["formal_validity","counterexample_search","proof_gap_detection","assumption_audit","reproduction","calibration"],
            "DELTA":["model_fidelity","assumption_control","dimensional_consistency","simulation_design","sensitivity","transfer"]
          }
          if ai not in domain_map: raise SystemExit("UNKNOWN_AI")

          def evidence(domain,label,a,b,c):
              table={
                "diversity":{
                  "PASS":f"{c} candidate approaches use genuinely different mechanisms and assumptions",
                  "FAIL":f"{c} candidates are paraphrases of the same mechanism",
                  "INSUFFICIENT":"candidate descriptions are too incomplete to establish independence"
                },
                "novel_representation":{
                  "PASS":f"representation R{a} changes the state variables and exposes a testable invariant",
                  "FAIL":f"representation R{a} only renames existing variables without changing structure",
                  "INSUFFICIENT":"the proposed representation lacks a mapping back to the original problem"
                },
                "coverage":{
                  "PASS":f"search explicitly covers all {c} predefined branches with receipts",
                  "FAIL":f"search claims full coverage while branch B{b} is omitted",
                  "INSUFFICIENT":"search breadth is reported but the branch inventory is unavailable"
                },
                "useful_divergence":{
                  "PASS":f"new route R{a} yields a falsifiable prediction and a concrete test",
                  "FAIL":f"new route R{a} adds novelty but no constraint, prediction, or test",
                  "INSUFFICIENT":"route R lacks enough detail to judge usefulness"
                },
                "redundancy_control":{
                  "PASS":f"near-duplicate hypotheses were clustered by fingerprint before counting {c} survivors",
                  "FAIL":f"duplicate hypotheses are counted as independent discoveries",
                  "INSUFFICIENT":"no deduplication metadata is available"
                },
                "formal_validity":{
                  "PASS":f"each implication is justified and the final statement follows from assumptions A{a},A{b}",
                  "FAIL":f"the proof divides by an expression that may equal zero",
                  "INSUFFICIENT":"one central lemma is stated without proof or admissible citation"
                },
                "counterexample_search":{
                  "PASS":f"a claimed universal rule is falsified by explicit admissible case x={a}",
                  "FAIL":"the reported counterexample violates the hypothesis of the theorem",
                  "INSUFFICIENT":"search found no counterexample but did not exhaust or bound the remaining domain"
                },
                "proof_gap_detection":{
                  "PASS":f"gap G{a} identifies the exact unsupported transition between steps {c} and {c+1}",
                  "FAIL":"audit declares the proof complete despite a missing necessity direction",
                  "INSUFFICIENT":"the cited proof fragment is unavailable for inspection"
                },
                "assumption_audit":{
                  "PASS":f"all assumptions are explicit and assumption A{a} is traced to the conclusion it supports",
                  "FAIL":f"conclusion relies on hidden assumption A{a} not present in the premises",
                  "INSUFFICIENT":"the model statement is incomplete, so assumptions cannot be enumerated"
                },
                "reproduction":{
                  "PASS":f"same code revision, seed {b}, inputs and output reproduce exactly",
                  "FAIL":f"same inputs and code revision produce a different output under seed {b}",
                  "INSUFFICIENT":"seed or code revision is missing, preventing exact reproduction"
                },
                "calibration":{
                  "PASS":f"confidence {a}% is reported with empirical calibration and scoped limitations",
                  "FAIL":f"one benchmark score {a}% is presented as universal certainty",
                  "INSUFFICIENT":f"confidence {a}% is given without calibration evidence"
                },
                "model_fidelity":{
                  "PASS":f"model error remains within preregistered tolerance on held-out cases {c}",
                  "FAIL":f"model misses a held-out observable by {a}% beyond tolerance",
                  "INSUFFICIENT":"only training-fit error is reported; no held-out fidelity check exists"
                },
                "assumption_control":{
                  "PASS":f"assumption A{a} is varied and its validity range is explicitly bounded",
                  "FAIL":f"assumption A{a} is known violated in the simulated regime but retained unchanged",
                  "INSUFFICIENT":"the dominant assumptions are not documented"
                },
                "dimensional_consistency":{
                  "PASS":"every equation is dimensionally consistent after unit normalization",
                  "FAIL":"an equation adds a quantity in seconds to a quantity in meters",
                  "INSUFFICIENT":"units are missing for one required variable"
                },
                "simulation_design":{
                  "PASS":f"simulation includes baseline, perturbation, control and {c} independent repetitions",
                  "FAIL":"simulation changes multiple factors simultaneously and attributes the effect to one factor",
                  "INSUFFICIENT":"boundary conditions and initialization are unspecified"
                },
                "sensitivity":{
                  "PASS":f"sensitivity scan varies the dominant parameter across {c} values and reports response",
                  "FAIL":"robustness is claimed from a single nominal parameter setting",
                  "INSUFFICIENT":"parameter uncertainty ranges are unknown"
                },
                "transfer":{
                  "PASS":f"method retains performance on held-out domain T{c} with no critical regression",
                  "FAIL":f"method improves source cases but fails held-out domain T{c}",
                  "INSUFFICIENT":"no held-out transfer evaluation has been executed"
                }
              }
              return table[domain][label]

          created_now=False
          if private_path in files:
              fn=pathlib.Path(hf_hub_download(repo_id=repo,filename=private_path,repo_type="model",token=token,force_download=True))
              suite=json.loads(fn.read_bytes())
          else:
              rng=secrets.SystemRandom(); tasks=[]
              for domain in domain_map[ai]:
                  labels=["PASS"]*4+["FAIL"]*4+["INSUFFICIENT"]*4
                  rng.shuffle(labels)
                  for label in labels:
                      a=rng.randint(11,97); b=rng.randint(101,999); c=rng.randint(3,17); nonce=secrets.token_hex(4)
                      ev=evidence(domain,label,a,b,c)
                      prompt=f"{ai} {domain} audit {nonce}. Evidence: {ev}. Is the claimed status supported? Return only PASS, FAIL, or INSUFFICIENT."
                      tasks.append({"id":f"{ai}-M6V2-{len(tasks)+1:03d}","domain":domain,"prompt":prompt,"expected":label})
              assert len(tasks)==72
              dc=Counter(t["domain"] for t in tasks); lc=Counter(t["expected"] for t in tasks)
              assert len(dc)==6 and all(v==12 for v in dc.values())
              assert lc=={"PASS":24,"FAIL":24,"INSUFFICIENT":24}
              suite={
                "schema":f"{ai}_M6_PRIVATE_SYNTHETIC_V2","ai_id":ai,
                "classification":"M6_COLD_BENCHMARK_SEALED_PRIVATE",
                "deny_training":True,"training_eligible":False,"exact_prompts_public":False,
                "generation_policy":"SYSTEM_RANDOM_RUNTIME_ONE_TIME_SEAL",
                "task_count":72,"domain_counts":dict(sorted(dc.items())),"label_counts":dict(sorted(lc.items())),"tasks":tasks
              }
              raw=(json.dumps(suite,indent=2,ensure_ascii=False)+"\n").encode()
              with tempfile.NamedTemporaryFile("wb",delete=False) as tf: tf.write(raw); src=tf.name
              api.upload_file(path_or_fileobj=src,path_in_repo=private_path,repo_id=repo,repo_type="model",commit_message=f"Seal {ai} M6 V2 private")
              created_now=True

          if suite.get("deny_training") is not True or suite.get("training_eligible") is not False or suite.get("exact_prompts_public") is not False:
              raise SystemExit("M6_GUARD_FAIL")
          raw=(json.dumps(suite,indent=2,ensure_ascii=False)+"\n").encode(); sha=hashlib.sha256(raw).hexdigest()
          rb=pathlib.Path(hf_hub_download(repo_id=repo,filename=private_path,repo_type="model",token=token,force_download=True))
          if hashlib.sha256(rb.read_bytes()).hexdigest()!=sha: raise SystemExit("M6_READBACK_SHA_FAIL")
          receipt={
            "schema":f"{ai}_M6_V2_PRIVATE_RELEASE_RECEIPT","run_id":int(os.environ["GITHUB_RUN_ID"]),
            "ai_id":ai,"created_now":created_now,"private_path":private_path,"dataset_sha256":sha,
            "task_count":72,"domain_counts":suite["domain_counts"],"label_counts":suite["label_counts"],
            "deny_training":True,"training_eligible":False,"exact_prompts_public":False,
            "hf_private_readback_sha_pass":True,
            "claim_ceiling":"PRIVATE_RUNTIME_GENERATED_SYNTHETIC_M6_NO_TRAINING"
          }
          receipt["receipt_sha256"]=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          pathlib.Path(f"receipts/wave3b-m6-v2/{slug}.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave3b-m6-v2-${{ matrix.slug }}
          path: receipts/wave3b-m6-v2/${{ matrix.slug }}.json
          if-no-files-found: error
  audit:
    needs: seal
    if: always() && needs.seal.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wave3b-m6-v2-*
          path: downloaded
          merge-multiple: true
      - name: Audit and persist
        run: |
          mkdir -p receipts/wave3b-m6-v2
          python - <<'PY'
          import glob,json,pathlib,shutil
          rows=[json.load(open(p)) for p in glob.glob("downloaded/*.json")]
          assert {r["ai_id"] for r in rows}=={"ALPHA","OMEGA","DELTA"} and len(rows)==3
          for r in rows:
              assert r["deny_training"] is True and r["training_eligible"] is False
              assert r["exact_prompts_public"] is False and r["hf_private_readback_sha_pass"] is True
          for p in glob.glob("downloaded/*.json"): shutil.copy2(p,pathlib.Path("receipts/wave3b-m6-v2")/pathlib.Path(p).name)
          print(json.dumps({"status":"PASS","ai_ids":sorted(r["ai_id"] for r in rows)}))
          PY
      - name: Persist receipts
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/wave3b-m6-v2/
          git diff --cached --quiet && exit 0
          git commit -m "receipt: ALPHA OMEGA DELTA M6 V2 private seals ${{ github.run_id }}"
          git pull --rebase origin feat/cerebron-ai-platform-mvp
          git push origin HEAD:feat/cerebron-ai-platform-mvp
