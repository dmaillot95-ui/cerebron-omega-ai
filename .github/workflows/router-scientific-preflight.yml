name: CEREBRON OpenRouter Safe Test 1

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/router-scientific-preflight.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Test one scientific call
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          # Nettoyage défensif du secret
          key = os.environ.get("OPENROUTER_API_KEY", "").strip()

          if not key:
              print("RESULT=FAIL")
              print("REASON=MISSING_SECRET")
              raise SystemExit(1)

          prompt = """
          CEREBRON scientific preflight.

          Analyze one consistency constraint in relativistic
          hydrodynamics:

          Explain how four-velocity normalization and causality
          constrain physically admissible fluid states.

          Define assumptions.
          Separate established physics from inference.

          CLAIM <= EVIDENCE.
          """

          payload = json.dumps({
              "model": "openrouter/free",
              "messages": [
                  {
                      "role": "user",
                      "content": prompt
                  }
              ],
              "max_tokens": 300
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=payload,
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
                  "X-Title": "CEREBRON Omega"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = json.loads(response.read().decode("utf-8"))

              text = (
                  ((data.get("choices") or [{}])[0]
                  .get("message") or {})
                  .get("content", "")
              ).strip()

              model = data.get("model", "unknown")

              if not text:
                  print("RESULT=FAIL")
                  print("REASON=EMPTY_RESPONSE")
                  raise SystemExit(1)

              print("RESULT=SUCCESS")
              print("EXTERNAL_RESPONSES=1/1")
              print("MODEL=" + str(model))
              print("RESPONSE_RECEIVED=YES")

          except urllib.error.HTTPError as error:
              # Ne jamais imprimer le corps complet de l'erreur :
              # il pourrait contenir des informations sensibles.
              print("RESULT=FAIL")
              print("HTTP_STATUS=" + str(error.code))
              raise SystemExit(1)

          except Exception as error:
              # Type uniquement, aucune valeur potentiellement sensible.
              print("RESULT=FAIL")
              print("ERROR_TYPE=" + type(error).__name__)
              raise SystemExit(1)
          PY
