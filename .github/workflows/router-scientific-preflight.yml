name: CEREBRON OpenRouter Adaptive Queue Test 20

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/router-scientific-preflight.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Test twenty scientific calls
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import time
          import collections
          import urllib.request
          import urllib.error

          key = os.environ.get("OPENROUTER_API_KEY", "").strip()

          if not key:
              print("RESULT=FAIL")
              print("REASON=MISSING_SECRET")
              raise SystemExit(1)

          TOTAL = 20
          MIN_CHARS = 120
          BASE_DELAY = 8
          RATE_LIMIT_DELAY = 35

          roles = [
              "REALITY_RESEARCH",
              "SYSTEM_ARCHITECT",
              "CALCULATION",
              "SIMULATION",
              "CAUSAL_ANALYSIS",
              "INVENTION",
              "FAILURE_ANALYSIS",
              "COUNTEREXAMPLE_HUNTER",
              "FALSIFIER",
              "FORMAL_AUDITOR",
              "INDEPENDENT_REPLICATOR",
              "UNCERTAINTY_ANALYST",
              "INTERFACE_ANALYST",
              "INVARIANT_HUNTER",
              "EXPERIMENT_DESIGN",
              "CONTRADICTION_RESOLUTION",
              "UNKNOWN_GAP_ANALYST",
              "EVIDENCE_AUDITOR",
              "SYNTHESIS_ANALYST",
              "OMEGA_JUDGE"
          ]

          results = []
          models = collections.Counter()
          errors = collections.Counter()

          print("SECRET_PRESENT=YES")
          print("PLANNED_CALLS=" + str(TOTAL))

          for i in range(TOTAL):

              role = roles[i]

              prompt = f"""
              CEREBRON OMEGA scientific test.

              Worker {i+1:02d}/20
              Role: {role}

              Subject:
              relativistic hydrodynamics.

              Analyze how four-velocity normalization,
              causality and relativistic signal propagation
              constrain physically admissible fluid states.

              Focus specifically on the perspective of:
              {role}

              Define assumptions.
              Identify possible failure modes.
              Separate established physics from inference.

              REALITY > COHERENCE.
              EVIDENCE > CONFIDENCE.
              CLAIM <= EVIDENCE.
              """

              payload = json.dumps({
                  "model": "openrouter/free",
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "max_tokens": 350
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=payload,
                  headers={
                      "Authorization": "Bearer " + key,
                      "Content-Type": "application/json",
                      "HTTP-Referer":
                          "https://github.com/dmaillot95-ui/cerebron-omega-ai",
                      "X-Title": "CEREBRON Omega"
                  },
                  method="POST"
              )

              success = False
              last_error = ""

              for attempt in range(3):

                  try:
                      start = time.time()

                      with urllib.request.urlopen(
                          request,
                          timeout=90
                      ) as response:
                          status = response.getcode()
                          raw = response.read().decode("utf-8")

                      data = json.loads(raw)

                      choices = data.get("choices")

                      if not isinstance(choices, list) or not choices:
                          raise ValueError("NO_CHOICES")

                      choice = choices[0]

                      if not isinstance(choice, dict):
                          raise ValueError("INVALID_CHOICE")

                      message = choice.get("message")

                      if not isinstance(message, dict):
                          raise ValueError("INVALID_MESSAGE")

                      content = message.get("content")

                      if isinstance(content, str):
                          text = content.strip()

                      elif isinstance(content, list):
                          parts = []

                          for item in content:
                              if isinstance(item, dict):
                                  value = item.get("text")

                                  if isinstance(value, str):
                                      parts.append(value)

                          text = "\n".join(parts).strip()

                      else:
                          text = ""

                      if not text:
                          last_error = "EMPTY_CONTENT"
                          if attempt < 2:
                              wait = 8 * (attempt + 1)
                              print(f"CALL={i+1:02d}/20 RETRY=YES REASON=EMPTY_CONTENT WAIT={wait}s ATTEMPT={attempt+1}")
                              time.sleep(wait)
                              continue
                          break

                      if len(text) < MIN_CHARS:
                          last_error = "LOW_QUALITY_SHORT_CONTENT_" + str(len(text))
                          if attempt < 2:
                              wait = 8 * (attempt + 1)
                              print(f"CALL={i+1:02d}/20 RETRY=YES REASON=SHORT_CONTENT CHARS={len(text)} WAIT={wait}s ATTEMPT={attempt+1}")
                              time.sleep(wait)
                              continue
                          break

                      model = str(data.get("model", "unknown"))

                      latency = round(time.time() - start, 2)

                      models[model] += 1

                      results.append({
                          "worker": i + 1,
                          "role": role,
                          "success": True,
                          "model": model,
                          "chars": len(text),
                          "latency_s": latency,
                          "attempt": attempt + 1
                      })

                      print(
                          f"CALL={i+1:02d}/20 "
                          f"RESULT=SUCCESS "
                          f"ROLE={role} "
                          f"MODEL={model} "
                          f"CHARS={len(text)} "
                          f"LATENCY={latency}s "
                          f"ATTEMPT={attempt+1}"
                      )

                      success = True
                      break

                  except urllib.error.HTTPError as error:

                      last_error = "HTTP_" + str(error.code)

                      if error.code == 429 and attempt < 2:
                          wait = RATE_LIMIT_DELAY * (attempt + 1)
                          print(
                              f"CALL={i+1:02d}/20 "
                              f"RETRY=YES "
                              f"HTTP_STATUS=429 "
                              f"WAIT={wait}s "
                              f"ATTEMPT={attempt+1}"
                          )

                          time.sleep(wait)
                          continue

                      break

                  except Exception as error:

                      last_error = (
                          type(error).__name__
                          + ":"
                          + str(error)[:120]
                      )

                      if attempt < 2:
                          wait = 8 * (attempt + 1)
                          print(f"CALL={i+1:02d}/20 RETRY=YES REASON={type(error).__name__} WAIT={wait}s ATTEMPT={attempt+1}")
                          time.sleep(wait)
                          continue

                      break

              if not success:

                  errors[last_error] += 1

                  results.append({
                      "worker": i + 1,
                      "role": role,
                      "success": False,
                      "error": last_error
                  })

                  print(
                      f"CALL={i+1:02d}/20 "
                      f"RESULT=FAIL "
                      f"ROLE={role} "
                      f"ERROR={last_error}"
                  )

              # File adaptative: réduit la pression sur le routeur gratuit.
              time.sleep(BASE_DELAY)

          successful = sum(
              1 for row in results
              if row["success"]
          )

          failed = TOTAL - successful

          print("")
          print("========================================")
          print("CEREBRON_20_CALL_ACCOUNTING")
          print("========================================")
          print("PLANNED=" + str(TOTAL))
          print("SUCCESSFUL=" + str(successful))
          print("FAILED=" + str(failed))
          print(
              "YIELD_PCT="
              + str(round(100 * successful / TOTAL, 2))
          )
          print(
              "MODELS="
              + json.dumps(dict(models), sort_keys=True)
          )
          print(
              "ERRORS="
              + json.dumps(dict(errors), sort_keys=True)
          )

          report = {
              "schema":
                  "cerebron-openrouter-adaptive-queue-20-v3",
              "planned": TOTAL,
              "successful_external_model_outputs":
                  successful,
              "failed": failed,
              "yield_pct":
                  round(100 * successful / TOTAL, 2),
              "models":
                  dict(models),
              "errors":
                  dict(errors),
              "results":
                  results
          }

          with open(
              "router-scientific-preflight-20.json",
              "w"
          ) as f:
              json.dump(report, f, indent=2)

          # Le workflow échoue seulement si aucun appel
          # externe n'a fonctionné.
          if successful == 0:
              print("RESULT=FAIL")
              raise SystemExit(1)

          print("RESULT=SUCCESS")
          print(
              "EXTERNAL_RESPONSES="
              + str(successful)
              + "/20"
          )

          PY

      - name: Upload accounting report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cerebron-openrouter-preflight-20
          path: router-scientific-preflight-20.json
          retention-days: 1
