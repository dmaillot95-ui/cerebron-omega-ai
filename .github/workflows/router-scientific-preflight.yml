name: CEREBRON Batch 8 + Retry Queue

'on':
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/router-scientific-preflight.yml"

permissions:
  contents: read

jobs:
  batch8:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Run eight probes with deferred retry queue
        shell: bash
        run: |
          cat > /tmp/batch8.py <<'PY'
          import os, json, time, urllib.request, urllib.error
          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          if not key:
              print("RESULT=FAIL")
              print("REASON=MISSING_SECRET")
              raise SystemExit(1)

          farms = [
              ("FARM21","ECONOMICS_FINANCE"),
              ("FARM22","BUSINESS_MARKET"),
              ("FARM23","LAW_REGULATION"),
              ("FARM24","PUBLIC_POLICY_ANALYSIS"),
              ("FARM25","GEOGRAPHY_INFRASTRUCTURE"),
              ("FARM26","CLIMATE_ENVIRONMENT"),
              ("FARM27","AGRICULTURE_FOOD"),
              ("FARM28","EDUCATION_KNOWLEDGE_TRANSFER"),
          ]
          results = []
          for n, (farm, role) in enumerate(farms, 1):
              prompt = (
                  "CEREBRON OMEGA probe. Farm: " + farm + ". Role: " + role + ". "
                  "Give a rigorous 4-7 sentence method for testing a scientific claim. "
                  "State assumptions, evidence required, one failure mode, and distinguish computation from proof."
              )
              body = json.dumps({
                  "model": "openrouter/free",
                  "messages": [{"role": "user", "content": prompt}],
                  "max_tokens": 300
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=body,
                  headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
                  method="POST"
              )
              ok = False
              error = ""
              for attempt in (1, 2):
                  try:
                      with urllib.request.urlopen(req, timeout=90) as response:
                          data = json.loads(response.read().decode("utf-8"))
                      choices = data.get("choices") or []
                      msg = choices[0].get("message", {}) if choices else {}
                      text = msg.get("content", "")
                      if isinstance(text, list):
                          text = "\n".join(x.get("text", "") for x in text if isinstance(x, dict))
                      text = text.strip() if isinstance(text, str) else ""
                      if len(text) < 120:
                          error = "EMPTY" if not text else "SHORT_" + str(len(text))
                          if attempt == 1:
                              time.sleep(4)
                              continue
                          break
                      model = str(data.get("model", "unknown"))
                      results.append({"farm": farm, "success": True, "model": model, "chars": len(text), "attempt": attempt})
                      print("CALL=%d/8 FARM=%s RESULT=SUCCESS MODEL=%s CHARS=%d ATTEMPT=%d" % (n, farm, model, len(text), attempt))
                      ok = True
                      break
                  except urllib.error.HTTPError as exc:
                      error = "HTTP_" + str(exc.code)
                      if exc.code == 429 and attempt == 1:
                          time.sleep(8)
                          continue
                      break
                  except Exception as exc:
                      error = type(exc).__name__ + ":" + str(exc)[:80]
                      if attempt == 1:
                          time.sleep(4)
                          continue
                      break
              if not ok:
                  results.append({"farm": farm, "success": False, "error": error})
                  print("CALL=%d/8 FARM=%s RESULT=FAIL ERROR=%s" % (n, farm, error))
              time.sleep(2)

          success = sum(1 for x in results if x["success"])
          failed = 8 - success
          errors = {}
          models = {}
          for x in results:
              if x["success"]:
                  models[x["model"]] = models.get(x["model"], 0) + 1
              else:
                  errors[x["error"]] = errors.get(x["error"], 0) + 1
          report = {"group": 2, "planned": 8, "successful": success, "failed": failed,
                    "yield_pct": success * 5.0, "models": models, "errors": errors, "results": results}
          with open("batch8-group2.json", "w") as fh:
              json.dump(report, fh, indent=2)
          print("PLANNED=8")
          print("SUCCESSFUL=" + str(success))
          print("FAILED=" + str(failed))
          print("YIELD_PCT=" + str(success * 12.5))
          print("MODELS=" + json.dumps(models, sort_keys=True))
          print("ERRORS=" + json.dumps(errors, sort_keys=True))
          print("EXTERNAL_RESPONSES=%d/8" % success)
          print("RESULT=" + ("SUCCESS" if success else "FAIL"))
          if success == 0:
              raise SystemExit(1)
          PY
          python /tmp/batch8.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch8-group2
          path: batch8-group2.json
          retention-days: 1
