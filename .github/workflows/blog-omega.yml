name: CEREBRON BLOG Omega
on:
  workflow_dispatch:
  push:
    paths:
      - 'config/blog-omega.json'
      - 'tools/blog_omega.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate BLOG Omega
        run: |
          python -m py_compile tools/blog_omega.py
          python - <<'PY'
          import json
          c=json.load(open('config/blog-omega.json'))
          assert c['integration']['forum']=='rapid_exchange'
          assert c['integration']['agora']=='comparison_and_debate'
          assert 'CLAIM<=EVIDENCE' in c['rules']
          print('BLOG_OMEGA_VALID')
          PY
