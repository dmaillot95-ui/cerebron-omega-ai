name: CEREBRON 5 Role-Diverse AI Canary
on:
  push:
    paths:
      - '.github/workflows/cerebron-5-role-diverse-ai-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: SAPHEA, prompt: "Solve practically. Give one concrete implementation and one risk."}
          - {id: SPIRALION, prompt: "Explore three distinct approaches, compare them, then select no winner; state what evidence would discriminate them."}
          - {id: ETHERION, prompt: "Act as an R&D specialist. State assumptions, model, falsification test, and next experiment."}
          - {id: AUDITOR, prompt: "Audit the claim. Identify unsupported assumptions, missing evidence, and verification steps."}
          - {id: REDTEAM, prompt: "Try to break the claim. Give a counterexample or failure mode and a decisive test."}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: pip install --quiet "transformers>=4.53,<5" accelerate safetensors sentencepiece
      - name: Role-diverse real inference
        env:
          ROLE: ${{ matrix.id }}
          ROLE_PROMPT: ${{ matrix.prompt }}
          MODEL_ID: HuggingFaceTB/SmolLM3-3B
          REVISION: a07cc9a04f16550a088caea529712d1d335b0ac1
        shell: python
        run: |
          import os,json,time,hashlib,pathlib
          problem="A new reasoning system gets 90 percent accuracy on 100 internal tests. Is that enough evidence to scale it from 5 workers to 20?"
          prompt=os.environ["ROLE_PROMPT"]+"\nProblem: "+problem+"\nBe concise."
          r={"role":os.environ["ROLE"],"problem":problem,"prompt_sha256":hashlib.sha256(prompt.encode()).hexdigest(),"model_id":os.environ["MODEL_ID"],"revision":os.environ["REVISION"],"real_execution":True,"llm_inference":False}
          t=time.time()
          try:
              import torch
              from transformers import AutoTokenizer,AutoModelForCausalLM
              tok=AutoTokenizer.from_pretrained(os.environ["MODEL_ID"],revision=os.environ["REVISION"])
              model=AutoModelForCausalLM.from_pretrained(os.environ["MODEL_ID"],revision=os.environ["REVISION"],torch_dtype=torch.float32,low_cpu_mem_usage=True)
              x=tok(prompt,return_tensors="pt")
              with torch.no_grad(): y=model.generate(**x,max_new_tokens=120,do_sample=False)
              out=tok.decode(y[0][x["input_ids"].shape[1]:],skip_special_tokens=True)
              r.update(llm_inference=True,inference="PASS",output=out[:1200],output_sha256=hashlib.sha256(out.encode()).hexdigest())
          except Exception as e:
              r.update(inference="FAIL",failure_class=type(e).__name__,failure_message=str(e)[:500])
          r["latency_s"]=round(time.time()-t,3)
          r["receipt_sha256"]=hashlib.sha256(json.dumps(r,sort_keys=True).encode()).hexdigest()
          p=pathlib.Path("artifacts")/os.environ["ROLE"]; p.mkdir(parents=True,exist_ok=True)
          (p/"receipt.json").write_text(json.dumps(r,indent=2)+"\n")
          print(json.dumps({k:r.get(k) for k in ["role","llm_inference","inference","output_sha256","latency_s","receipt_sha256"]}))
          if not r["llm_inference"]: raise SystemExit(2)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-receipt-${{ matrix.id }}
          path: artifacts/${{ matrix.id }}/receipt.json
