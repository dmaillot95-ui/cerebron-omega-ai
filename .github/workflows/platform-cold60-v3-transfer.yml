name: CEREBRON Cold 60 V3 Transfer Red Team
on:
  push:
    branches: ['feat/cerebron-cold60-redteam-v3']
    paths:
      - 'platform/cold60_v3_transfer.py'
      - '.github/workflows/platform-cold60-v3-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CEREBRON_ENABLE_LOCAL_GENERATIVE: '1'
      CEREBRON_TRANSFER_SEED: ${{ github.run_id }}
      PYTHONPATH: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==5.17.0
      - name: Execute transfer Red Team
        run: python platform/cold60_v3_transfer.py
      - name: Verify sealed transfer artifacts
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("platform/artifacts")
          d=json.loads((root/"cold60-v3-transfer-dataset.json").read_text())
          r=json.loads((root/"cold60-v3-transfer-result.json").read_text())
          assert d["deny_training"] is True
          assert len(d["tasks"])==60
          assert r["baseline"]["max_score"]==60 and r["adaptive"]["max_score"]==60
          assert len(r["result_sha256"])==64
          print("COLD60_V3_TRANSFER",r["baseline"]["score"],r["adaptive"]["score"],r["adaptive"]["tool_handled_count"],r["transfer_gap_from_v2"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-cold60-v3-transfer-redteam
          path: |
            platform/artifacts/cold60-v3-transfer-dataset.json
            platform/artifacts/cold60-v3-transfer-result.json
