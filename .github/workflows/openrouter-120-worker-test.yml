name: OpenRouter 120 Fixed Worker Responses Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/openrouter-120-worker-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - shell: bash
        run: |
          python - <<'PY'
          import os,json,time,urllib.request,urllib.error,collections
          roles=["REALITY_RESEARCH","SYSTEM_ARCHITECT","CALCULATION","SIMULATION","CAUSAL_ANALYSIS","INVENTION","FAILURE_ANALYSIS","COUNTEREXAMPLE_HUNTER","FALSIFIER","FORMAL_AUDITOR","INDEPENDENT_REPLICATOR","UNCERTAINTY_ANALYST","INTERFACE_ANALYST","INVARIANT_HUNTER","EXPERIMENT_DESIGN","CONTRADICTION_RESOLUTION","UNKNOWN_GAP_ANALYST","EVIDENCE_AUDITOR","SYNTHESIS_ANALYST","OMEGA_JUDGE"]
          key=os.environ.get('OPENROUTER_API_KEY','')
          rows=[]; total=120
          # 6 rounds x 20 stable worker identities = 120 controlled external calls.
          for n in range(total):
            i=n%20; rnd=n//20+1; role=roles[i]
            row={'call':n+1,'round':rnd,'worker':f'W{i+1:02d}','role':role,'success':False}
            body=json.dumps({'model':'openrouter/free','messages':[{'role':'user','content':f'CEREBRON controlled scale test round {rnd}. Worker W{i+1:02d} role {role}. Reply in one short line beginning CEREBRON_OK.'}],'max_tokens':32}).encode()
            req=urllib.request.Request('https://openrouter.ai/api/v1/chat/completions',data=body,headers={'Authorization':'Bearer '+key,'Content-Type':'application/json','HTTP-Referer':'https://github.com/dmaillot95-ui/cerebron-omega-ai','X-Title':'CEREBRON Omega'})
            t=time.time()
            try:
              with urllib.request.urlopen(req,timeout=90) as r: data=json.loads(r.read().decode())
              txt=((data.get('choices') or [{}])[0].get('message') or {}).get('content','')
              row.update(success=bool(str(txt).strip()),response_nonempty=bool(str(txt).strip()),provider_model=data.get('model'),latency_s=round(time.time()-t,3),preview=str(txt)[:100])
            except urllib.error.HTTPError as e:
              row.update(error='HTTP_'+str(e.code),error_body=e.read().decode(errors='replace')[:180],latency_s=round(time.time()-t,3))
            except Exception as e: row.update(error=type(e).__name__+': '+str(e)[:160],latency_s=round(time.time()-t,3))
            rows.append(row); print(json.dumps(row),flush=True)
            time.sleep(1)
          ok=sum(r['success'] for r in rows)
          models=collections.Counter(r.get('provider_model','') for r in rows if r.get('success'))
          errors=collections.Counter(r.get('error','') for r in rows if not r.get('success'))
          out={'schema':'cerebron-openrouter-120-v1','planned':total,'workers_per_round':20,'rounds':6,'successful_external_model_outputs':ok,'failed':total-ok,'yield_pct':round(100*ok/total,2),'models':dict(models),'errors':dict(errors),'workers':rows}
          print('ACCOUNTING '+json.dumps({k:v for k,v in out.items() if k!='workers'}),flush=True)
          open('openrouter-120.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openrouter-120
          path: openrouter-120.json
          retention-days: 1
