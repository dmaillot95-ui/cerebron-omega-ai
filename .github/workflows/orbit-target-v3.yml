name: ASTRION Orbit Target V3
on:
  workflow_dispatch:
  push:
    paths:
      - "simulations/orbit_target_v3.py"
      - ".github/workflows/orbit-target-v3.yml"
permissions:
  contents: read
jobs:
  target:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python simulations/orbit_target_v3.py
      - name: METRION target gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/orbit_target_v3.json"));r=d["results"]
          assert r["earth_rotation_credit_m_s"]>0
          assert r["target_circular_speed_m_s"]>0
          assert r["minimum_due_east_inclination_deg"]==d["config"]["latitude_deg"]
          assert r["idealized_dv_margin_m_s"]>0
          assert r["target_budget_eligible"] is True
          assert "NOT_ORBIT_INSERTION_PROOF" in d["epistemic"]
          print("ORBIT_TARGET_V3_VERIFIED",r["earth_rotation_credit_m_s"],r["idealized_dv_margin_m_s"],d["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astrion-orbit-target-v3
          path: artifacts/orbit_target_v3.json
          if-no-files-found: error
          retention-days: 7
