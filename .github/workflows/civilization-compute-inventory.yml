name: Civilization Compute Inventory
on:
  push:
    paths:
      - 'config/civilization-compute-inventory-trigger.json'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Observe real runner resources
        run: |
          python - <<'PY'
          import json,os,platform,shutil,subprocess
          from pathlib import Path
          def cmd(x):
              try:return subprocess.check_output(x,shell=True,text=True,stderr=subprocess.STDOUT).strip()
              except Exception as e:return "UNAVAILABLE"
          cpu=os.cpu_count()
          mem_kb=0
          try:
              for l in open('/proc/meminfo'):
                  if l.startswith('MemTotal:'): mem_kb=int(l.split()[1]);break
          except: pass
          nvidia_bin=shutil.which("nvidia-smi")
          rocm_bin=shutil.which("rocminfo")
          gpu_nvidia=cmd(f"{nvidia_bin} --query-gpu=name,memory.total --format=csv,noheader") if nvidia_bin else "UNAVAILABLE"
          gpu_rocm=cmd(f"{rocm_bin} | head -40") if rocm_bin else "UNAVAILABLE"
          nvidia_ok=bool(nvidia_bin and gpu_nvidia and gpu_nvidia!="UNAVAILABLE")
          rocm_ok=bool(rocm_bin and gpu_rocm and gpu_rocm!="UNAVAILABLE")
          r={"schema":"cerebron-compute-inventory-receipt-v2","status":"OBSERVED","runner":{"os":platform.platform(),"cpu_logical":cpu,"memory_gib":round(mem_kb/1024/1024,2),"disk_free_gib":round(shutil.disk_usage('.').free/1024**3,2)},"accelerators":{"nvidia":{"binary_present":bool(nvidia_bin),"available":nvidia_ok,"detail":gpu_nvidia},"rocm":{"binary_present":bool(rocm_bin),"available":rocm_ok,"detail":gpu_rocm}},"capability":{"cpu_worker":bool(cpu),"gpu_worker":nvidia_ok or rocm_ok},"claim_limit":"Observed resources on this GitHub-hosted runner only; GPU availability requires a present accelerator tool and successful hardware query."}
          Path("receipts/civilization").mkdir(parents=True,exist_ok=True)
          Path("receipts/civilization/compute-inventory.json").write_text(json.dumps(r,indent=2)+"\n")
          PY
      - name: Persist receipt
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/civilization/compute-inventory.json
          git diff --cached --quiet && exit 0
          git commit -m "Record civilization compute inventory"
          git pull --rebase origin main
          git push
