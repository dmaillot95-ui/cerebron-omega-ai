name: Civilization Crystal Baseline Guard
on:
  push:
    branches: [main]
    paths:
      - 'checkpoints/CEREBRON_80_M01_CRYSTAL_BASELINE.json'
      - 'config/farms.json'
      - 'config/ai-8-agent-topology-v1.json'
      - 'config/crystal-preservation-v1.json'
      - 'config/private-memory-route.json'
      - 'config/memory-fabric-v1.json'
      - 'tools/validate_crystal_baseline.py'
      - '.github/workflows/civilization-crystal-baseline-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_crystal_baseline.py
