name: CEREBRON Synthesis Kernel Validate
on:
  push:
    paths: ['config/synthesis-kernel.json','tools/synthesis_kernel.py','.github/workflows/synthesis-kernel.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/synthesis_kernel.py
