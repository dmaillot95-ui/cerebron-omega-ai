name: CEREBRON Micro Impulse Validate
on:
  push:
    paths: ['config/micro-impulse.json','tools/micro_impulse.py','.github/workflows/micro-impulse.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/micro_impulse.py
