name: AGORA F139 Gold Promotion V3
on:
  push:
    paths:
      - 'runtime/agora_gold_promotion_f139_v3.py'
      - '.github/workflows/agora-gold-promotion-f139-v3.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  afah-gold-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download original AGORA lesson
        uses: actions/download-artifact@v4
        with:
          name: agora-memory-learning-e2e-v1
          path: prior-v1
          run-id: 35874397482
          github-token: ${{ github.token }}
      - name: Download cross-run transfer proof
        uses: actions/download-artifact@v4
        with:
          name: agora-crossrun-retrieval-v2
          path: prior-v2
          run-id: 35877276452
          github-token: ${{ github.token }}
      - name: AFAH scoped GOLD gate
        run: >-
          python runtime/agora_gold_promotion_f139_v3.py
          --capsule prior-v1/artifacts/agora_capsule.json
          --transfer prior-v2/agora_crossrun_retrieval_v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: agora-f139-gold-promotion-v3
          path: artifacts/agora_gold_promotion_f139_v3.json
