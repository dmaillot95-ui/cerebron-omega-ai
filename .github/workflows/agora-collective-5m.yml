name: AGORA Collective Recursive Bus
# bootstrap-repair-trigger-v3
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/agora-collective-5m.yml'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: agora-collective-recursive-bus
  cancel-in-progress: false
jobs:
  collective-state:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap CÉRÉBRON civilization manual
        shell: bash
        run: |
          test -s CEREBRON_CIVILIZATION_OPERATING_MANUAL.md
          python - <<'PY'
          import hashlib,json,os
          p="CEREBRON_CIVILIZATION_OPERATING_MANUAL.md"
          b=open(p,"rb").read()
          t=b.decode("utf-8")\nif "CÉRÉBRON" not in t or "AFAH" not in t or "CRISTAL" not in t or "AGORA" not in t:
              raise SystemExit("CIVILIZATION_MANUAL_INVALID")
          os.makedirs(".agora-collective",exist_ok=True)
          json.dump({
            "manual":p,
            "sha256":hashlib.sha256(b).hexdigest(),
            "loaded":True,
            "role_contract":"MANDATORY_FOR_RELAY",
            "authority":"AFAH",
            "architecture_integrity":"CRISTAL"
          },open(".agora-collective/manual-bootstrap.json","w"),indent=2)
          PY
          cat .agora-collective/manual-bootstrap.json
      - name: Ingest durable farm packets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .agora-collective/ingress
          python - <<'PY'
          import json,urllib.request,os
          owner="dmaillot95-ui"
          repos={19:"cerebron-farm-19-cybersecurity",59:"cerebron-farm-59-verified-learning",66:"cerebron-farm-66-knowledge-graph-vector-index",67:"cerebron-farm-67-cross-farm-communication",68:"cerebron-farm-68-autonomous-experiment-orchestrator",70:"cerebron-farm-70-theorem-proof-engineering",71:"cerebron-farm-71-scientific-reproduction",72:"cerebron-farm-72-reality-evidence-gate",74:"cerebron-farm-74-session-memory-encyclopedia"}
          status={}
          for fid,r in repos.items():
              url=f"https://raw.githubusercontent.com/{owner}/{r}/main/agora/state.json"
              try:
                  req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ.get("GH_TOKEN","")})
                  data=json.loads(urllib.request.urlopen(req,timeout=10).read())
                  json.dump(data,open(f".agora-collective/ingress/{fid}.json","w"),indent=2)
                  status[str(fid)]="INGESTED"
              except Exception as e:
                  status[str(fid)]="UNAVAILABLE"
          json.dump(status,open(".agora-collective/ingress-status.json","w"),indent=2)
          PY
      - name: Compile gated collective state
        shell: bash
        run: |
          python - <<'PY'
          import json,glob,os
          packets=[]
          for p in glob.glob(".agora-collective/ingress/*.json"):
              try: packets.append(json.load(open(p)))
              except: pass
          gates={"cyber_vigie":"PENDING","reproduction":"PENDING","reality":"PENDING","ablation":"PENDING","transfer":"PENDING"}
          for x in packets:
              if x.get("resource","").endswith("19-cybersecurity"): gates["cyber_vigie"]=x.get("guardian_status",x.get("decision","PENDING"))
              if x.get("resource","").endswith("71-scientific-reproduction"): gates["reproduction"]=x.get("reproduction","PENDING")
              if x.get("resource","").endswith("72-reality-evidence-gate"): gates["reality"]=x.get("reality_gate","PENDING")
              if x.get("resource","").endswith("59-verified-learning"):
                  gates["ablation"]=x.get("ablation","PENDING"); gates["transfer"]=x.get("transfer","PENDING")
          scientific_ok=all(gates[k]=="PASS" for k in ["reproduction","reality","ablation","transfer"])
          cyber_ok=gates["cyber_vigie"] in ("PASS","NORMAL")
          eligible=scientific_ok and cyber_ok
          quarantine = gates["cyber_vigie"] not in ("PASS","NORMAL","PENDING")
          manual=json.load(open(".agora-collective/manual-bootstrap.json"))
          state={"schema":"CEREBRON_AGORA_COLLECTIVE_V2","civilization_manual":manual,"state_id":"COLLECTIVE:"+os.environ["GITHUB_RUN_ID"],"packets_ingested":len(packets),"ingress_status":json.load(open(".agora-collective/ingress-status.json")),"gates":gates,"security_state":"QUARANTINE" if quarantine else ("NORMAL" if cyber_ok else "HOLD"),"promotion":"ELIGIBLE" if eligible else "BLOCKED","memory_write":"ELIGIBLE" if eligible else "BLOCKED","rollback":"REQUIRED" if quarantine else "NOT_REQUIRED","mentor_egress":"READY_FOR_REVIEW","nextlock":"ROLLBACK_TO_LAST_VALIDATED" if quarantine else ("EXECUTE_REAL_GATE_WORK" if not eligible else "PROMOTE_AUDITED_LESSON"),"rules":["CLAIM<=EVIDENCE","CONSENSUS!=PROOF","IMPORTED_EVIDENCE!=INDEPENDENT_REPRODUCTION"]}
          json.dump(state,open(".agora-collective/state.json","w"),indent=2)
          PY
          cat .agora-collective/state.json
      - uses: actions/upload-artifact@v4
        with:
          name: agora-collective-state-${{ github.run_id }}
          path: .agora-collective/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
