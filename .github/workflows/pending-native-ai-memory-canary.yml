name: CEREBRON Pending Native AI Memory Canary
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'config/memory-promotion-policy-v1.json'
      - 'config/cerebron-civilization-memory-bindings-v1.json'
      - 'scripts/audit_memory_promotion.py'
      - '.github/workflows/pending-native-ai-memory-canary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_memory_promotion.py

  namespace-canary:
    needs: policy-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet --upgrade huggingface_hub
      - name: Verify pending native AI M7 namespaces
        run: |
          mkdir -p receipts/civilization
          python - <<'PY'
          import os,json,hashlib,tempfile,datetime
          from pathlib import Path
          from huggingface_hub import HfApi,hf_hub_download

          token=os.environ.get("HF_TOKEN","")
          if not token: raise SystemExit("HF_TOKEN_MISSING")
          repo=os.environ["HF_REPO"]
          api=HfApi(token=token)
          info=api.repo_info(repo_id=repo,repo_type="model")
          if not getattr(info,"private",False): raise SystemExit("HF_REPO_NOT_PRIVATE")

          pending=[
            ("SAELION",147),("ALPHA",148),("OMEGA",149),("DELTA",150),("NEXUS",151)
          ]
          rows=[]
          for ai,fid in pending:
              payload={
                "schema":"CEREBRON_PENDING_NATIVE_AI_NAMESPACE_CANARY_V1",
                "ai_id":ai,"farm_id":fid,"memory_class":"M7",
                "activation_effect":"NONE",
                "content":"synthetic namespace canary; no training data",
                "created_at":datetime.datetime.now(datetime.timezone.utc).isoformat()
              }
              raw=(json.dumps(payload,sort_keys=True,separators=(",",":"))+"\n").encode()
              sha=hashlib.sha256(raw).hexdigest()
              with tempfile.NamedTemporaryFile("wb",delete=False) as t:
                  t.write(raw); src=t.name
              path=f"native-ai/{ai}/M7/NAMESPACE-CANARY-V1.json"
              api.upload_file(path_or_fileobj=src,path_in_repo=path,repo_id=repo,repo_type="model",commit_message=f"{ai} pending M7 namespace canary")
              dst=hf_hub_download(repo_id=repo,filename=path,repo_type="model",token=token,force_download=True)
              got=Path(dst).read_bytes()
              got_sha=hashlib.sha256(got).hexdigest()
              if got_sha!=sha: raise SystemExit(f"{ai}_SHA_MISMATCH")
              rows.append({"ai_id":ai,"farm_id":fid,"namespace":f"native-ai/{ai}","object_path":path,"sha256":sha,"write_read_sha":"PASS","activation_effect":"NONE"})
          receipt={
            "schema":"CEREBRON_PENDING_NATIVE_AI_MEMORY_CANARY_RECEIPT_V1",
            "status":"PASS","repo":repo,"private":True,
            "rows":rows,"count":len(rows),
            "claim_scope":"Storage route and M7 namespace only; no model runtime, training, or activation."
          }
          Path("receipts/civilization/pending-native-ai-memory-canary.json").write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pending-native-ai-memory-canary
          path: receipts/civilization/pending-native-ai-memory-canary.json
          if-no-files-found: error
