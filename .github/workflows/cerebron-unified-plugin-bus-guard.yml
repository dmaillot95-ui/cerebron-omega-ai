name: CEREBRON Unified Plugin Bus Guard

on:
  push:
    branches: [main]
    paths:
      - 'config/cerebron-unified-plugin-bus-v1.json'
      - 'config/farms.json'
      - 'tools/validate_unified_plugin_bus_v1.py'
      - '.github/workflows/cerebron-unified-plugin-bus-guard.yml'
  pull_request:
    paths:
      - 'config/cerebron-unified-plugin-bus-v1.json'
      - 'config/farms.json'
      - 'tools/validate_unified_plugin_bus_v1.py'
      - '.github/workflows/cerebron-unified-plugin-bus-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_unified_plugin_bus_v1.py
