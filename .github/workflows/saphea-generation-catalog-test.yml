name: SAPHEA Generation Catalog Test
on:
  push:
    paths:
      - '.github/workflows/saphea-generation-catalog-test.yml'
      - 'config/saphea-generation-catalog-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - run: python -m pip install --quiet --upgrade huggingface_hub
      - name: Verify M1 private object and public pointer schema
        run: |
          python - <<'PY'
          import os,json,hashlib
          from huggingface_hub import hf_hub_download
          repo="cerebron-omega/cerebron-private-memory"
          agent="SIGMA-FORMALIZER"; gen="M1"
          path=f"colony/C01-SIGMA/agents/{agent}/memory/{gen}/checkpoint.json"
          fn=hf_hub_download(repo_id=repo,filename=path,repo_type="model",token=os.environ["HF_TOKEN"],force_download=True)
          raw=open(fn,"rb").read(); obj=json.loads(raw); sha=hashlib.sha256(raw).hexdigest()
          assert obj["agent_id"]==agent and obj["generation"]==gen
          pointer={"memory_id":"C01-SIGMA-SIGMA-FORMALIZER-M1","colony_id":"C01-SIGMA","agent_id":agent,"generation":gen,"parent_generation":"M0","memory_class":"checkpoint","hf_private_object_path":path,"sha256":sha,"validation_status":"TEST_FIXTURE_VERIFIED","rollback_generation":"M0"}
          forbidden={"private_payload","raw_prompt","secret","token","raw_chat_history"}
          assert not forbidden.intersection(pointer)
          print("HF_M1_READ=PASS")
          print("M1_IDENTITY=PASS")
          print("M1_SHA256=PASS")
          print("F74_POINTER_SCHEMA=PASS")
          print("PUBLIC_PRIVATE_PAYLOAD=NO")
          PY
