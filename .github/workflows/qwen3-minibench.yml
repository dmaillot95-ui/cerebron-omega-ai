name: CEREBRON Qwen3 MiniBench
on:
  push:
    branches: [main]
    paths: ['tasks/dispatch/qwen3-minibench-v1.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_VERBOSITY: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check --no-cache-dir "torch>=2.4,<3" "transformers>=4.51,<5" "safetensors>=0.4,<1"
      - name: Execute bounded benchmark
        run: |
          mkdir -p artifacts/qwen3_minibench
          /usr/bin/time -v -o artifacts/qwen3_minibench/resources.txt python benchmarks/qwen3_minibench.py > artifacts/qwen3_minibench/result.json
          sha256sum artifacts/qwen3_minibench/* > artifacts/qwen3_minibench/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: qwen3-06b-minibench
          path: artifacts/qwen3_minibench/
          retention-days: 3
