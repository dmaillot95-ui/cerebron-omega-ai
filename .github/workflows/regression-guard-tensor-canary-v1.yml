name: Regression Guard Tensor Canary V1
"on":
  push:
    paths:
      - ".github/workflows/regression-guard-tensor-canary-v1.yml"
  workflow_dispatch: {}
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip -q install "transformers>=4.56" torch accelerate sentencepiece
      - name: One real inference with explicit tensors
        run: |
          python - <<'PY'
          import json,torch
          from transformers import AutoTokenizer,AutoModelForCausalLM
          mid="HuggingFaceTB/SmolLM3-3B"
          tok=AutoTokenizer.from_pretrained(mid)
          mdl=AutoModelForCausalLM.from_pretrained(mid,dtype=torch.float32)
          msgs=[{"role":"system","content":"Answer concisely."},{"role":"user","content":"State whether finite verification alone proves a universal mathematical claim."}]
          enc=tok.apply_chat_template(msgs,tokenize=True,add_generation_prompt=True,enable_thinking=False,return_dict=True,return_tensors="pt")
          input_ids=enc["input_ids"]
          attention_mask=enc.get("attention_mask")
          kw={"input_ids":input_ids,"max_new_tokens":96,"do_sample":False,"pad_token_id":tok.eos_token_id}
          if attention_mask is not None: kw["attention_mask"]=attention_mask
          with torch.no_grad(): out=mdl.generate(**kw)
          text=tok.decode(out[0][input_ids.shape[-1]:],skip_special_tokens=True).strip()
          assert text, "EMPTY_OUTPUT"
          print(json.dumps({"CANARY":"PASS","input_shape":list(input_ids.shape),"output_chars":len(text)}))
          PY
