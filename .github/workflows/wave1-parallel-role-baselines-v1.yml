name: CEREBRON Wave1 Parallel Role Baselines
on:
  push:
    branches: ['feat/wave1-parallel-ai-baselines-v1']
    paths:
      - 'config/wave1-parallel-baseline-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  baseline:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        role: [AELYS, ETHERION, AFAH, METRION]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tools/wave1_parallel_role_baseline.py
      - name: Cache Qwen 0.5B
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen25-05b-ec7ddfa904d4d447eedd0b7f126df16957734abb
      - name: Install inference stack
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==5.17.0 accelerate safetensors sentencepiece
      - name: Execute real cold baseline
        run: |
          python tools/wave1_parallel_role_baseline.py             --role "${{ matrix.role }}"             --run-id "${{ github.run_id }}"             --output "receipts/wave1/${{ matrix.role }}-baseline-${{ github.run_id }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wave1-${{ matrix.role }}-baseline
          path: receipts/wave1/${{ matrix.role }}-baseline-${{ github.run_id }}.json
          if-no-files-found: error

  audit:
    needs: baseline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wave1-*-baseline
          path: downloaded/wave1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fuse readiness without inventing training
        run: |
          mkdir -p receipts/wave1
          python - <<'PY'
          import glob,json,os,pathlib,hashlib
          files=sorted(glob.glob("downloaded/wave1/**/**/*.json",recursive=True))
          rows=[]
          for p in files:
              d=json.loads(pathlib.Path(p).read_text())
              if d.get("schema")=="CEREBRON_WAVE1_ROLE_BASELINE_RECEIPT_V1":
                  rows.append(d)
          by={r["role"]:r for r in rows}
          expected=["AELYS","ETHERION","AFAH","METRION"]
          assert sorted(by)==sorted(expected), sorted(by)
          assert all(r["real_inference"] is True for r in rows)
          assert all(r["training_executed"] is False for r in rows)
          assert all(r["benchmark_deny_training"] is True for r in rows)
          lineages={r["lineage_fingerprint"] for r in rows}
          out={
            "schema":"CEREBRON_WAVE1_PARALLEL_BASELINE_AUDIT_V1",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "roles":expected,
            "receipt_count":len(rows),
            "real_inference_count":sum(r["real_inference"] for r in rows),
            "training_executed_count":sum(r["training_executed"] for r in rows),
            "unique_lineage_fingerprints":len(lineages),
            "independent_evidence_count":0,
            "scores":{r["role"]:{
              "score":r["score"],
              "max":r["task_count"],
              "accuracy":r["accuracy"],
              "training_readiness":r["training_readiness"],
              "benchmark_sha256":r["benchmark_sha256"],
            } for r in rows},
            "next_gate":{
              "AELYS":"BUILD_AND_VALIDATE_ROLE_GOLD",
              "ETHERION":"ADMIT_VALIDATED_RECORDS_TO_EMPTY_SIX_AI_MANIFEST",
              "AFAH":"ADMIT_VALIDATED_RECORDS_TO_EMPTY_SIX_AI_MANIFEST",
              "METRION":"BUILD_AND_VALIDATE_ENGINEERING_GOLD",
            },
            "claim_ceiling":"FOUR_REAL_PARALLEL_BASELINES_ONLY_NO_TRAINING_CLAIM",
          }
          raw=json.dumps(out,sort_keys=True,separators=(",",":")).encode()
          out["audit_sha256"]=hashlib.sha256(raw).hexdigest()
          p=pathlib.Path("receipts/wave1")/f"wave1-parallel-baseline-audit-{os.environ['GITHUB_RUN_ID']}.json"
          p.write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave1-parallel-baseline-audit-${{ github.run_id }}
          path: receipts/wave1/wave1-parallel-baseline-audit-${{ github.run_id }}.json
      - name: Persist audit receipt only
        if: success()
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/wave1/wave1-parallel-baseline-audit-${{ github.run_id }}.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: wave1 parallel role baselines ${{ github.run_id }}"
          git pull --rebase origin feat/wave1-parallel-ai-baselines-v1
          git push
