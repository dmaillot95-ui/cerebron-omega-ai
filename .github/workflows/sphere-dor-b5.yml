name: CEREBRON Sphere dOr Operator Funnel B5
on:
  push:
    paths: ['research/sphere_dor_b5_operators.py','.github/workflows/sphere-dor-b5.yml']
  workflow_dispatch:
jobs:
  operator-funnel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python research/sphere_dor_b5_operators.py
      - uses: actions/upload-artifact@v4
        with: {name: sphere-dor-b5-operators, path: artifacts/sphere-dor-b5.json}
