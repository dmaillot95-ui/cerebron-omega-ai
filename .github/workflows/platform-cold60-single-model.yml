
name: CEREBRON Cold 60 Single Model Baseline
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'platform/cold60_single_model.py'
      - '.github/workflows/platform-cold60-single-model.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CEREBRON_ENABLE_LOCAL_GENERATIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==5.17.0
      - name: Run sealed M6 single-model baseline
        run: python platform/cold60_single_model.py
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-cold60-single-model-v1
          path: platform/artifacts/cold60-single-model-v1.json
