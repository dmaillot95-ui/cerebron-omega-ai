name: CEREBRON Wave2 Dataset Package Release
on:
  push:
    branches: ['feat/wave2-parallel-ai-baselines-v1']
    paths:
      - 'config/wave2-dataset-package-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Wave2 package chain
        run: |
          python -m py_compile tools/wave2_quarantine_candidate_builder.py
          python -m py_compile tools/wave2_versioned_split_builder_v1.py
          python -m py_compile tools/wave2_cold_suite_builder_v1.py
          python -m py_compile tools/wave2_dataset_release_gate_v1.py
      - name: Require local AFAH Wave2 admission pointer
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("training/WAVE2_DATA_ADMISSION_V1.json")
          assert p.exists(),"WAVE2_AFAH_ADMISSION_POINTER_MISSING"
          d=json.loads(p.read_text())
          assert d["state"]=="ADMITTED_SYNTHETIC_CANDIDATE_POOL"
          assert d["record_count"]==456
          assert d["training_released"] is False
          print("WAVE2_AFAH_ADMISSION_POINTER=PASS",d["manifest_sha256"])
          PY
      - name: Regenerate exact admitted pool
        run: |
          python tools/wave2_quarantine_candidate_builder.py             --output artifacts/wave2-quarantine-candidates-v1.json
      - name: Build deterministic TRAIN VALIDATION candidates
        run: |
          python tools/wave2_versioned_split_builder_v1.py             --candidates artifacts/wave2-quarantine-candidates-v1.json             --admission training/WAVE2_DATA_ADMISSION_V1.json             --output-dir artifacts/wave2-splits
      - name: Build fresh M6 TRANSFER RED suites
        run: |
          python tools/wave2_cold_suite_builder_v1.py             --output-dir artifacts/wave2-cold
      - name: Execute leakage and release gate
        run: |
          python tools/wave2_dataset_release_gate_v1.py             --candidates artifacts/wave2-quarantine-candidates-v1.json             --split-dir artifacts/wave2-splits             --cold-dir artifacts/wave2-cold             --admission training/WAVE2_DATA_ADMISSION_V1.json             --baseline-config config/wave2-parallel-role-baseline-v1.json             --output training/WAVE2_PARALLEL_TRAINING_RELEASE_V1.json
      - name: Verify Wave2 scoped training release
        run: |
          mkdir -p receipts/wave2
          python - <<'PY'
          import hashlib,json,os,pathlib
          d=json.loads(pathlib.Path("training/WAVE2_PARALLEL_TRAINING_RELEASE_V1.json").read_text())
          assert d["state"]=="RELEASED_FOR_SCOPED_LORA_TRAINING"
          assert d["training_released"] is True
          assert all(d["checks"].values())
          assert d["checks"]["cold_total_380"] is True
          receipt={
            "schema":"CEREBRON_WAVE2_DATASET_PACKAGE_RELEASE_POINTER_V1",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "release_sha256":d["release_sha256"],
            "source_manifest_sha256":d["source_manifest_sha256"],
            "training_released":True,
            "roles":{k:{
              "train_count":v["train_count"],"validation_count":v["validation_count"],
              "split_sha256":v["split_sha256"],"cold":v["cold"],"model":v["model"]
            } for k,v in d["roles"].items()},
            "claim_ceiling":d["claim_ceiling"],
            "next_gate":"FOUR_PARALLEL_REAL_LORA_CANARIES"
          }
          receipt["receipt_sha256"]=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          p=pathlib.Path("receipts/wave2")/f"wave2-dataset-package-release-{os.environ['GITHUB_RUN_ID']}.json"
          p.write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-dataset-package-${{ github.run_id }}
          path: |
            artifacts/wave2-splits/
            artifacts/wave2-cold/
            training/WAVE2_PARALLEL_TRAINING_RELEASE_V1.json
            receipts/wave2/wave2-dataset-package-release-${{ github.run_id }}.json
          if-no-files-found: error
      - name: Persist Wave2 release pointer only
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add training/WAVE2_PARALLEL_TRAINING_RELEASE_V1.json
          git add receipts/wave2/wave2-dataset-package-release-${{ github.run_id }}.json
          git diff --cached --quiet && exit 0
          git commit -m "release: Wave2 scoped parallel training package ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin feat/wave2-parallel-ai-baselines-v1 && git push && exit 0
            sleep 5
          done
          exit 1
