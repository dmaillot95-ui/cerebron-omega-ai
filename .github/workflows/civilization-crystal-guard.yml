name: Civilization Crystal Guard
on:
  push:
    branches: [main]
    paths:
      - 'config/ai-8-agent-topology-v1.json'
      - 'config/crystal-preservation-v1.json'
      - 'config/private-memory-route.json'
      - 'config/memory-fabric-v1.json'
      - 'config/greek-24-colony-master.json'
      - 'docs/CEREBRON_80_MESSAGE_CAMPAIGN_V1.md'
      - 'tools/validate_civilization_crystal.py'
      - '.github/workflows/civilization-crystal-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_civilization_crystal.py
