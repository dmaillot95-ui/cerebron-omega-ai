name: AFAH Wave2 Model Final Policy Review V1
on:
  push:
    branches: [main]
    paths:
      - 'config/afah-wave2-model-final-review-request.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile AFAH Wave2 final policy
        run: python -m py_compile tools/afah_wave2_model_final_policy_v1.py
      - name: Run AFAH Wave2 final policy
        run: python tools/afah_wave2_model_final_policy_v1.py
      - name: Verify research-only decision
        run: |
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path("receipts/wave2/afah-wave2-model-final-review-v1.json").read_text())
          assert d["authority"]=="AFAH_POLICY_GATE"
          assert d["candidate_adapters_used_for_final_review"] is False
          assert d["all_requested_candidates_pass"] is True
          assert d["runtime_activation"] is False
          assert d["g7_promoted"] is False
          assert all(v["decision"]=="G6_VERIFIED_RESEARCH_ONLY" for v in d["results"].values())
          print("AFAH_WAVE2_FINAL_POLICY=PASS",d["review_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: afah-wave2-model-final-policy-${{ github.run_id }}
          path: |
            receipts/wave2/afah-wave2-model-final-review-v1.json
            config/wave2-research-adapters/
          if-no-files-found: error
      - name: Persist research-only pointers
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/wave2/afah-wave2-model-final-review-v1.json config/wave2-research-adapters/
          git diff --cached --quiet && exit 0
          git commit -m "receipt: AFAH Wave2 G6 research-only review ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
