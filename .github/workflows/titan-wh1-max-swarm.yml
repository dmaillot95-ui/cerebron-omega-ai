name: TITAN WH1 Maximum Auditable Swarm
on:
  workflow_dispatch:
  push:
    paths:
      - 'benchmarks/titan-wh1-max-swarm-001.json'
      - '.github/workflows/titan-wh1-max-swarm.yml'

permissions:
  contents: read

concurrency:
  group: titan-wh1-max-ai-swarm
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p=json.load(open('benchmarks/titan-wh1-max-swarm-001.json'))
          farms=p['farm_coalition']
          inc=[{'id':i} for i in farms]
          print('matrix='+json.dumps({'include':inc},separators=(',',':')))
          PY

  farm-ai:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet hf-gradio
      - name: Execute maximum external-model yield
        env:
          FARM_ID: ${{ matrix.id }}
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import os,json,subprocess,pathlib,importlib.util,time,hashlib
          from concurrent.futures import ThreadPoolExecutor,as_completed
          p=json.load(open('benchmarks/titan-wh1-max-swarm-001.json'))
          fid=int(os.environ['FARM_ID'])
          registry=json.load(open('config/farms.json'))['farms']
          f=next(x for x in registry if int(x['id'])==fid)
          repo=f['repo']; domain=f['domain']
          roles=['SYSTEM_ARCHITECT','CRYOGENIC_ANALYST','FEED_SYSTEM_ANALYST','SLOSH_ANALYST','POGO_ANALYST','STRUCTURAL_DYNAMICS','GNC_ANALYST','THERMAL_ANALYST','MULTIPHYSICS_ANALYST','FAILURE_ANALYST','CAUSAL_ANALYST','COUNTEREXAMPLE_HUNTER','FALSIFIER','FORMAL_AUDITOR','INDEPENDENT_REPLICATOR','UNCERTAINTY_ANALYST','INTERFACE_ANALYST','INVARIANT_HUNTER','SYNTHESIS_ANALYST','OMEGA_JUDGE']
          candidate_spaces=['huggingface-projects/llama-3.2-3B-Instruct','huggingface-projects/gemma-2-9b-it','huggingface-projects/llama-2-7b-chat','huggingface-projects/llama-2-13b-chat','lmz/candle-llama2','mkmenta/gpt-1-and-gpt-2']
          QUOTA_MARKERS=('ZeroGPU quota','quota','rate limit','429')
          result={'schema':'titan-wh1-max-ai-v2','farm_id':fid,'repo':repo,'domain':domain,'planned_roles':len(roles),'successful_roles':0,'provider_attempts':0,'outputs':[]}
          cp=subprocess.run(['git','clone','--depth','1',f'https://github.com/dmaillot95-ui/{repo}.git','farm'],capture_output=True,text=True,timeout=120)
          wp=pathlib.Path('farm/worker/farm_worker.py')
          if cp.returncode!=0 or not wp.exists():
            result['error']='clone_or_worker_missing'
            pathlib.Path('out/result.json').write_text(json.dumps(result,indent=2)); raise SystemExit(0)
          spec=importlib.util.spec_from_file_location(f'fw_{fid}',wp); fw=importlib.util.module_from_spec(spec); spec.loader.exec_module(fw)
          # Health-router runs only after result and farm worker exist.
          probe_prompt='Reply exactly HEALTH_OK.'
          health=[]
          for space in candidate_spaces:
            try:
              t=time.time(); ok,txt,meta=fw.invoke(space,probe_prompt)
              health.append({'space':space,'ok':bool(ok and str(txt).strip()),'latency':round(time.time()-t,3),'meta':meta})
            except Exception as e:
              health.append({'space':space,'ok':False,'error':repr(e)})
          ranked_health=sorted(health,key=lambda x:(not x['ok'],x.get('latency',9999)))
          live_spaces=[h['space'] for h in ranked_health if h['ok']]
          spaces=live_spaces+[s for s in candidate_spaces if s not in live_spaces]
          result['provider_health']=health
          result['live_spaces']=live_spaces
          result['provider_route']=spaces
          result['degraded_spaces']=[h['space'] for h in health if not h['ok']]
          result['routing_policy']='CEREBRON_INTERCHANGE_NETWORK_V6'
          result['provider_failures']={}
          blocked_spaces=set()
          route_stats={s:{'attempts':0,'success':0,'quota_blocked':0,'errors':{}} for s in candidate_spaces}
          result['provider_api_schema']={}
          result['exchange_highway']={'enabled':True,'rounds':2,'handoffs':0,'verified_handoffs':0}
          result['interchange_network']={'enabled':True,'switches':0,'bypasses':0,'routes_tried':0,'route_success':{}}
          def ranked_routes(routes):
            return sorted(routes,key=lambda s:(s in blocked_spaces,-route_stats[s]['success'],route_stats[s]['attempts']))
          def bypass(space):
            bypass(space)
            result['interchange_network']['bypasses']+=1
          unknowns=', '.join(p.get('required_unknowns',[]))
          def one(i):
            role=roles[i]
            prompt=(f'CEREBRON OMEGA — TITAN WH1 MAXIMUM AUDITABLE AI SWARM\nFARM {fid} {domain}\nROLE {role}\n'
                    'Analyze the coupled S1 cryogenic tank/feed/slosh-pogo/structure/GNC engineering problem. '
                    f'Physical unknowns that MUST remain explicit: {unknowns}. '
                    'Do not invent missing dimensions or test data. REALITY>COHERENCE; EVIDENCE>CONFIDENCE; CLAIM<=EVIDENCE; '
                    'SIMULATION!=TEST; WORKFLOW_SUCCESS!=SCIENTIFIC_PROGRESS. '
                    'Return ESTABLISHED / DERIVED / CONTRADICTIONS / FAILURE_MODES / UNKNOWNS / NEXT_TEST / SYNTHESIS.')
            attempts=[]
            for space in ranked_routes(spaces):
              result['interchange_network']['routes_tried']+=1
              if space in blocked_spaces:
                continue
              try:
                route_stats[space]['attempts']+=1
                exchange_context=''
                prompt=base_prompt + exchange_context
                ok,text,meta=fw.invoke(space,prompt)
                err=str((meta or {}).get('error',''))
                m=meta or {}
                schema_hint='UNKNOWN'
                low=err.lower()
                if 'zerogpu' in low: schema_hint='ZEROGPU_QUOTA'
                elif 'api_name' in low or 'endpoint' in low: schema_hint='ENDPOINT_SCHEMA_MISMATCH'
                elif 'gradio' in low or 'client' in low: schema_hint='GRADIO_CLIENT_ERROR'
                elif 'timeout' in low: schema_hint='TIMEOUT'
                elif '429' in low or 'rate limit' in low: schema_hint='RATE_LIMIT'
                elif ok and str(text).strip(): schema_hint='GENERATION_OK'
                result['provider_api_schema'][space]=schema_hint
                if err:
                  route_stats[space]['errors'][schema_hint]=route_stats[space]['errors'].get(schema_hint,0)+1
                quota_block=any(m.lower() in err.lower() for m in QUOTA_MARKERS)
                attempts.append({'space':space,'ok':bool(ok),'quota_block':quota_block,'meta':meta})
                if quota_block:
                  result['provider_failures'][space]='QUOTA_BLOCKED'
                  route_stats[space]['quota_blocked']+=1
                  blocked_spaces.add(space)
                if ok and str(text).strip():
                  route_stats[space]['success']+=1
                  result['interchange_network']['route_success'][space]=result['interchange_network']['route_success'].get(space,0)+1
                  first=str(text).strip()
                  # Round 2: hand the first model output to another productive route for critique.
                  for peer in ranked_routes(spaces):
                    if peer==space or peer in blocked_spaces: continue
                    result['interchange_network']['switches']+=1
                    critique_prompt=("CEREBRON INTER-AI HIGHWAY. Independently audit the following candidate. "
                      "Identify errors, contradictions, missing evidence, and return a corrected synthesis. "
                      "Do not treat the candidate as evidence.\nCANDIDATE:\n"+first[:12000])
                    try:
                      result['exchange_highway']['handoffs']+=1
                      ok2,text2,meta2=fw.invoke(peer,critique_prompt)
                      if ok2 and str(text2).strip():
                        result['exchange_highway']['verified_handoffs']+=1
                        first += "\n\n--- INTER_AI_AUDIT ---\n"+str(text2).strip()
                        break
                    except Exception:
                      pass
                  return {'index':i+1,'role':role,'success':True,'space':space,'sha256':hashlib.sha256(str(text).encode()).hexdigest(),'provider_attempts':len(attempts),'response':str(text),'attempts':attempts}
              except Exception as e: attempts.append({'space':space,'ok':False,'error':repr(e)})
            return {'index':i+1,'role':role,'success':False,'provider_attempts':len(attempts),'attempts':attempts}
          t0=time.time()
          with ThreadPoolExecutor(max_workers=1) as ex:
            futs=[ex.submit(one,i) for i in range(len(roles))]
            for fut in as_completed(futs):
              row=fut.result(); result['provider_attempts']+=row['provider_attempts']; result['successful_roles']+=int(row['success']); result['outputs'].append(row)
          result['outputs'].sort(key=lambda x:x['index'])
          result['route_stats']=route_stats
          result['blocked_spaces']=sorted(blocked_spaces)
          result['live_provider_count']=len(live_spaces)
          result['elapsed_seconds']=round(time.time()-t0,3)
          pathlib.Path('out/result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'farm_id':fid,'successful_ai_outputs':result['successful_roles'],'provider_attempts':result['provider_attempts']}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: titan-ai-farm-${{ matrix.id }}
          path: out/result.json
          retention-days: 14

  accounting:
    needs: farm-ai
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: titan-ai-farm-*
          path: results
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in Path('results').rglob('result.json'):
            try: rows.append(json.loads(p.read_text()))
            except: pass
          success=sum(r.get('successful_roles',0) for r in rows)
          attempts=sum(r.get('provider_attempts',0) for r in rows)
          summary={'schema':'titan-wh1-max-ai-accounting-v2','farms_received':len(rows),'planned_farms':23,'logical_ai_roles':23*20,'successful_external_model_outputs':success,'provider_attempts':attempts,'farms_with_ai_output':sum(r.get('successful_roles',0)>0 for r in rows),'farms_with_live_provider':sum(r.get('live_provider_count',0)>0 for r in rows),'live_provider_observations':sum(r.get('live_provider_count',0) for r in rows),'claim_note':'Counts only non-empty external model responses. JOB!=AI; response!=evidence; workflow success!=engineering validation.'}
          Path('titan-ai-accounting.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: titan-ai-accounting
          path: titan-ai-accounting.json
          retention-days: 14
