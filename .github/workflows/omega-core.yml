name: CEREBRON Omega Core

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate registry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/farms.json')
          d=json.loads(p.read_text())
          farms=d['farms']
          ids=[f['id'] for f in farms]
          assert ids, 'farm registry is empty'
          assert ids==list(range(1, len(farms)+1)), ids
          assert len({f['repo'] for f in farms})==len(farms), 'duplicate farm repositories'
          assert len(set(ids))==len(ids), 'duplicate farm ids'
          print('REGISTRY_OK', len(farms))
          PY
      - name: Test router
        run: |
          python core/router.py "AI agent platform routing and audit" | tee omega-route.json
      - uses: actions/upload-artifact@v4
        with:
          name: omega-core-route
          path: omega-route.json
