name: ELYSIUM D4 True Dual-Core Fusion Canary
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'config/elysium-d4-fusion-canary-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fusion_canary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
      MODEL_A: Qwen/Qwen3-4B
      REV_A: 1cfa9a7208912126459214e8b04321603b3df60c
      MODEL_B: HuggingFaceTB/SmolLM3-3B
      REV_B: a07cc9a04f16550a088caea529712d1d335b0ac1
      HF_HOME: /tmp/hf-model
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: |
          python -m pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir "transformers>=4.53,<5" accelerate safetensors sentencepiece huggingface_hub
      - name: Execute preregistered dual-core canary
        run: |
          mkdir -p receipts/elysium
          python - <<'PY'
          import gc,hashlib,json,os,pathlib,re,resource,tempfile,time,torch
          from huggingface_hub import HfApi,hf_hub_download
          from transformers import AutoTokenizer,AutoModelForCausalLM

          # Require closed D3 + positive complementarity precheck.
          comp_path=pathlib.Path("receipts/elysium/elysium-d3-baseline-comparison.json")
          pre_path=pathlib.Path("receipts/elysium/elysium-d4-complementarity.json")
          m6r_path=pathlib.Path("receipts/elysium/elysium-m6-release-v1.json")
          if not (comp_path.exists() and pre_path.exists() and m6r_path.exists()): raise SystemExit("PREREQUISITE_RECEIPTS_MISSING")
          comp=json.loads(comp_path.read_text()); pre=json.loads(pre_path.read_text()); m6r=json.loads(m6r_path.read_text())
          if comp.get("status")!="PASS": raise SystemExit("D3_NOT_PASS")
          if pre.get("decision")!="CONTINUE_D4_FUSION_CANARY": raise SystemExit("D4_PRECHECK_NOT_CONTINUE")
          if comp["m6_sha256"]!=m6r["dataset_sha256"] or pre["m6_sha256"]!=m6r["dataset_sha256"]: raise SystemExit("M6_SHA_MISMATCH")
          if m6r["deny_training"] is not True or m6r["training_eligible"] is not False: raise SystemExit("M6_DENY_FAIL")

          fn=pathlib.Path(hf_hub_download(repo_id=os.environ["HF_REPO"],filename=m6r["private_path"],repo_type="model",token=os.environ["HF_TOKEN"],force_download=True))
          raw=fn.read_bytes()
          if hashlib.sha256(raw).hexdigest()!=m6r["dataset_sha256"]: raise SystemExit("M6_PRIVATE_SHA_MISMATCH")
          tasks=json.loads(raw)["tasks"]

          # Preregistered deterministic subset independent of answers/results.
          selected=sorted(tasks,key=lambda t:hashlib.sha256((str(t["id"])+"|ELYSIUM-D4-V1").encode()).hexdigest())[:24]
          subset_ids=[str(t["id"]) for t in selected]
          subset_sha=hashlib.sha256(json.dumps(subset_ids,separators=(",",":")).encode()).hexdigest()

          # D3-selected global fallback is part of this preregistered policy.
          best_models=comp["best_single_models"]
          if len(best_models)!=1:
              fallback_model=min(best_models)
          else:
              fallback_model=best_models[0]
          if fallback_model not in {os.environ["MODEL_A"],os.environ["MODEL_B"]}: raise SystemExit("FALLBACK_NOT_IN_PAIR")

          def norm(s):
              m=re.search(r"\b(PASS|FAIL|INSUFFICIENT)\b",s.upper())
              return m.group(1) if m else ""

          def load(mid,rev):
              tok=AutoTokenizer.from_pretrained(mid,revision=rev)
              if tok.pad_token_id is None: tok.pad_token_id=tok.eos_token_id
              model=AutoModelForCausalLM.from_pretrained(mid,revision=rev,torch_dtype=torch.bfloat16,low_cpu_mem_usage=True)
              model.eval(); return tok,model

          def render(tok,system,user):
              msgs=[{"role":"system","content":system},{"role":"user","content":user}]
              try: return tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True,enable_thinking=False)
              except TypeError: return tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True)

          def infer(tok,model,system,user,n=8):
              p=render(tok,system,user); x=tok(p,return_tensors="pt")
              with torch.inference_mode():
                  y=model.generate(**x,max_new_tokens=n,do_sample=False,pad_token_id=tok.pad_token_id,eos_token_id=tok.eos_token_id)
              return tok.decode(y[0][x["input_ids"].shape[-1]:],skip_special_tokens=True).strip()

          details={str(t["id"]):{"id":str(t["id"]),"domain":t["domain"],"prompt":t["prompt"],"expected":t["expected"]} for t in selected}
          t0=time.time()

          tok,model=load(os.environ["MODEL_A"],os.environ["REV_A"])
          for i,t in enumerate(selected,1):
              out=infer(tok,model,"You are ELYSIUM Core A verifier. Follow the requested output format exactly. /no_think",t["prompt"])
              d=details[str(t["id"])]; d["a_raw"]=out; d["a"]=norm(out)
              if i%6==0: print(f"A_PROGRESS {i}/24",flush=True)
          del model,tok; gc.collect()

          tok,model=load(os.environ["MODEL_B"],os.environ["REV_B"])
          for i,t in enumerate(selected,1):
              d=details[str(t["id"])]
              out=infer(tok,model,"You are ELYSIUM Core B adversarial verifier. Follow the requested output format exactly. /no_think",t["prompt"])
              d["b_raw"]=out; d["b"]=norm(out)
              if d["a"]!=d["b"]:
                  v=infer(tok,model,
                    "You are Core B adjudicating two candidate labels without an answer key. Return exactly SELF or PEER. Prefer the label better supported by the question evidence; do not use confidence alone. /no_think",
                    f"Question: {t['prompt']}\nSELF={d['b']}\nPEER={d['a']}",6).upper()
                  d["b_verdict"]="SELF" if re.search(r"\bSELF\b",v) else "PEER" if re.search(r"\bPEER\b",v) else "UNRESOLVED"
              else: d["b_verdict"]="CONSENSUS"
              if i%6==0: print(f"B_PROGRESS {i}/24",flush=True)
          del model,tok; gc.collect()

          tok,model=load(os.environ["MODEL_A"],os.environ["REV_A"])
          for i,t in enumerate(selected,1):
              d=details[str(t["id"])]
              if d["a"]!=d["b"]:
                  v=infer(tok,model,
                    "You are Core A adjudicating two candidate labels without an answer key. Return exactly SELF or PEER. Prefer the label better supported by the question evidence; do not use confidence alone. /no_think",
                    f"Question: {t['prompt']}\nSELF={d['a']}\nPEER={d['b']}",6).upper()
                  d["a_verdict"]="SELF" if re.search(r"\bSELF\b",v) else "PEER" if re.search(r"\bPEER\b",v) else "UNRESOLVED"
              else: d["a_verdict"]="CONSENSUS"
              if i%6==0: print(f"A_CRITIQUE_PROGRESS {i}/24",flush=True)
          del model,tok; gc.collect()

          a_correct=b_correct=f_correct=0
          changed_from_fallback=0; changed_help=0; changed_harm=0
          consensus=converged=fallback_count=0
          public=[]
          for t in selected:
              d=details[str(t["id"])]; exp=d["expected"]
              a_correct+=int(d["a"]==exp); b_correct+=int(d["b"]==exp)
              fallback=d["a"] if fallback_model==os.environ["MODEL_A"] else d["b"]
              if d["a"]==d["b"]:
                  fusion=d["a"]; reason="CONSENSUS"; consensus+=1
              else:
                  ac=d["a"] if d["a_verdict"]=="SELF" else d["b"] if d["a_verdict"]=="PEER" else ""
                  bc=d["b"] if d["b_verdict"]=="SELF" else d["a"] if d["b_verdict"]=="PEER" else ""
                  if ac and ac==bc:
                      fusion=ac; reason="RECIPROCAL_CRITIQUE_CONVERGENCE"; converged+=1
                  else:
                      fusion=fallback; reason="D3_BEST_SINGLE_FALLBACK"; fallback_count+=1
              if fusion!=fallback:
                  changed_from_fallback+=1
                  changed_help+=int(fusion==exp and fallback!=exp)
                  changed_harm+=int(fusion!=exp and fallback==exp)
              d["fallback"]=fallback; d["fusion"]=fusion; d["fusion_reason"]=reason
              f_correct+=int(fusion==exp)
              public.append({
                "id_sha256":hashlib.sha256(d["id"].encode()).hexdigest(),
                "a_sha256":hashlib.sha256(d["a"].encode()).hexdigest(),
                "b_sha256":hashlib.sha256(d["b"].encode()).hexdigest(),
                "fusion_sha256":hashlib.sha256(fusion.encode()).hexdigest(),
                "reason":reason,"fusion_correct":fusion==exp
              })

          best_subset=max(a_correct,b_correct)
          gain=f_correct-best_subset
          # Strict preregistered gate: fusion must beat best single on same subset,
          # or tie it while improving at least two fallback decisions with zero harmed fallback-correct decisions.
          if gain>0:
              decision="D4_CANARY_PASS_ACCURACY_GAIN"
          elif gain==0 and changed_help>=2 and changed_harm==0:
              decision="D4_CANARY_PASS_NONINFERIOR_HELPFUL_ARBITRATION"
          else:
              decision="D4_CANARY_HOLD_NO_MEASURED_GAIN"

          private={
            "schema":"ELYSIUM_D4_TRUE_DUAL_CORE_FUSION_CANARY_PRIVATE_V1",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),"farm_id":146,"ai_id":"ELYSIUM",
            "m6_sha256":m6r["dataset_sha256"],"m6_deny_training":True,"weights_changed":False,
            "selection_rule":"SHA256(task_id|ELYSIUM-D4-V1)_ASC_FIRST_24","subset_sha256":subset_sha,
            "model_a":{"id":os.environ["MODEL_A"],"revision":os.environ["REV_A"]},
            "model_b":{"id":os.environ["MODEL_B"],"revision":os.environ["REV_B"]},
            "fallback_model":fallback_model,
            "fusion_policy":"CONSENSUS_ELSE_RECIPROCAL_CRITIQUE_CONVERGENCE_ELSE_D3_BEST_SINGLE_FALLBACK",
            "pass_rule":"GAIN_GT_0_OR_GAIN_EQ_0_AND_HELP_GE_2_AND_HARM_EQ_0",
            "metrics":{"task_count":24,"a_correct":a_correct,"b_correct":b_correct,"best_single_subset_correct":best_subset,
              "fusion_correct":f_correct,"fusion_gain_over_best_single_subset":gain,
              "consensus_count":consensus,"reciprocal_converged_count":converged,"fallback_count":fallback_count,
              "changed_from_fallback":changed_from_fallback,"changed_help":changed_help,"changed_harm":changed_harm},
            "decision":decision,"independent_evidence_count":0,"two_models_not_two_independent_proofs":True,
            "claim_ceiling":"SCOPED_ELYSIUM_D4_DUAL_CORE_FUSION_CANARY_NO_RUNTIME_ACTIVATION",
            "details":details
          }
          praw=(json.dumps(private,indent=2,ensure_ascii=False)+"\n").encode(); psha=hashlib.sha256(praw).hexdigest()
          with tempfile.NamedTemporaryFile("wb",delete=False) as tf: tf.write(praw); src=tf.name
          private_path=f"elysium/D4-fusion-canary/run-{os.environ['GITHUB_RUN_ID']}/private.json"
          api=HfApi(token=os.environ["HF_TOKEN"])
          api.upload_file(path_or_fileobj=src,path_in_repo=private_path,repo_id=os.environ["HF_REPO"],repo_type="model",commit_message=f"ELYSIUM D4 fusion canary {os.environ['GITHUB_RUN_ID']}")
          dst=pathlib.Path(hf_hub_download(repo_id=os.environ["HF_REPO"],filename=private_path,repo_type="model",token=os.environ["HF_TOKEN"],force_download=True))
          if hashlib.sha256(dst.read_bytes()).hexdigest()!=psha: raise SystemExit("PRIVATE_READBACK_SHA_FAIL")
          summary={
            "schema":"ELYSIUM_D4_TRUE_DUAL_CORE_FUSION_CANARY_PUBLIC_V1",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),"farm_id":146,"ai_id":"ELYSIUM",
            "source_d3_run_id":comp["run_id"],"source_d3_audit_sha256":comp["audit_sha256"],
            "source_d4_precheck_receipt_sha256":pre["receipt_sha256"],
            "m6_sha256":m6r["dataset_sha256"],"m6_deny_training":True,"weights_changed":False,
            "selection_rule":private["selection_rule"],"subset_sha256":subset_sha,
            "model_a":private["model_a"],"model_b":private["model_b"],"fallback_model":fallback_model,
            "fusion_policy":private["fusion_policy"],"pass_rule":private["pass_rule"],"metrics":private["metrics"],
            "decision":decision,"private_result_path":private_path,"private_result_sha256":psha,
            "hf_private_readback_sha_pass":True,"independent_evidence_count":0,
            "two_models_not_two_independent_proofs":True,"claim_ceiling":private["claim_ceiling"],
            "public_rows_fingerprint_sha256":hashlib.sha256(json.dumps(public,sort_keys=True,separators=(",",":")).encode()).hexdigest(),
            "max_rss_kb":resource.getrusage(resource.RUSAGE_SELF).ru_maxrss,"elapsed_s":round(time.time()-t0,3)
          }
          summary["receipt_sha256"]=hashlib.sha256(json.dumps(summary,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          pathlib.Path("receipts/elysium/elysium-d4-true-dual-core-fusion-canary.json").write_text(json.dumps(summary,indent=2)+"\n")
          print("D4_SUMMARY "+json.dumps(summary,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: elysium-d4-true-dual-core-fusion-canary
          path: receipts/elysium/elysium-d4-true-dual-core-fusion-canary.json
          if-no-files-found: error
      - name: Persist D4 fusion receipt
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/elysium/elysium-d4-true-dual-core-fusion-canary.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: ELYSIUM D4 fusion canary ${{ github.run_id }}"
          git pull --rebase origin feat/cerebron-ai-platform-mvp
          git push
