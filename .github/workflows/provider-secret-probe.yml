name: Provider Secret Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/provider-secret-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - shell: bash
        run: |
          python - <<'PY'
          import os,json
          names=['CEREBRAS_API_KEY','GROQ_API_KEY','OPENROUTER_API_KEY','HF_TOKEN','HUGGINGFACE_TOKEN','CLOUDFLARE_API_TOKEN']
          # Never print secret values.
          out={n:('PRESENT' if bool(os.environ.get(n,'')) else 'ABSENT') for n in names}
          print(json.dumps(out,indent=2))
          open('provider-secret-probe.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: provider-secret-probe
          path: provider-secret-probe.json
          retention-days: 1
