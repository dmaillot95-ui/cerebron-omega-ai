name: CEREBRON Transfer Promotion Lesson

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/validate_transfer_promotion_lesson.py'
      - 'memory/failure-bank-v1.json'
      - '.github/workflows/transfer-promotion-lesson.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate transfer promotion lesson
        run: |
          python -m py_compile tools/validate_transfer_promotion_lesson.py
          python tools/validate_transfer_promotion_lesson.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-promotion-lesson-validation
          path: artifacts/transfer-promotion-lesson-validation.json
          if-no-files-found: error
          retention-days: 30
