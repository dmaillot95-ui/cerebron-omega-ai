name: SPIRALIX Universal Bus Guard
on:
  push:
    branches: [main]
    paths:
      - 'config/spiralix-universal-bus-v1.json'
      - 'config/glyph-vector.json'
      - 'config/spiralix-agora.json'
      - 'config/spiralix-forum.json'
      - 'config/burst20-controller-v1.json'
      - 'config/agora-burst20-bridge-v1.json'
      - 'config/real-worker-receipt-schema-v1.json'
      - 'tools/spiralix_bus.py'
      - 'tools/validate_spiralix_universal_bus.py'
      - '.github/workflows/spiralix-universal-bus-guard.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/validate_spiralix_universal_bus.py
      - run: python tools/spiralix_bus.py --self-test-all --output receipts/spiralix/universal-bus-canary.json
      - name: Persist non-sensitive canary receipt
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/spiralix/universal-bus-canary.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: SPIRALIX universal bus 304-endpoint canary"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
