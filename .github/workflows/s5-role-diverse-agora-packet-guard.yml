name: S5 Role Diverse AGORA Packet Guard
on:
  push:
    branches: [main]
    paths:
      - 'agora/packets/s5-role-diverse-*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_s5_role_diverse_agora_packet.py
