name: Neural Training Fabric Bootstrap V1
on:
  push:
    paths:
      - 'runtime/neural_training_bootstrap_v1.py'
      - '.github/workflows/neural-training-bootstrap-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build role training readiness manifest
        run: python runtime/neural_training_bootstrap_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: neural-training-bootstrap-v1
          path: artifacts/neural_training_bootstrap_v1.json
