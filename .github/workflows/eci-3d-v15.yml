name: ASTRION METRION ECI 3D V15
on:
  workflow_dispatch:
  push:
    paths:
      - "simulations/eci_3d_v15.py"
      - ".github/workflows/eci-3d-v15.yml"
permissions:
  contents: read
jobs:
  eci3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python simulations/eci_3d_v15.py
      - name: METRION 3D invariant gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/eci_3d_v15.json"))
          assert d["pass"] is True and all(d["criteria"].values())
          assert abs(d["initial_elements"]["inclination_deg"]-28.5)<1e-10
          assert d["reality_gap"]=="G02_DYNAMICS_FIDELITY_PARTIAL"
          assert "EARTH_ROTATION_REPORTED_NOT_PROPAGATED_IN_REFERENCE_ORBIT" in d["epistemic"]
          print("ECI_3D_V15",d["initial_elements"],d["final_elements"],d["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eci-3d-v15
          path: artifacts/eci_3d_v15.json
          if-no-files-found: error
          retention-days: 14
