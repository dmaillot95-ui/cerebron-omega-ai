name: ELYSIUM D4 Fusion Repair DEV V2
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'config/elysium-d4-fusion-repair-dev-v2-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair_dev:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MODEL_A: Qwen/Qwen3-4B
      REV_A: 1cfa9a7208912126459214e8b04321603b3df60c
      MODEL_B: HuggingFaceTB/SmolLM3-3B
      REV_B: a07cc9a04f16550a088caea529712d1d335b0ac1
      HF_HOME: /tmp/hf-model
      TRANSFORMERS_NO_ADVISORY_WARNINGS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: |
          python -m pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir "transformers>=4.53,<5" accelerate safetensors sentencepiece huggingface_hub
      - name: Evaluate candidate fusion policies on DEV only
        run: |
          mkdir -p receipts/elysium/d4
          python - <<'PY'
          import gc,hashlib,json,os,random,re,resource,time
          from collections import defaultdict
          from pathlib import Path
          import torch
          from transformers import AutoTokenizer,AutoModelForCausalLM

          rng=random.Random(14620260925)
          tasks=[]
          def add(domain,prompt,expected):
              tasks.append({"id":f"DEV-{len(tasks)+1:03d}","domain":domain,"prompt":prompt,"expected":expected})

          # DEV only. Public/reproducible by design; never cold evidence.
          for _ in range(6):
              a=rng.randint(10,90); b=rng.randint(3,70); mode=rng.randrange(3)
              if mode==0: add("claim_verification",f"Claim: {a}+{b}={a+b}. Return only PASS, FAIL, or INSUFFICIENT.","PASS")
              elif mode==1: add("claim_verification",f"Claim: {a}+{b}={a+b+rng.randint(1,5)}. Return only PASS, FAIL, or INSUFFICIENT.","FAIL")
              else:
                  n=rng.randint(12,70)
                  add("claim_verification",f"A universal claim is supported only by checking cases 1 through {n}. Return only PASS, FAIL, or INSUFFICIENT.","INSUFFICIENT")

          for _ in range(6):
              x=rng.randint(5,60); mode=rng.randrange(3)
              if mode==0: add("error_detection",f"Derivation: x={x}; 2x={2*x}; 2x+3={2*x+3}. Return only PASS, FAIL, or INSUFFICIENT.","PASS")
              elif mode==1: add("error_detection",f"Derivation: x={x}; 2x={2*x}; then 2x+3={2*x+4}. Return only PASS, FAIL, or INSUFFICIENT.","FAIL")
              else: add("error_detection","A final numeric result is given but all inputs and intermediate steps are missing. Return only PASS, FAIL, or INSUFFICIENT.","INSUFFICIENT")

          for _ in range(6):
              seed=rng.randint(1000,9999); x=rng.randint(3,14); y=x*x+2; mode=rng.randrange(3)
              if mode==0: add("reproduction",f"Reference code=v3 seed={seed} input={x} output={y}. Reproduction uses identical code, seed, input and output. Return only PASS, FAIL, or INSUFFICIENT.","PASS")
              elif mode==1: add("reproduction",f"Reference code=v3 seed={seed} input={x} output={y}. Reproduction reports output={y+rng.randint(1,4)}. Return only PASS, FAIL, or INSUFFICIENT.","FAIL")
              else: add("reproduction",f"Reference output={y}. Reproduction omits code revision and seed. Return only PASS, FAIL, or INSUFFICIENT.","INSUFFICIENT")

          for _ in range(6):
              n=rng.randint(25,150); mode=rng.randrange(3)
              if mode==0: add("robustness",f"A method passes {n} internal cases and a frozen transfer set with no critical regression. Claim is limited to these tests. Return only PASS, FAIL, or INSUFFICIENT.","PASS")
              elif mode==1: add("robustness",f"A method passes {n} internal cases but fails the frozen transfer set; the claim says it generalizes to transfer. Return only PASS, FAIL, or INSUFFICIENT.","FAIL")
              else: add("robustness",f"A method passes {n} internal cases only; broad transfer reliability is claimed. Return only PASS, FAIL, or INSUFFICIENT.","INSUFFICIENT")

          assert len(tasks)==24

          def norm(s):
              m=re.search(r"\b(PASS|FAIL|INSUFFICIENT)\b",s.upper())
              return m.group(1) if m else ""

          def load(mid,rev):
              tok=AutoTokenizer.from_pretrained(mid,revision=rev)
              if tok.pad_token_id is None: tok.pad_token_id=tok.eos_token_id
              model=AutoModelForCausalLM.from_pretrained(mid,revision=rev,torch_dtype=torch.bfloat16,low_cpu_mem_usage=True)
              model.eval(); return tok,model

          def render(tok,system,user):
              msgs=[{"role":"system","content":system},{"role":"user","content":user}]
              try: return tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True,enable_thinking=False)
              except TypeError: return tok.apply_chat_template(msgs,tokenize=False,add_generation_prompt=True)

          def infer(tok,model,system,user,n=8):
              p=render(tok,system,user); x=tok(p,return_tensors="pt")
              with torch.inference_mode():
                  y=model.generate(**x,max_new_tokens=n,do_sample=False,pad_token_id=tok.pad_token_id,eos_token_id=tok.eos_token_id)
              return tok.decode(y[0][x["input_ids"].shape[-1]:],skip_special_tokens=True).strip()

          rows={t["id"]:{**t} for t in tasks}
          t0=time.time()

          tok,model=load(os.environ["MODEL_A"],os.environ["REV_A"])
          for i,t in enumerate(tasks,1):
              r=rows[t["id"]]
              r["qwen"]=norm(infer(tok,model,"Return only PASS, FAIL, or INSUFFICIENT. /no_think",t["prompt"],6))
              if i%6==0: print(f"QWEN_BASE {i}/24",flush=True)
          del model,tok; gc.collect()

          tok,model=load(os.environ["MODEL_B"],os.environ["REV_B"])
          for i,t in enumerate(tasks,1):
              r=rows[t["id"]]
              r["smol"]=norm(infer(tok,model,"Return only PASS, FAIL, or INSUFFICIENT. /no_think",t["prompt"],6))
              if r["qwen"]!=r["smol"]:
                  v=infer(tok,model,
                    "Compare the two candidate verdicts using only the question. Return exactly QWEN, SMOL, or UNSURE. /no_think",
                    f"Question: {t['prompt']}\nQWEN={r['qwen']}\nSMOL={r['smol']}",8).upper()
                  r["smol_judge"]="QWEN" if re.search(r"\bQWEN\b",v) else "SMOL" if re.search(r"\bSMOL\b",v) else "UNSURE"
              else: r["smol_judge"]="AGREE"
              if i%6==0: print(f"SMOL_BASE_JUDGE {i}/24",flush=True)
          del model,tok; gc.collect()

          tok,model=load(os.environ["MODEL_A"],os.environ["REV_A"])
          for i,t in enumerate(tasks,1):
              r=rows[t["id"]]
              if r["qwen"]!=r["smol"]:
                  v=infer(tok,model,
                    "Compare the two candidate verdicts using only the question. Return exactly QWEN, SMOL, or UNSURE. /no_think",
                    f"Question: {t['prompt']}\nQWEN={r['qwen']}\nSMOL={r['smol']}",8).upper()
                  r["qwen_judge"]="QWEN" if re.search(r"\bQWEN\b",v) else "SMOL" if re.search(r"\bSMOL\b",v) else "UNSURE"
              else: r["qwen_judge"]="AGREE"
              if i%6==0: print(f"QWEN_JUDGE {i}/24",flush=True)
          del model,tok; gc.collect()

          def choose(policy,r):
              if r["qwen"]==r["smol"]: return r["qwen"]
              qj=r["qwen_judge"]; sj=r["smol_judge"]
              if policy=="QWEN_PRIMARY":
                  return r["smol"] if qj=="SMOL" and sj=="SMOL" else r["qwen"]
              if policy=="SMOL_PRIMARY":
                  return r["qwen"] if qj=="QWEN" and sj=="QWEN" else r["smol"]
              if policy=="RECIPROCAL_ELSE_QWEN":
                  if qj==sj=="SMOL": return r["smol"]
                  if qj==sj=="QWEN": return r["qwen"]
                  return r["qwen"]
              if policy=="RECIPROCAL_ELSE_SMOL":
                  if qj==sj=="SMOL": return r["smol"]
                  if qj==sj=="QWEN": return r["qwen"]
                  return r["smol"]
              raise ValueError(policy)

          policies=["QWEN_PRIMARY","SMOL_PRIMARY","RECIPROCAL_ELSE_QWEN","RECIPROCAL_ELSE_SMOL"]
          base_q=sum(r["qwen"]==r["expected"] for r in rows.values())
          base_s=sum(r["smol"]==r["expected"] for r in rows.values())
          best_single=max(base_q,base_s)
          results={}
          for p in policies:
              correct=0; by=defaultdict(lambda:{"correct":0,"total":0})
              for r in rows.values():
                  out=choose(p,r); ok=out==r["expected"]; correct+=ok
                  by[r["domain"]]["correct"]+=ok; by[r["domain"]]["total"]+=1
              worst_reg=max(
                  max(
                    sum(x["qwen"]==x["expected"] for x in rows.values() if x["domain"]==d),
                    sum(x["smol"]==x["expected"] for x in rows.values() if x["domain"]==d)
                  )-v["correct"]
                  for d,v in by.items()
              )
              results[p]={
                "correct":correct,
                "gain_over_best_single":correct-best_single,
                "max_domain_regression_vs_best_single":worst_reg,
                "domain":dict(sorted(by.items()))
              }

          ranked=sorted(policies,key=lambda p:(results[p]["correct"],-results[p]["max_domain_regression_vs_best_single"],p),reverse=True)
          selected=ranked[0]
          sel=results[selected]
          decision="DEV_POLICY_PASS_FREEZE_FOR_FRESH_HOLDOUT_V2" if sel["gain_over_best_single"]>0 and sel["max_domain_regression_vs_best_single"]<=1 else "DEV_POLICY_HOLD_NO_ROBUST_GAIN"

          out={
            "schema":"ELYSIUM_D4_FUSION_REPAIR_DEV_V2",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "classification":"DEV_POLICY_TUNING_NOT_COLD",
            "weights_changed":False,
            "task_count":24,
            "dev_sha256":hashlib.sha256(json.dumps(tasks,sort_keys=True,separators=(",",":")).encode()).hexdigest(),
            "qwen_correct":base_q,
            "smol_correct":base_s,
            "best_single_correct":best_single,
            "candidate_policies":results,
            "selected_policy":selected,
            "selected_metrics":sel,
            "decision":decision,
            "claim_ceiling":"DEV_POLICY_TUNING_ONLY_NOT_COLD_EVIDENCE",
            "independent_evidence_count":0,
            "elapsed_s":round(time.time()-t0,3),
            "max_rss_kb":resource.getrusage(resource.RUSAGE_SELF).ru_maxrss
          }
          out["receipt_sha256"]=hashlib.sha256(json.dumps(out,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          Path("receipts/elysium/d4/elysium-d4-fusion-repair-dev-v2.json").write_text(json.dumps(out,indent=2)+"\n")
          print("SUMMARY "+json.dumps(out,sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elysium-d4-fusion-repair-dev-v2
          path: receipts/elysium/d4/elysium-d4-fusion-repair-dev-v2.json
          if-no-files-found: error
      - name: Persist DEV repair receipt
        if: success()
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/elysium/d4/elysium-d4-fusion-repair-dev-v2.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: ELYSIUM D4 fusion repair DEV V2 ${{ github.run_id }}"
          git pull --rebase origin feat/cerebron-ai-platform-mvp
          git push origin HEAD:feat/cerebron-ai-platform-mvp
