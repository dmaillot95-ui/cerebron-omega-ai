name: CEREBRON Space Bus idempotency gate
on:
  push:
    paths: ["runtime/space_bus_idempotency.py", ".github/workflows/space-bus-idempotency.yml"]
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python runtime/space_bus_idempotency.py
      - uses: actions/upload-artifact@v4
        with: {name: space-bus-idempotency, path: artifacts/space-bus-idempotency/result.json}
