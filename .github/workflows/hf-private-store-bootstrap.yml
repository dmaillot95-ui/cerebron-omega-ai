name: HF Private Store Bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
    steps:
      - name: Install Hugging Face Hub client
        run: python -m pip install --quiet --upgrade huggingface_hub
      - name: Verify private repository write-read integrity
        run: |
          python - <<'PY'
          import os, hashlib, tempfile
          from huggingface_hub import HfApi, hf_hub_download
          token=os.environ["HF_TOKEN"]; repo=os.environ["HF_REPO"]
          api=HfApi(token=token)
          api.create_repo(repo_id=repo, repo_type="model", private=True, exist_ok=True)
          info=api.repo_info(repo_id=repo, repo_type="model")
          if info.private is not True:
              raise SystemExit("HF_PRIVATE_VISIBILITY=FAIL")
          print("HF_PRIVATE_REPO=PASS")
          payload=b"CEREBRON_PRIVATE_MEMORY_TEST_V2\n"
          digest=hashlib.sha256(payload).hexdigest()
          with tempfile.NamedTemporaryFile("wb",delete=False) as t:
              t.write(payload); src=t.name
          api.upload_file(path_or_fileobj=src,path_in_repo="memory/MEMTEST-PRIVATE-0001.txt",repo_id=repo,repo_type="model",commit_message="CEREBRON private integrity fixture")
          print("HF_PRIVATE_WRITE=PASS")
          dst=hf_hub_download(repo_id=repo,filename="memory/MEMTEST-PRIVATE-0001.txt",repo_type="model",token=token,force_download=True)
          with open(dst,"rb") as g: got=g.read()
          if hashlib.sha256(got).hexdigest()!=digest:
              raise SystemExit("HF_PRIVATE_INTEGRITY=FAIL")
          print("HF_PRIVATE_READ=PASS")
          print("HF_PRIVATE_INTEGRITY_SHA256=PASS")
          print("TOKEN_EXPOSED=NO")
          PY
