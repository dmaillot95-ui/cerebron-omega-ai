name: CEREBRON RD Mission Compiler Validate
on:
  push:
    paths: ['config/rd-mission-compiler.json','tools/rd_mission_compiler.py','.github/workflows/rd-mission-compiler.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/rd_mission_compiler.py
