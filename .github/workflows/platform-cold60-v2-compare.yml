name: CEREBRON Cold 60 V2 Runtime Seeded Comparison
# independent-seed-repeat-2
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'platform/cold60_v2_compare.py'
      - 'platform/coalition_tools.py'
      - 'platform/specialist_tools.py'
      - 'platform/coalition.py'
      - 'platform/generative_backend.py'
      - 'platform/model_router.py'
      - 'config/saphea-micro-v1.json'
      - '.github/workflows/platform-cold60-v2-compare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CEREBRON_ENABLE_LOCAL_GENERATIVE: '1'
      CEREBRON_COLD_SEED: ${{ github.run_id }}
      PYTHONPATH: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==5.17.0
      - name: Compile tool workers
        run: python -m compileall -q platform
      - name: Run runtime-seeded M6 comparison
        run: python platform/cold60_v2_compare.py
      - name: Verify sealed artifacts
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path("platform/artifacts")
          d=json.loads((root/"cold60-v2-dataset.json").read_text())
          r=json.loads((root/"cold60-v2-comparison.json").read_text())
          assert d["deny_training"] is True
          assert d["memory_class"]=="M6_COLD_BENCHMARK"
          assert len(d["tasks"])==60
          assert r["dataset_sha"]
          assert r["baseline"]["max_score"]==60
          assert r["adaptive"]["max_score"]==60
          assert len(r["result_sha256"])==64
          print("COLD60_V2_VERIFIED", r["baseline"]["score"], r["adaptive"]["score"], r["domains_improved_count"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cerebron-cold60-v2-runtime-seeded
          path: |
            platform/artifacts/cold60-v2-dataset.json
            platform/artifacts/cold60-v2-comparison.json
