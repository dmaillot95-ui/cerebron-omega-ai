name: Colony Six Model Cold Matrix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/colony-six-model-cold-matrix.yml'

permissions:
  contents: read

concurrency:
  group: colony-six-model-cold-matrix
  cancel-in-progress: false

jobs:
  cold-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - slot: qwen3-4b
            model: Qwen/Qwen3-4B
            revision: 1cfa9a7208912126459214e8b04321603b3df60c
          - slot: qwen3-4b-base
            model: Qwen/Qwen3-4B-Base
            revision: 906bfd4b4dc7f14ee4320094d8b41684abff8539
          - slot: smollm3-3b-base
            model: HuggingFaceTB/SmolLM3-3B-Base
            revision: d78a42f79198603e614095753484a04c10c2b940
          - slot: ministral3-3b-base
            model: mistralai/Ministral-3-3B-Base-2512
            revision: 3dd398144bd567095bc3293dd80e9495ebe03309
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: pip install -q "transformers>=4.53,<5" "torch>=2.3" "accelerate>=1,<2" "safetensors>=0.4"
      - name: Real frozen cold matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL_ID: ${{ matrix.model }}
          REVISION: ${{ matrix.revision }}
          SLOT: ${{ matrix.slot }}
        run: |
          python - <<'PY'
          import json,os,time,hashlib,torch
          from transformers import AutoTokenizer,AutoModelForCausalLM
          model_id=os.environ["MODEL_ID"]; revision=os.environ["REVISION"]; slot=os.environ["SLOT"]
          tasks=json.load(open("benchmarks/COLONY_COLD_TASKS_V1.json"))["tasks"]
          token=os.environ.get("HF_TOKEN")
          t0=time.time(); results=[]
          try:
              tok=AutoTokenizer.from_pretrained(model_id,revision=revision,token=token)
              model=AutoModelForCausalLM.from_pretrained(model_id,revision=revision,token=token,dtype=torch.float32,low_cpu_mem_usage=True)
              load=True
              for task in tasks:
                  x=tok(task["prompt"],return_tensors="pt"); t=time.time()
                  with torch.no_grad(): y=model.generate(**x,max_new_tokens=96,do_sample=False)
                  out=tok.decode(y[0][x["input_ids"].shape[1]:],skip_special_tokens=True).strip()
                  results.append({"task_id":task["id"],"colony":task["colony"],"seconds":round(time.time()-t,3),"output":out,"sha256":hashlib.sha256(out.encode()).hexdigest()})
              status="RUNTIME_PASS_AUDIT_REQUIRED"
          except Exception as e:
              load=False; status="RUNTIME_FAILURE"; results.append({"error":repr(e)})
          receipt={"schema":"cerebron-real-cold-matrix-v2","model":model_id,"revision":revision,"slot":slot,"real_inference":load,"total_seconds":round(time.time()-t0,3),"results":results,"status":status,"scoring":"NOT_SELF_SCORED_REQUIRES_AUDIT","binding":"DENY"}
          os.makedirs("receipts/runtime",exist_ok=True)
          json.dump(receipt,open(f"receipts/runtime/{slot}-cold-matrix.json","w"),indent=2)
          print(json.dumps(receipt,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cold-matrix-${{ matrix.slot }}
          path: receipts/runtime/${{ matrix.slot }}-cold-matrix.json
          retention-days: 90
