name: SAPHEA-A System Architect Canary
on:
  push:
    branches:
      - main
    paths:
      - config/saphea-a-system-architect-canary-trigger.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-smollm3-3b-a07cc9a04f16550a088caea529712d1d335b0ac1
      - run: pip install --quiet "transformers>=4.53,<5" accelerate safetensors sentencepiece
      - name: Execute SAPHEA-A repaired SYSTEM_ARCHITECT role
        run: python tools/s5_transfer_worker_v3.py --worker "SAPHEA-A" --run-id "${{ github.run_id }}" --output "artifacts/SAPHEA-A/receipt.json"
      - name: Deterministic canary check
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          x=json.loads(Path("artifacts/SAPHEA-A/receipt.json").read_text())
          raw=" ".join(x.get("raw_output","").lower().split())
          required=[
            r"simulation.*not.*(physical|representative).*test",
            r"(physical|representative).*test",
            r"(uncertaint|boundary condition|assumption)",
          ]
          forbidden=[
            r"simulation (result )?alone (validates|proves|confirms)",
            r"simulation can validate the claim",
            r"no physical (or representative )?test .* needed",
          ]
          assert x.get("llm_inference") is True and x.get("inference")=="PASS"
          assert x.get("parse_ok") is True
          assert x.get("prompt_echo") is False
          assert all(re.search(p,raw) for p in required), raw
          assert not any(re.search(p,raw) for p in forbidden), raw
          print(json.dumps({"status":"PASS","worker":"SAPHEA-A","role":"SYSTEM_ARCHITECT","critical_false_validation":False},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saphea-a-system-architect-canary-${{ github.run_id }}
          path: artifacts/SAPHEA-A/receipt.json
