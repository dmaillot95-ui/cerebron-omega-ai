name: CEREBRON Farm Bootstrap Manifest Validate
on:
  push:
    paths: ['config/farm-bootstrap.json','tools/farm_bootstrap.py','.github/workflows/farm-bootstrap.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/farm_bootstrap.py
