name: RDX Semantic Retrieval Canary V1
on:
  push:
    branches: ['feat/cerebron-ai-platform-mvp']
    paths:
      - 'config/rdx-semantic-retrieval-canary-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
      EMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install semantic retrieval runtime
        run: |
          python -m pip install --quiet --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet --no-cache-dir sentence-transformers huggingface_hub numpy
      - name: Execute private RDX semantic retrieval canary
        run: python runtime/rdx_semantic_retrieval_canary_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: rdx-semantic-retrieval-canary-v1
          path: receipts/rdx/rdx-semantic-retrieval-canary-v1.json
          if-no-files-found: error
      - name: Persist public receipt
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/rdx/rdx-semantic-retrieval-canary-v1.json
          git diff --cached --quiet && exit 0
          git commit -m "receipt: RDX semantic retrieval canary ${{ github.run_id }}"
          git pull --rebase origin feat/cerebron-ai-platform-mvp
          git push origin HEAD:feat/cerebron-ai-platform-mvp
