name: CEREBRON Coalition Databank Validate
on:
  push:
    paths: ['config/coalition-databank.json','tools/coalition_databank.py','.github/workflows/coalition-databank.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/coalition_databank.py
