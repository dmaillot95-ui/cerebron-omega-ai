name: Specialist Ablation Cold Benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - "benchmarks/specialist_ablation_v1.py"
      - ".github/workflows/specialist-ablation.yml"
permissions:
  contents: read
jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python benchmarks/specialist_ablation_v1.py
      - name: Verify benchmark boundaries
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/specialist_ablation.json"))
          assert d["benchmark"]=="COLD_SYNTHETIC_POLICY_GATE"
          assert d["specialist_score"] > d["baseline_score"]
          assert "NOT_MODEL_INTELLIGENCE_BENCHMARK" in d["limits"]
          assert "NOT_PHYSICAL_VALIDATION" in d["limits"]
          print("SPECIALIST_ABLATION",d["baseline_score"],d["specialist_score"],d["gain"],d["sha256"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: specialist-ablation-cold
          path: artifacts/specialist_ablation.json
          if-no-files-found: error
          retention-days: 7
