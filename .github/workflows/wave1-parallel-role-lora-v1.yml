name: CEREBRON Wave1 Parallel Role LoRA
on:
  push:
    branches: ['feat/wave1-parallel-ai-baselines-v1']
    paths:
      - 'config/wave1-parallel-lora-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  train:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        role: [AELYS, ETHERION, AFAH, METRION]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: platform
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: cerebron-omega/cerebron-private-memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache Qwen 0.5B
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen25-05b-ec7ddfa904d4d447eedd0b7f126df16957734abb
      - name: Install pinned CPU LoRA stack
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.14.0
          python -m pip install --disable-pip-version-check --no-cache-dir transformers==5.17.0 peft==0.21.0 accelerate safetensors sentencepiece huggingface_hub
      - name: Compile exact dataset and training chain
        run: |
          python -m py_compile tools/wave1_quarantine_candidate_builder.py
          python -m py_compile tools/wave1_versioned_split_builder_v1.py
          python -m py_compile tools/wave1_cold_suite_builder_v1.py
          python -m py_compile tools/wave1_dataset_release_gate_v1.py
          python -m py_compile platform/wave1_role_lora_train_v1.py
      - name: Reproduce released dataset package
        run: |
          python tools/wave1_quarantine_candidate_builder.py --output artifacts/wave1-quarantine-candidates-v1.json
          python tools/wave1_versioned_split_builder_v1.py             --candidates artifacts/wave1-quarantine-candidates-v1.json             --admission training/WAVE1_DATA_ADMISSION_V1.json             --output-dir artifacts/wave1-splits
          python tools/wave1_cold_suite_builder_v1.py --output-dir artifacts/wave1-cold
          python tools/wave1_dataset_release_gate_v1.py             --candidates artifacts/wave1-quarantine-candidates-v1.json             --split-dir artifacts/wave1-splits             --cold-dir artifacts/wave1-cold             --admission training/WAVE1_DATA_ADMISSION_V1.json             --baseline-config config/wave1-parallel-role-baseline-v1.json             --output artifacts/reproduced-release.json
          python - <<'PY'
          import json
          a=json.load(open("training/WAVE1_PARALLEL_TRAINING_RELEASE_V1.json"))
          b=json.load(open("artifacts/reproduced-release.json"))
          assert a["training_released"] is True
          assert b["training_released"] is True
          assert a["release_sha256"]==b["release_sha256"],(a["release_sha256"],b["release_sha256"])
          print("WAVE1_RELEASE_REPRODUCED",a["release_sha256"])
          PY
      - name: Train real scoped LoRA
        run: |
          ROLE="${{ matrix.role }}"
          role_lc=$(echo "$ROLE" | tr '[:upper:]' '[:lower:]')
          python platform/wave1_role_lora_train_v1.py             --role "$ROLE"             --split "artifacts/wave1-splits/${role_lc}-split-v1.json"             --m6 "artifacts/wave1-cold/${role_lc}-m6-v1.json"             --transfer "artifacts/wave1-cold/${role_lc}-transfer-v1.json"             --red "artifacts/wave1-cold/${role_lc}-red-v1.json"             --release training/WAVE1_PARALLEL_TRAINING_RELEASE_V1.json             --output-root "artifacts/wave1-training/${role_lc}"
      - name: Store adapter in private Hugging Face and verify readback
        run: |
          mkdir -p receipts/wave1
          ROLE="${{ matrix.role }}"
          role_lc=$(echo "$ROLE" | tr '[:upper:]' '[:lower:]')
          export ROLE role_lc
          python - <<'PY'
          import hashlib,json,os,pathlib
          from huggingface_hub import HfApi,hf_hub_download

          role=os.environ["ROLE"]
          role_lc=os.environ["role_lc"]
          root=pathlib.Path("artifacts/wave1-training")/role_lc
          report=json.loads((root/"training-report.json").read_text())
          adapter=root/"adapter"/"adapter_model.safetensors"
          cfg=root/"adapter"/"adapter_config.json"
          token=os.environ.get("HF_TOKEN","").strip()
          if not token: raise SystemExit("HF_TOKEN_MISSING")
          repo=os.environ["HF_REPO"]
          api=HfApi(token=token)
          info=api.repo_info(repo_id=repo,repo_type="model")
          if not bool(getattr(info,"private",False)): raise SystemExit("HF_REPO_NOT_PRIVATE")
          run_id=os.environ["GITHUB_RUN_ID"]
          prefix=f"wave1/{role}/LORA-V1/run-{run_id}"
          api.upload_folder(folder_path=str(root/"adapter"),path_in_repo=prefix,repo_id=repo,repo_type="model",commit_message=f"Wave1 {role} LoRA run {run_id}")
          got=pathlib.Path(hf_hub_download(repo_id=repo,filename=prefix+"/adapter_model.safetensors",repo_type="model",token=token,force_download=True))
          gotcfg=pathlib.Path(hf_hub_download(repo_id=repo,filename=prefix+"/adapter_config.json",repo_type="model",token=token,force_download=True))
          asha=hashlib.sha256(got.read_bytes()).hexdigest()
          csha=hashlib.sha256(gotcfg.read_bytes()).hexdigest()
          assert asha==report["adapter_file_sha256"]
          assert csha==report["adapter_config_sha256"]
          receipt={
            "schema":"CEREBRON_WAVE1_ROLE_LORA_PUBLIC_POINTER_V1",
            "run_id":int(run_id),
            "role":role,
            "real_training":True,
            "training_executed":True,
            "base_model_id":report["base_model_id"],
            "base_revision":report["base_revision"],
            "release_sha256":report["release_sha256"],
            "split_sha256":report["split_sha256"],
            "cold_dataset_sha256":report["cold_dataset_sha256"],
            "cold_deny_training":True,
            "weights_changed":report["weights_changed"],
            "adapter_sha256":report["adapter_file_sha256"],
            "adapter_config_sha256":report["adapter_config_sha256"],
            "hf_private_repo":repo,
            "hf_private_object_prefix":prefix,
            "hf_private_readback_sha_pass":True,
            "gains":report["gains"],
            "any_critical_regression":report["any_critical_regression"],
            "validation_gate_pass":report["validation_gate_pass"],
            "cold_gate_pass":report["cold_gate_pass"],
            "decision":report["decision"],
            "promotion":"NOT_PROMOTED",
            "pending":report["pending"],
            "report_sha256":report["report_sha256"],
            "claim_ceiling":report["claim_ceiling"]
          }
          out=pathlib.Path("receipts/wave1")/f"{role_lc}-lora-{run_id}.json"
          out.write_text(json.dumps(receipt,indent=2)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Remove private adapter from GitHub artifact set
        run: |
          ROLE="${{ matrix.role }}"
          role_lc=$(echo "$ROLE" | tr '[:upper:]' '[:lower:]')
          rm -rf "artifacts/wave1-training/${role_lc}/adapter"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave1-role-lora-${{ matrix.role }}
          path: |
            artifacts/wave1-training/
            receipts/wave1/*-lora-${{ github.run_id }}.json
          if-no-files-found: warn

  audit:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wave1-role-lora-*
          path: downloaded/wave1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit four real training receipts
        run: |
          mkdir -p receipts/wave1
          python - <<'PY'
          import glob,hashlib,json,os,pathlib,shutil
          files=sorted(set(glob.glob("downloaded/wave1/**/receipts/wave1/*-lora-*.json",recursive=True)))
          rows=[]
          for p in files:
              d=json.loads(pathlib.Path(p).read_text())
              if d.get("schema")=="CEREBRON_WAVE1_ROLE_LORA_PUBLIC_POINTER_V1":
                  rows.append(d)
                  shutil.copy2(p,pathlib.Path("receipts/wave1")/pathlib.Path(p).name)
          by={r["role"]:r for r in rows}
          expected=["AELYS","ETHERION","AFAH","METRION"]
          assert sorted(by)==sorted(expected),(sorted(by),files)
          assert len(rows)==4
          assert all(r["real_training"] and r["training_executed"] for r in rows)
          assert all(r["weights_changed"] for r in rows)
          assert all(r["hf_private_readback_sha_pass"] for r in rows)
          assert all(r["cold_deny_training"] for r in rows)
          out={
            "schema":"CEREBRON_WAVE1_PARALLEL_LORA_AUDIT_V1",
            "run_id":int(os.environ["GITHUB_RUN_ID"]),
            "role_count":4,
            "training_executed_count":4,
            "weights_changed_count":sum(r["weights_changed"] for r in rows),
            "hf_readback_pass_count":sum(r["hf_private_readback_sha_pass"] for r in rows),
            "g6_candidate_count":sum(str(r["decision"]).startswith("G6_CANDIDATE") for r in rows),
            "rollback_count":sum(r["decision"]=="ROLLBACK_RETAIN_EVIDENCE" for r in rows),
            "unique_base_lineage_count":1,
            "independent_evidence_count":0,
            "roles":{r["role"]:{
              "adapter_sha256":r["adapter_sha256"],
              "gains":r["gains"],
              "critical_regression":r["any_critical_regression"],
              "validation_gate_pass":r["validation_gate_pass"],
              "cold_gate_pass":r["cold_gate_pass"],
              "decision":r["decision"]
            } for r in rows},
            "claim_ceiling":"FOUR_REAL_SCOPED_LORA_TRAININGS_WITH_SEPARATE_ADAPTERS_SHARED_BASE_LINEAGE_NO_AUTO_PROMOTION"
          }
          raw=json.dumps(out,sort_keys=True,separators=(",",":")).encode()
          out["audit_sha256"]=hashlib.sha256(raw).hexdigest()
          p=pathlib.Path("receipts/wave1")/f"wave1-parallel-lora-audit-{os.environ['GITHUB_RUN_ID']}.json"
          p.write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave1-parallel-lora-audit-${{ github.run_id }}
          path: receipts/wave1/
      - name: Persist four pointers and audit
        run: |
          git config user.name cerebron-bot
          git config user.email actions@users.noreply.github.com
          git add receipts/wave1/
          git diff --cached --quiet && exit 0
          git commit -m "receipt: Wave1 parallel LoRA audit ${{ github.run_id }}"
          for i in 1 2 3; do
            git pull --rebase origin feat/wave1-parallel-ai-baselines-v1 && git push && exit 0
            sleep 5
          done
          exit 1
