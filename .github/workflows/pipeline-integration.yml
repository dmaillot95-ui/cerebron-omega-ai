name: CEREBRON Pipeline Integration Validate
on:
  push:
    paths: ['config/pipeline-integration.json','tools/pipeline_integration.py','.github/workflows/pipeline-integration.yml']
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/pipeline_integration.py
